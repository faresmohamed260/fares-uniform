name: Phase 9 R2 ingest bridge cleanup

on:
  push:
    branches:
      - phase-9/public-site-kinetic-prototype
    paths:
      - ".github/workflows/phase9-r2-ingest-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete temporary ingest Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          account_id="9b0bf4a19a68badb653f984151b62fd2"
          script_name="fares-uniform-phase9-r2-ingest"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$script_name"

          response="$(curl --fail-with-body --silent --show-error             -X DELETE             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$endpoint")"
          jq -e '.success == true' <<<"$response" >/dev/null
          echo "Temporary Phase 9 ingest Worker deleted"

          for attempt in $(seq 1 12); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}'               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$endpoint")"
            if [ "$status" = "404" ]; then
              echo "Deletion verified"
              exit 0
            fi
            sleep 5
          done
          echo "Worker deletion did not settle to 404" >&2
          exit 1
