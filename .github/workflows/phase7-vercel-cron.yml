name: Phase 7 Vercel cron trigger

on:
  push:
    branches:
      - phase-7/vercel-deployment-adaptation
    paths:
      - 'Dockerfile.vercel'
      - 'deploy/vercel/**'
      - 'deploy/ci/phase7_cron_*.py'
      - 'deploy/postgres/**'
      - '.github/workflows/phase7-vercel-cron.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-vercel-cron-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_APP_SHA: cc2656d7529cfd4af396ddd0af6444a0f6600dc8
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  ODOO_DB_NAME: fares
  ODOO_DB_USER: fares_app
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting
  PHASE7_NETWORK: fares-phase7-cron
  PHASE7_DB_CONTAINER: fares-phase7-cron-db
  PHASE7_ODOO_A: fares-phase7-cron-odoo-a
  PHASE7_ODOO_B: fares-phase7-cron-odoo-b
  PHASE7_HTTP_PORT_A: '18069'
  PHASE7_HTTP_PORT_B: '18070'

jobs:
  external-cron-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact head and inherited application source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_APP_SHA"
          git diff --quiet "$BASE_APP_SHA" HEAD -- addons apps/public-web
          mkdir -p evidence
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "base_application_sha=$BASE_APP_SHA"
            echo "odoo_sha=$ODOO_SHA"
            echo "application_source_diff=none"
          } | tee evidence/source-authority.txt

      - name: Prepare synthetic credentials
        run: |
          set -euo pipefail
          mkdir -p deploy/.phase7-secrets evidence
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/postgres_superuser_password >/dev/null
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/odoo_db_password >/dev/null
          openssl rand -hex 32 > deploy/.phase7-secrets/odoo_admin_passwd
          openssl rand -hex 32 > deploy/.phase7-secrets/cron_secret
          sudo chown root:root deploy/.phase7-secrets/postgres_superuser_password
          sudo chmod 0400 deploy/.phase7-secrets/postgres_superuser_password
          sudo chown root:10001 deploy/.phase7-secrets/odoo_db_password
          sudo chmod 0440 deploy/.phase7-secrets/odoo_db_password
          chmod 0600 deploy/.phase7-secrets/odoo_admin_passwd deploy/.phase7-secrets/cron_secret
          CRON_SECRET="$(cat deploy/.phase7-secrets/cron_secret)"
          echo "::add-mask::$CRON_SECRET"

      - name: Build exact database and Vercel-target Odoo images
        run: |
          set -euo pipefail
          docker build --pull \
            -f deploy/postgres/Dockerfile \
            -t "fares-uniform-postgres:$GITHUB_SHA" .
          docker build --pull \
            -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$GITHUB_SHA" \
            -t "fares-uniform-vercel:$GITHUB_SHA" .

          test "$(docker image inspect -f '{{json .Config.Volumes}}' "fares-uniform-vercel:$GITHUB_SHA")" = 'null'
          docker run --rm --entrypoint bash "fares-uniform-vercel:$GITHUB_SHA" -lc '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test "$ODOO_SHA" = "1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf"
            test "$FARES_SHA" = "'"$GITHUB_SHA"'"
            test -f /mnt/runtime-addons/fares_vercel_runtime/cron_controller.py
            test ! -e /mnt/extra-addons/fu_uat
          '
          echo 'cron_runtime_image=PASS stateless=true' | tee evidence/runtime-image.txt

      - name: Start PostgreSQL and bootstrap shared session state
        run: |
          set -euo pipefail
          docker network create "$PHASE7_NETWORK"
          docker run -d \
            --name "$PHASE7_DB_CONTAINER" \
            --network "$PHASE7_NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_superuser_password \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e FARES_DB_PASSWORD_FILE=/run/secrets/odoo_db_password \
            -v "$PWD/deploy/.phase7-secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro" \
            -v "$PWD/deploy/.phase7-secrets/odoo_db_password:/run/secrets/odoo_db_password:ro" \
            -v "$PWD/deploy/postgres/init/10-fares.sh:/docker-entrypoint-initdb.d/10-fares.sh:ro" \
            "fares-uniform-postgres:$GITHUB_SHA"

          for attempt in $(seq 1 60); do
            INIT_READY="$(docker exec "$PHASE7_DB_CONTAINER" \
              psql -U postgres -d "$ODOO_DB_NAME" -Atc \
              "SELECT CASE WHEN
                 EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ODOO_DB_USER')
                 AND (SELECT count(*) FROM pg_extension WHERE extname IN ('pg_trgm', 'unaccent')) = 2
                 AND has_schema_privilege('$ODOO_DB_USER', 'public', 'USAGE')
                 AND has_schema_privilege('$ODOO_DB_USER', 'public', 'CREATE')
               THEN 'ready' ELSE 'waiting' END;" 2>/dev/null || true)"
            if [[ "$INIT_READY" == 'ready' ]]; then break; fi
            if [[ "$attempt" == 60 ]]; then docker logs "$PHASE7_DB_CONTAINER"; exit 1; fi
            sleep 2
          done

          cat deploy/vercel/bootstrap-session-store.sh | docker exec -i \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e POSTGRES_USER=postgres \
            "$PHASE7_DB_CONTAINER" bash

          ROLE_FLAGS="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d postgres -Atc "SELECT rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = '$ODOO_DB_USER';")"
          test "$ROLE_FLAGS" = 'f|f|f'
          DB_OWNER="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d postgres -Atc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$ODOO_DB_NAME';")"
          test "$DB_OWNER" = 'postgres'
          {
            echo "app_role_flags=$ROLE_FLAGS"
            echo "database_owner=$DB_OWNER"
          } | tee evidence/database-boundary.txt

      - name: Initialize and upgrade production addons
        run: |
          set -euo pipefail
          DB_PASSWORD="$(sudo cat deploy/.phase7-secrets/odoo_db_password)"
          ADMIN_PASSWD="$(cat deploy/.phase7-secrets/odoo_admin_passwd)"
          for MODE in install upgrade; do
            if [[ "$MODE" == install ]]; then ACTION=-i; else ACTION=-u; fi
            docker run --rm \
              --network "$PHASE7_NETWORK" \
              -e ODOO_DB_HOST="$PHASE7_DB_CONTAINER" \
              -e ODOO_DB_PORT=5432 \
              -e ODOO_DB_NAME="$ODOO_DB_NAME" \
              -e ODOO_DB_USER="$ODOO_DB_USER" \
              -e ODOO_DB_PASSWORD="$DB_PASSWORD" \
              -e ODOO_DB_SSLMODE=prefer \
              -e ODOO_ADMIN_PASSWD="$ADMIN_PASSWD" \
              -e PORT=8069 \
              -e ODOO_WORKERS=0 \
              -e ODOO_MAX_CRON_THREADS=0 \
              "fares-uniform-vercel:$GITHUB_SHA" \
              --stop-after-init "$ACTION" "$PRODUCTION_ADDONS"
          done
          echo 'production_addons_init_upgrade=PASS' | tee evidence/addon-init.txt

      - name: Start two stateless Odoo runtimes with built-in cron disabled
        run: |
          set -euo pipefail
          DB_PASSWORD="$(sudo cat deploy/.phase7-secrets/odoo_db_password)"
          ADMIN_PASSWD="$(cat deploy/.phase7-secrets/odoo_admin_passwd)"
          CRON_SECRET="$(cat deploy/.phase7-secrets/cron_secret)"
          echo "::add-mask::$CRON_SECRET"

          start_runtime() {
            local name="$1"
            local host_port="$2"
            docker run -d \
              --name "$name" \
              --network "$PHASE7_NETWORK" \
              -p "$host_port:8069" \
              -e ODOO_DB_HOST="$PHASE7_DB_CONTAINER" \
              -e ODOO_DB_PORT=5432 \
              -e ODOO_DB_NAME="$ODOO_DB_NAME" \
              -e ODOO_DB_USER="$ODOO_DB_USER" \
              -e ODOO_DB_PASSWORD="$DB_PASSWORD" \
              -e ODOO_DB_SSLMODE=prefer \
              -e ODOO_ADMIN_PASSWD="$ADMIN_PASSWD" \
              -e CRON_SECRET="$CRON_SECRET" \
              -e PORT=8069 \
              -e ODOO_WORKERS=0 \
              -e ODOO_MAX_CRON_THREADS=0 \
              "fares-uniform-vercel:$GITHUB_SHA"
          }

          start_runtime "$PHASE7_ODOO_A" "$PHASE7_HTTP_PORT_A"
          start_runtime "$PHASE7_ODOO_B" "$PHASE7_HTTP_PORT_B"

          for port in "$PHASE7_HTTP_PORT_A" "$PHASE7_HTTP_PORT_B"; do
            for attempt in $(seq 1 40); do
              if curl -fsS "http://127.0.0.1:$port/web/login" >/dev/null; then break; fi
              if [[ "$attempt" == 40 ]]; then
                docker logs "$PHASE7_ODOO_A" || true
                docker logs "$PHASE7_ODOO_B" || true
                exit 1
              fi
              sleep 2
            done
          done

          test "$(docker inspect -f '{{json .Mounts}}' "$PHASE7_ODOO_A")" = '[]'
          test "$(docker inspect -f '{{json .Mounts}}' "$PHASE7_ODOO_B")" = '[]'
          docker exec "$PHASE7_ODOO_A" grep -Fx 'workers = 0' /tmp/fares-odoo.conf
          docker exec "$PHASE7_ODOO_A" grep -Fx 'max_cron_threads = 0' /tmp/fares-odoo.conf
          docker exec "$PHASE7_ODOO_B" grep -Fx 'workers = 0' /tmp/fares-odoo.conf
          docker exec "$PHASE7_ODOO_B" grep -Fx 'max_cron_threads = 0' /tmp/fares-odoo.conf
          echo 'two_stateless_runtimes=PASS builtin_cron_threads=0' | tee evidence/runtime-pair.txt

      - name: Seed one due cron and prove no immortal scheduler runs it
        run: |
          set -euo pipefail
          cat deploy/ci/phase7_cron_seed.py | docker exec -i "$PHASE7_ODOO_A" \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" --workers=0 \
            | tee evidence/cron-seed.txt
          grep -q 'PHASE7_CRON_SEED_OK' evidence/cron-seed.txt

          sleep 5
          cat deploy/ci/phase7_cron_verify.py | docker exec -i \
            -e PHASE7_EXPECTED_CRON_EXECUTIONS=0 \
            "$PHASE7_ODOO_B" \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" --workers=0 \
            | tee evidence/cron-before-trigger.txt
          grep -q 'PHASE7_CRON_VERIFY_OK expected=0' evidence/cron-before-trigger.txt
          echo 'immortal_scheduler_absent=PASS' | tee evidence/cron-idle.txt

      - name: Reject unauthenticated and invalid cron requests
        run: |
          set -euo pipefail
          NO_AUTH_STATUS="$(curl -sS -o evidence/cron-no-auth.json -w '%{http_code}' \
            "http://127.0.0.1:$PHASE7_HTTP_PORT_A/fares/internal/cron/run")"
          test "$NO_AUTH_STATUS" = '401'

          WRONG_STATUS="$(curl -sS -o evidence/cron-wrong-auth.json -w '%{http_code}' \
            -H 'Authorization: Bearer definitely-wrong-phase7-token' \
            "http://127.0.0.1:$PHASE7_HTTP_PORT_B/fares/internal/cron/run")"
          test "$WRONG_STATUS" = '401'

          cat deploy/ci/phase7_cron_verify.py | docker exec -i \
            -e PHASE7_EXPECTED_CRON_EXECUTIONS=0 \
            "$PHASE7_ODOO_A" \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" --workers=0 \
            | tee evidence/cron-after-rejected-auth.txt
          grep -q 'PHASE7_CRON_VERIFY_OK expected=0' evidence/cron-after-rejected-auth.txt
          {
            echo "missing_auth_http_status=$NO_AUTH_STATUS"
            echo "invalid_auth_http_status=$WRONG_STATUS"
            echo 'rejected_requests_executed_jobs=0'
          } | tee evidence/cron-auth.txt

      - name: Prove concurrent authenticated triggers execute the due job exactly once
        run: |
          set -euo pipefail
          CRON_SECRET="$(cat deploy/.phase7-secrets/cron_secret)"
          echo "::add-mask::$CRON_SECRET"
          SESSION_ROWS_BEFORE="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc 'SELECT count(*) FROM public.fares_http_session;')"

          (
            curl -sS -o evidence/cron-trigger-a.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "http://127.0.0.1:$PHASE7_HTTP_PORT_A/fares/internal/cron/run" \
              > evidence/cron-trigger-a.status
          ) &
          PID_A=$!
          (
            curl -sS -o evidence/cron-trigger-b.json -w '%{http_code}' \
              -H "Authorization: Bearer $CRON_SECRET" \
              "http://127.0.0.1:$PHASE7_HTTP_PORT_B/fares/internal/cron/run" \
              > evidence/cron-trigger-b.status
          ) &
          PID_B=$!
          wait "$PID_A"
          wait "$PID_B"

          test "$(cat evidence/cron-trigger-a.status)" = '200'
          test "$(cat evidence/cron-trigger-b.status)" = '200'
          jq -e '.status == "ok"' evidence/cron-trigger-a.json >/dev/null
          jq -e '.status == "ok"' evidence/cron-trigger-b.json >/dev/null

          cat deploy/ci/phase7_cron_verify.py | docker exec -i \
            -e PHASE7_EXPECTED_CRON_EXECUTIONS=1 \
            "$PHASE7_ODOO_A" \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" --workers=0 \
            | tee evidence/cron-after-concurrent-trigger.txt
          grep -q 'PHASE7_CRON_VERIFY_OK expected=1' evidence/cron-after-concurrent-trigger.txt

          THIRD_STATUS="$(curl -sS -o evidence/cron-trigger-third.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:$PHASE7_HTTP_PORT_A/fares/internal/cron/run")"
          test "$THIRD_STATUS" = '200'
          jq -e '.status == "ok"' evidence/cron-trigger-third.json >/dev/null

          cat deploy/ci/phase7_cron_verify.py | docker exec -i \
            -e PHASE7_EXPECTED_CRON_EXECUTIONS=1 \
            "$PHASE7_ODOO_B" \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" --workers=0 \
            | tee evidence/cron-after-repeat-trigger.txt
          grep -q 'PHASE7_CRON_VERIFY_OK expected=1' evidence/cron-after-repeat-trigger.txt

          SESSION_ROWS_AFTER="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc 'SELECT count(*) FROM public.fares_http_session;')"
          test "$SESSION_ROWS_AFTER" = "$SESSION_ROWS_BEFORE"

          {
            echo 'phase7_external_cron_trigger=PASS'
            echo 'vercel_cron_method=GET'
            echo 'vercel_cron_auth=CRON_SECRET_bearer'
            echo 'concurrent_valid_trigger_http_status_a=200'
            echo 'concurrent_valid_trigger_http_status_b=200'
            echo "repeat_valid_trigger_http_status=$THIRD_STATUS"
            echo 'due_job_execution_count=1'
            echo 'native_odoo_row_locking=FOR_NO_KEY_UPDATE_SKIP_LOCKED'
            echo 'builtin_odoo_cron_threads=0'
            echo 'session_rows_changed_by_cron_route=false'
          } | tee evidence/result.txt

      - name: Upload Phase 7 cron evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-vercel-cron-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$PHASE7_ODOO_A" "$PHASE7_ODOO_B" "$PHASE7_DB_CONTAINER" 2>/dev/null || true
          docker network rm "$PHASE7_NETWORK" 2>/dev/null || true
          sudo rm -rf deploy/.phase7-secrets
