name: Phase 8 managed DB writer hardening contract

on:
  push:
    branches:
      - phase-8/managed-db-write-hardening
    paths:
      - .github/workflows/phase8-hardening-contract.yml
      - .github/workflows/phase8-live-db-recovery.yml
      - .github/workflows/phase8-seal-runtime-privileges.yml
      - .github/workflows/phase8-supabase-control-plane.yml
      - .github/workflows/phase8-vercel-bootstrap-restore-deploy.yml
      - .github/workflows/phase8-vercel-first-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |f| YAML.parse_file(f); puts "yaml=PASS #{f}" }'

      - name: Verify single-authority managed DB writers
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/phase8-supabase-control-plane.yml
          test ! -e .github/workflows/phase8-vercel-bootstrap-restore-deploy.yml
          test ! -e .github/workflows/phase8-vercel-first-deploy.yml
          grep -Fq 'group: phase8-managed-db-mutation' .github/workflows/phase8-live-db-recovery.yml
          grep -Fq 'group: phase8-managed-db-mutation' .github/workflows/phase8-seal-runtime-privileges.yml
          ! grep -Fq 'push:' .github/workflows/phase8-live-db-recovery.yml
          grep -Fq 'REVOKE CREATE ON SCHEMA public FROM fares_app;' .github/workflows/phase8-live-db-recovery.yml
          grep -Fq 'ALTER ROLE fares_app NOLOGIN PASSWORD NULL;' .github/workflows/phase8-live-db-recovery.yml
          grep -Fq 'REVOKE CREATE ON SCHEMA public FROM fares_app;' .github/workflows/phase8-seal-runtime-privileges.yml
          echo 'managed_db_writer_hardening_contract=PASS'
