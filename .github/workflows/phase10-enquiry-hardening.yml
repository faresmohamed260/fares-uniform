name: Phase 10 enquiry hardening

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-enquiry-hardening.yml"
      - "docs/validation/PHASE_10_PUBLIC_SITE_PRODUCTIONIZATION.md"
  pull_request:
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-enquiry-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-enquiry-hardening-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  enquiry-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FU_PUBLIC_PROVIDER: fixture
      PUBLIC_SITE_ORIGIN: https://faresuniform.uk
    defaults:
      run:
        working-directory: apps/public-web

    steps:
      - name: Checkout exact Phase 10 candidate
        uses: actions/checkout@v5

      - name: Verify exact source
        run: test "$(git -C ../.. rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck production public web
        run: npm run typecheck

      - name: Build production public web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hardened enquiry contract
        run: npx playwright test tests/enquiry-hardening.spec.ts

      - name: Record exact evidence identity
        if: always()
        run: |
          mkdir -p evidence/phase10-enquiry
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "intake_fields=9"
            echo "provider=$FU_PUBLIC_PROVIDER"
            node --version
            npm --version
            npx next --version
            npx playwright --version
          } > evidence/phase10-enquiry/runtime.txt

      - name: Upload enquiry hardening evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase10-enquiry-hardening-${{ github.sha }}
          path: |
            apps/public-web/evidence/phase10-enquiry
            apps/public-web/playwright-report
            apps/public-web/test-results
          if-no-files-found: warn
          retention-days: 14
