name: Phase 6 deployment readiness

on:
  push:
    branches:
      - phase-6/deployment-readiness
    paths:
      - 'deploy/**'
      - '.github/workflows/phase6-deployment-readiness.yml'
      - 'addons/**'
      - 'apps/public-web/**'
      - 'docs/phases/PHASE_6_DEPLOYMENT_READINESS.md'
      - 'docs/architecture/PHASE_6_DEPLOYMENT_ARCHITECTURE.md'
      - 'docs/operations/DEPLOYMENT_READINESS.md'
      - 'PROJECT.md'
      - 'docs/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_APP_SHA: cc2656d7529cfd4af396ddd0af6444a0f6600dc8
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  ODOO_DB_NAME: fares
  ODOO_DB_USER: fares_app
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting

jobs:
  deployment-restore-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact head and inherited application source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_APP_SHA"
          git diff --quiet "$BASE_APP_SHA" HEAD -- addons apps/public-web
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "base_application_sha=$BASE_APP_SHA"
            echo "odoo_sha=$ODOO_SHA"
            echo "application_source_diff=none"
          } | tee phase6-source-authority.txt

      - name: Prepare synthetic runtime secrets and TLS
        run: |
          set -euo pipefail
          mkdir -p deploy/.secrets deploy/.runtime/tls deploy/.runtime/backups evidence
          printf '%s\n' 'phase6-postgres-superuser-synthetic-2026' > deploy/.secrets/postgres_superuser_password
          printf '%s\n' 'phase6-odoo-db-synthetic-2026' > deploy/.secrets/odoo_db_password
          printf '%s\n' 'phase6-odoo-master-synthetic-2026' > deploy/.secrets/odoo_admin_passwd
          sudo chown root:root deploy/.secrets/postgres_superuser_password
          sudo chmod 0400 deploy/.secrets/postgres_superuser_password
          sudo chown root:10001 deploy/.secrets/odoo_db_password deploy/.secrets/odoo_admin_passwd
          sudo chmod 0440 deploy/.secrets/odoo_db_password deploy/.secrets/odoo_admin_passwd
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout deploy/.runtime/tls/privkey.pem \
            -out deploy/.runtime/tls/fullchain.pem \
            -subj '/CN=localhost' >/dev/null 2>&1
          cat > deploy/.env <<EOF
          COMPOSE_PROJECT_NAME=fares-phase6
          FARES_SHA=$GITHUB_SHA
          ODOO_SHA=$ODOO_SHA
          ODOO_DB_NAME=$ODOO_DB_NAME
          ODOO_DB_USER=$ODOO_DB_USER
          ODOO_WORKERS=2
          ODOO_MAX_CRON_THREADS=1
          ODOO_DB_MAXCONN=32
          ODOO_LIMIT_MEMORY_SOFT=1073741824
          ODOO_LIMIT_MEMORY_HARD=1342177280
          ODOO_LIMIT_TIME_CPU=120
          ODOO_LIMIT_TIME_REAL=240
          ODOO_LIMIT_TIME_REAL_CRON=600
          HTTP_PORT=18080
          HTTPS_PORT=18443
          POSTGRES_SUPERUSER_PASSWORD_FILE=$PWD/deploy/.secrets/postgres_superuser_password
          ODOO_DB_PASSWORD_FILE=$PWD/deploy/.secrets/odoo_db_password
          ODOO_ADMIN_PASSWD_FILE=$PWD/deploy/.secrets/odoo_admin_passwd
          TLS_CERT_FILE=$PWD/deploy/.runtime/tls/fullchain.pem
          TLS_KEY_FILE=$PWD/deploy/.runtime/tls/privkey.pem
          BACKUP_BIND_DIR=$PWD/deploy/.runtime/backups
          EOF

      - name: Validate Compose rendering
        run: |
          set -euo pipefail
          docker compose --env-file deploy/.env -f deploy/compose.yml config > evidence/compose-rendered.yml
          ! grep -q 'phase6-odoo-db-synthetic-2026' evidence/compose-rendered.yml
          ! grep -q 'phase6-odoo-master-synthetic-2026' evidence/compose-rendered.yml

      - name: Build exact database, Odoo and operations images
        run: |
          set -euo pipefail
          docker compose --env-file deploy/.env -f deploy/compose.yml --profile ops build --pull db odoo ops
          docker run --rm --entrypoint bash "fares-uniform-odoo:$GITHUB_SHA" -lc \
            'test "$ODOO_SHA" = "1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf" && test "$FARES_SHA" = "'"$GITHUB_SHA"'" && test ! -e /mnt/extra-addons/fu_uat && wkhtmltopdf --version && rtlcss --version' \
            | tee evidence/runtime-image.txt
          docker run --rm --entrypoint bash "fares-uniform-postgres:$GITHUB_SHA" -c \
            'id -G postgres | tr " " "\n" | grep -qx 10001 && /usr/lib/postgresql/16/bin/postgres --version' \
            | tee -a evidence/runtime-image.txt

      - name: Verify file-backed secret access boundary
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          {
            echo "host_postgres_superuser_secret=$(stat -c '%u:%g:%a' deploy/.secrets/postgres_superuser_password)"
            echo "host_odoo_db_secret=$(stat -c '%u:%g:%a' deploy/.secrets/odoo_db_password)"
            echo "host_odoo_admin_secret=$(stat -c '%u:%g:%a' deploy/.secrets/odoo_admin_passwd)"
          } | tee evidence/secret-access.txt
          test "$(stat -c '%u:%g:%a' deploy/.secrets/postgres_superuser_password)" = '0:0:400'
          test "$(stat -c '%u:%g:%a' deploy/.secrets/odoo_db_password)" = '0:10001:440'
          test "$(stat -c '%u:%g:%a' deploy/.secrets/odoo_admin_passwd)" = '0:10001:440'
          "${DC[@]}" run --rm --no-deps --entrypoint bash db -lc '
            test "$(stat -c "%u:%g:%a" /run/secrets/odoo_db_password)" = "0:10001:440"
            gosu postgres bash -lc "test -r /run/secrets/odoo_db_password && id -G | tr \" \" \"\\n\" | grep -qx 10001"
          '
          "${DC[@]}" run --rm --no-deps --entrypoint bash odoo -lc '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test "$(stat -c "%u:%g:%a" /run/secrets/odoo_db_password)" = "0:10001:440"
            test "$(stat -c "%u:%g:%a" /run/secrets/odoo_admin_passwd)" = "0:10001:440"
            test -r /run/secrets/odoo_db_password
            test -r /run/secrets/odoo_admin_passwd
          '
          echo 'file_backed_secret_access=PASS' | tee -a evidence/secret-access.txt

      - name: Initialize database and production addons
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          "${DC[@]}" up -d --wait db
          "${DC[@]}" run --rm odoo --stop-after-init -i "$PRODUCTION_ADDONS"
          "${DC[@]}" run --rm odoo --stop-after-init -u "$PRODUCTION_ADDONS"
          "${DC[@]}" up -d --wait odoo proxy

      - name: Verify edge and database security boundaries
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          curl -ksSf https://127.0.0.1:18443/web/login >/dev/null
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/web/database/manager)" = '404'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/web/login)" = '301'
          ROLE_FLAGS="$("${DC[@]}" exec -T db psql -U postgres -d postgres -Atc "SELECT rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = '$ODOO_DB_USER';")"
          test "$ROLE_FLAGS" = 'f|f|f'
          DB_OWNER="$("${DC[@]}" exec -T db psql -U postgres -d postgres -Atc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$ODOO_DB_NAME';")"
          test "$DB_OWNER" != "$ODOO_DB_USER"
          {
            echo "database_manager_http_status=404"
            echo "http_redirect_status=301"
            echo "app_role_flags=$ROLE_FLAGS"
            echo "database_owner=$DB_OWNER"
          } | tee evidence/security-boundaries.txt

      - name: Seed database and filestore recovery fixture
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          cat deploy/ci/seed_restore_fixture.py | "${DC[@]}" exec -T odoo \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" \
            | tee evidence/seed-fixture.txt
          grep -q 'PHASE6_SEED_OK' evidence/seed-fixture.txt

      - name: Prove persistence across application-container replacement
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          "${DC[@]}" up -d --force-recreate --wait odoo proxy
          cat deploy/ci/verify_restore_fixture.py | "${DC[@]}" exec -T odoo \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" \
            | tee evidence/container-replacement.txt
          grep -q 'PHASE6_RESTORE_OK' evidence/container-replacement.txt

      - name: Create quiesced database plus filestore backup set
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          "${DC[@]}" stop odoo
          "${DC[@]}" --profile ops run --rm ops /opt/fares/backup-set.sh | tee evidence/backup-create.txt
          "${DC[@]}" start odoo
          "${DC[@]}" up -d --wait odoo proxy
          BACKUP_SET="$(cat deploy/.runtime/backups/LATEST)"
          echo "BACKUP_SET=$BACKUP_SET" >> "$GITHUB_ENV"
          "${DC[@]}" --profile ops run --rm ops /opt/fares/verify-backup.sh "/backups/$BACKUP_SET" \
            | tee evidence/backup-verify.txt
          cp "deploy/.runtime/backups/$BACKUP_SET/manifest.json" evidence/backup-manifest.json
          cp "deploy/.runtime/backups/$BACKUP_SET/checksums.sha256" evidence/backup-checksums.sha256

      - name: Prove incomplete backup sets fail closed
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          mkdir -p "deploy/.runtime/backups/tampered/$BACKUP_SET"
          cp -a "deploy/.runtime/backups/$BACKUP_SET/." "deploy/.runtime/backups/tampered/$BACKUP_SET/"
          rm "deploy/.runtime/backups/tampered/$BACKUP_SET/filestore.tar.gz"
          if "${DC[@]}" --profile ops run --rm ops /opt/fares/verify-backup.sh "/backups/tampered/$BACKUP_SET"; then
            echo 'Tampered backup unexpectedly verified' >&2
            exit 1
          fi
          echo 'incomplete_backup_rejected=true' | tee evidence/fail-closed.txt
          rm -rf deploy/.runtime/backups/tampered

      - name: Capture pre-destruction logs
        if: always()
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yml ps > evidence/pre-destruction-ps.txt || true
          docker compose --env-file deploy/.env -f deploy/compose.yml logs --no-color > evidence/pre-destruction.log || true

      - name: Destroy state and restore onto clean volumes
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          "${DC[@]}" down -v --remove-orphans
          "${DC[@]}" up -d --wait db
          "${DC[@]}" --profile ops run --rm ops /opt/fares/restore-set.sh "/backups/$BACKUP_SET" \
            | tee evidence/restore.txt
          "${DC[@]}" up -d --wait odoo proxy

      - name: Verify restored database and filestore through Odoo
        run: |
          set -euo pipefail
          DC=(docker compose --env-file deploy/.env -f deploy/compose.yml)
          cat deploy/ci/verify_restore_fixture.py | "${DC[@]}" exec -T odoo \
            /opt/odoo-venv/bin/python /opt/odoo/odoo-bin shell -c /tmp/fares-odoo.conf -d "$ODOO_DB_NAME" \
            | tee evidence/post-restore-fixture.txt
          grep -q 'PHASE6_RESTORE_OK' evidence/post-restore-fixture.txt
          curl -ksSf https://127.0.0.1:18443/web/login >/dev/null
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/web/database/manager)" = '404'
          echo 'phase6_restore_proof=PASS' | tee evidence/result.txt

      - name: Capture final runtime evidence
        if: always()
        run: |
          {
            docker --version
            docker compose version
            echo "fares_sha=$GITHUB_SHA"
            echo "odoo_sha=$ODOO_SHA"
            echo "postgres_base_image=postgres:16.12-bookworm"
            echo "postgres_runtime_image=fares-uniform-postgres:$GITHUB_SHA"
            echo "nginx_image=nginx:1.28-alpine"
          } > evidence/runtime.txt
          docker compose --env-file deploy/.env -f deploy/compose.yml ps > evidence/final-ps.txt || true
          docker compose --env-file deploy/.env -f deploy/compose.yml logs --no-color > evidence/final.log || true

      - name: Upload Phase 6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-deployment-${{ github.sha }}
          path: |
            phase6-source-authority.txt
            evidence
            deploy/.runtime/backups/*/manifest.json
            deploy/.runtime/backups/*/checksums.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker compose --env-file deploy/.env -f deploy/compose.yml down -v --remove-orphans || true
