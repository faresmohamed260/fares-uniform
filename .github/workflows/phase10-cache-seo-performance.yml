name: Phase 10 cache SEO and performance

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-cache-seo-performance.yml"
      - "docs/validation/PHASE_10_PUBLIC_SITE_PRODUCTIONIZATION.md"
  pull_request:
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-cache-seo-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-cache-seo-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cache-seo-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FU_PUBLIC_PROVIDER: cache-fixture
      PUBLIC_SITE_ORIGIN: https://faresuniform.uk
      ODOO_BASE_URL: http://127.0.0.1:4173/api/fixture-odoo
      ODOO_DB_NAME: fixture
      PUBLIC_CACHE_REVALIDATE_SECONDS: "1"
      FU_ENQUIRY_FORM_SECRET: phase10-cache-fixture-form-proof-only
    defaults:
      run:
        working-directory: apps/public-web
    steps:
      - name: Checkout exact Phase 10 candidate
        uses: actions/checkout@v5

      - name: Verify exact source
        run: test "$(git -C ../.. rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck production public web
        run: npm run typecheck

      - name: Build production public web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run cache SEO and performance contract
        run: npx playwright test tests/cache-seo-performance.spec.ts

      - name: Record exact evidence identity
        if: always()
        run: |
          mkdir -p evidence/phase10-cache-seo
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "cache_revalidate_seconds=$PUBLIC_CACHE_REVALIDATE_SECONDS"
            echo "site_origin=$PUBLIC_SITE_ORIGIN"
            node --version
            npm --version
            npx next --version
            npx playwright --version
          } > evidence/phase10-cache-seo/runtime.txt

      - name: Upload cache SEO and performance evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase10-cache-seo-performance-${{ github.sha }}
          path: |
            apps/public-web/evidence/phase10-cache-seo
            apps/public-web/playwright-report
            apps/public-web/test-results
          if-no-files-found: warn
          retention-days: 14
