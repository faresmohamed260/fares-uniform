name: Commit generated D-062 education asset

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - "docs/ui/homepage/assets/.generated-home-education/**"
      - ".github/workflows/commit-generated-home-education.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconstruct verified education asset
        run: |
          set -euo pipefail
          STAGE="docs/ui/homepage/assets/.generated-home-education"
          TARGET="prototype/public-site-design-authority/public/generated/home-industries-education.webp"
          EXPECTED="6d087847c89da991d73b83d2a925c95714ba6a64d7fe6e021aa9fb09fa9b00d2"
          mkdir -p "$(dirname "$TARGET")"
          test "$(find "$STAGE" -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 5
          joined="$(mktemp)"
          trap 'rm -f "$joined"' EXIT
          cat "$STAGE"/part-*.b64 > "$joined"
          test "$(wc -c < "$joined")" -eq 9688
          base64 --decode "$joined" > "$TARGET"
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECTED"
          file "$TARGET" | grep -Eq 'Web/P image|WebP'
          file "$TARGET" | grep -Eq '158x137|158 x 137'
          rm -rf "$STAGE"
          rm -f ".github/workflows/commit-generated-home-education.yml"
      - name: Commit reconstructed binary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "design: commit generated D-062 education media"
          git push origin HEAD:phase-10/public-site-productionization
