name: Phase 2A retail diagnostic

on:
  push:
    branches: ["phase-2a/retail-checkout-offline"]
    paths:
      - ".github/workflows/phase2a-diagnostic.yml"
      - "addons/fu_retail/**"
      - "addons/fu_core/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2a-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-slice:
    name: ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: install
            label: "Install fu_core + fu_retail"
            update_module: ""
            test_tags: ""
          - slice: backend
            label: "Backend payment confirmation"
            update_module: fu_retail
            test_tags: "/fu_retail:TestRetailPaymentConfirmation"
          - slice: ui
            label: "InstaPay cancel/confirm UI"
            update_module: fu_retail
            test_tags: "/fu_retail:TestRetailPOSOffline.test_instapay_cancel_then_confirm_ui_gate"
          - slice: cash
            label: "Offline Cash reload/reconnect"
            update_module: fu_retail
            test_tags: "/fu_retail:TestRetailPOSOffline.test_offline_cash_reload_reconnect_is_idempotent"
          - slice: cash-ar
            label: "Arabic offline Cash pending receipt"
            update_module: fu_retail
            test_tags: "/fu_retail:TestRetailPOSOffline.test_offline_cash_arabic_receipt_marks_pending_sync"
          - slice: instapay
            label: "Offline confirmed-InstaPay reload/reconnect"
            update_module: fu_retail
            test_tags: "/fu_retail:TestRetailPOSOffline.test_offline_instapay_reload_reconnect_is_idempotent"
          - slice: core
            label: "Retained Phase 1 fu_core regression"
            update_module: fu_core
            test_tags: "/fu_core"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2a-diag
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase2a-diag
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p diagnostic/screenshots
          printf 'slice=%s\nfares_head=%s\nodoo_head=%s\n' '${{ matrix.slice }}' "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" > diagnostic/runtime.txt
          google-chrome --version >> diagnostic/runtime.txt
          rtlcss --version >> diagnostic/runtime.txt

      - name: Install fu_core + fu_retail without tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2a-diag \
            -d fares_phase2a_diag -i fu_core,fu_retail \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee diagnostic/install.log

      - name: Run isolated slice
        if: matrix.test_tags != ''
        env:
          UPDATE_MODULE: ${{ matrix.update_module }}
          TEST_TAGS: ${{ matrix.test_tags }}
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2a-diag \
            -d fares_phase2a_diag -u "$UPDATE_MODULE" \
            --test-enable --test-tags="$TEST_TAGS" \
            --screenshots=diagnostic/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee diagnostic/test.log

      - name: Publish diagnostic tail
        if: always()
        run: |
          {
            echo '## Phase 2A diagnostic: ${{ matrix.label }}'
            echo '- slice: `${{ matrix.slice }}`'
            echo '- Fares head: `'$GITHUB_SHA'`'
            echo '- pinned Odoo: `'${ODOO_SHA}'`'
            if [ -f diagnostic/test.log ]; then
              echo '### Test signals'
              grep -E 'ERROR|FAIL|Traceback|AssertionError|ValidationError|TypeError|ReferenceError|tour|timeout|ConnectionLost|tests? in|failures|errors' diagnostic/test.log | tail -n 120 || true
              echo '### Test tail'
              tail -n 100 diagnostic/test.log || true
            else
              echo '### Install signals'
              grep -E 'ERROR|CRITICAL|Traceback|ParseError|ValidationError|TypeError|ReferenceError' diagnostic/install.log | tail -n 100 || true
              echo '### Install tail'
              tail -n 80 diagnostic/install.log || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2a-diagnostic-${{ matrix.slice }}-${{ github.sha }}
          path: diagnostic/
          retention-days: 3
