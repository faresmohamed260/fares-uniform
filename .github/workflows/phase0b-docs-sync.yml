name: Phase 0B UI constraint docs sync

on:
  push:
    branches:
      - foundation/phase-0b
    paths:
      - .github/workflows/phase0b-docs-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          ref: foundation/phase-0b
          fetch-depth: 0

      - name: Record client constraint and revised evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Durable client decision.
          decisions = Path('docs/DECISIONS.md')
          text = decisions.read_text()
          marker = '## D-031 — Prebuilt-first UI and conspicuous physics/morphing\n'
          if marker not in text:
              text += '''\n## D-031 — Prebuilt-first UI and conspicuous physics/morphing\nStatus: Accepted by client, 2026-09-07.\n\nPrioritize maintained prebuilt components over hand-built generic UI to reduce interaction, accessibility and styling defects. For the public Next.js application, use official shadcn/Base UI components (or an equally maintained component source that better fits a documented need) before creating a generic control. For internal Odoo/POS, use maintained native Odoo/Owl components and extension points before custom generic widgets.\n\nCustom code should primarily compose Fares-specific workflows, domain presentation and motion around those maintained primitives. A custom generic primitive requires a documented gap showing why an existing maintained component is unsuitable. Do not build a second generic component library merely to support animation.\n\nThe client explicitly rejected the first technically passing Phase 0B review baseline as insufficient because it relied too heavily on custom UI and its Motion effects were too subtle. Representative visual work must visibly demonstrate the requested modern physics/morphing language—such as spring state transitions, shared-element morphs and ambient/hero shape morphing—rather than merely installing an animation dependency or adding tiny tap effects. Transaction-critical motion remains non-blocking/predictable and `prefers-reduced-motion` support is mandatory.\n'''
              decisions.write_text(text)

          # Harden design-system component policy and motion review bar.
          replace(
              'docs/ui/DESIGN_SYSTEM.md',
              '''## 2. Component-source strategy\n\n### Public web\nPreferred order:\n1. shadcn/ui maintained/source-owned components;\n2. accessible primitives already used by shadcn where appropriate;\n3. composed project components;\n4. custom generic primitives only when no maintained component fits.\n\nUse semantic tokens and component variants instead of raw page-specific colors. Compose existing Button, Card, Dialog/Sheet/Drawer, Field/Form, Tabs, Table, Badge, Tooltip, Skeleton and navigation primitives before inventing replacements.\n\nMotion is used for layout/shared-element/spring interaction. Exact dependency versions are recorded by the actual hosted scaffold.\n\n### Internal Odoo\nUse native Odoo/Owl components, services and extension points. Style through Fares semantic variables/classes and small focused patches. Do not create a parallel React component tree inside POS.\n''',
              '''## 2. Component-source strategy — HARD PREBUILT-FIRST RULE\n\nThe client requires maintained prebuilt components to be the default, specifically to reduce UI/UX, accessibility and interaction bugs. This is an implementation constraint, not a preference.\n\n### Public web\nRequired order:\n1. use an existing official shadcn/Base UI component when it fits;\n2. use another maintained accessible component source when it materially fits the need better and record that source;\n3. compose Fares-specific components from those maintained primitives;\n4. create a custom generic primitive only when a documented component search shows no suitable maintained option.\n\nThe Phase 0B review app is now an actual shadcn project generated by the official CLI using the Base UI foundation with RTL enabled. Its maintained primitives include Button, Card, Badge, Tabs, Dialog, Sheet, Progress, Separator and Input. Installing them is not enough: representative screens must actually compose and exercise them.\n\nUse semantic tokens and component variants rather than rebuilding generic Button/Card/Dialog/Input/Tabs behavior page by page. Motion wraps or composes maintained primitives for Fares-specific state/layout continuity; it must not become a second generic component system.\n\n### Internal Odoo\nApply the same rule within the correct runtime: use maintained native Odoo/Owl components, services and extension points before custom generic widgets. Style/compose them with Fares semantic tokens and focused extensions. Do not create a parallel React component tree inside POS.\n'''
          )
          replace(
              'docs/ui/DESIGN_SYSTEM.md',
              '''Rules:\n- no motion gate before payment validation;\n- no layout animation that makes barcode-driven item insertion hard to track;\n- no infinite attention-seeking motion in operational screens;\n- motion should be interruptible;\n- `prefers-reduced-motion: reduce` removes non-essential transforms/shared-element travel and preserves instant state changes;\n- transitions must not be required to understand what changed.\n''',
              '''Rules:\n- representative visual review must contain **conspicuous** physics/morphing evidence; tiny press/tap effects alone do not satisfy the client requirement;\n- use visible spring/layout continuity for meaningful state changes, shared-element morphing where continuity helps, and richer ambient/hero morphing on the public experience;\n- no motion gate before payment validation;\n- no layout animation that makes barcode-driven item insertion hard to track;\n- no infinite attention-seeking motion in high-frequency operational controls;\n- motion should be interruptible;\n- `prefers-reduced-motion: reduce` removes non-essential transforms/shared-element travel and preserves instant state changes;\n- transitions must not be required to understand what changed.\n\nThe earlier Phase 0B prototype passed technical checks but was rejected by the client as visually too restrained and too custom-built. It is not the accepted visual baseline.\n'''
          )

          # Phase 0B exact evidence.
          replace(
              'docs/phases/PHASE_0B_FOUNDATION.md',
              '- Phase 0B UI implementation commit `670dd9999788ee01f6df6e000675054ef0153a6a` passed hosted run `34070644678`, job `101587223017`: typecheck, production build and 12/12 browser tests passed, producing eight EN/AR desktop/mobile screenshots.\n',
              '- The first Phase 0B UI baseline at `670dd9999788ee01f6df6e000675054ef0153a6a` technically passed 12/12 but was explicitly rejected by the client as too custom-built and too visually restrained; it is superseded for visual review.\n- Revised prebuilt-first implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb` passed hosted run `34073833275`, job `101596052081`: typecheck, optimized production build and **15/15 browser tests passed**, producing a refreshed eight-screen EN/AR desktop/mobile set. The tests prove actual shadcn/Base UI primitive use, responsive POS interaction, accessible Dialog behavior, visible keyboard focus, a non-zero normal-motion physics transform and exact reduced-motion suppression.\n'
          )
          replace(
              'docs/phases/PHASE_0B_FOUNDATION.md',
              '''## Representative UX foundation\nThe reusable design direction includes:\n- semantic tokens for typography, spacing, shape, surfaces, status, focus, motion and RTL;\n- public React components with maintained accessible sources and deliberate Motion usage;\n- internal Odoo/Owl-compatible styling/components, not a React checkout shell;\n- representative POS, preorder/order, production and public catalog surfaces;\n- English/Arabic, desktop/narrow, reduced-motion and keyboard-focused validation.\n\nThe disposable prototype lives under `prototype/review-ui`. Detailed evidence is in `docs/validation/UI_FOUNDATION.md`.\n''',
              '''## Representative UX foundation\nThe reusable design direction now enforces D-031:\n- **prebuilt-first is mandatory** for generic UI; the public prototype uses official shadcn/Base UI generated with RTL support, while internal ERP/POS must prefer maintained Odoo/Owl primitives;\n- semantic tokens cover typography, spacing, shape, surfaces, status, focus, motion and RTL;\n- Motion is reserved for Fares-specific composition and conspicuous spring/morph/shared-layout behavior rather than reimplementing generic controls;\n- representative POS, preorder/order, production and public catalog surfaces include visible physics/morphing examples;\n- English/Arabic, desktop/narrow, normal-motion, reduced-motion and keyboard-focused behavior is hosted-tested.\n\nThe disposable prototype lives under `prototype/review-ui`. Detailed evidence is in `docs/validation/UI_FOUNDATION.md`. Client visual taste approval is still open.\n'''
          )

          # Replace validation doc with the complete current evidence chain.
          Path('docs/validation/UI_FOUNDATION.md').write_text('''# Phase 0B UI foundation evidence\n\nStatus: **REVISED PREBUILT-FIRST BUILD / RENDER / INTERACTION GATES PASS; CLIENT VISUAL REVIEW OPEN**, 2026-09-07.\n\nThis document records technical evidence for the disposable representative UI. Technical pass is not client taste/brand approval and does not make the prototype a production application.\n\n## Client correction to the first baseline\n\nThe first exact-head baseline (`670dd9999788ee01f6df6e000675054ef0153a6a`, run `34070644678`) passed its 12/12 browser gate, but the client explicitly rejected that direction as insufficient: ordinary controls were still substantially hand-built and the physics/morphing effects were too subtle compared with the requested modern Claude/GPT-demo style.\n\nThat baseline remains historical technical evidence only. It is **superseded for visual review**. D-031 now makes maintained prebuilt components a hard default and requires conspicuous representative physics/morphing.\n\n## Maintained component migration\n\nThe existing Next.js review app was migrated remotely rather than recreated locally. The first official shadcn initialization attempt failed because the pre-existing app had no Tailwind foundation; hosted CI then added the official Tailwind v4 Next.js/PostCSS setup and reran the official shadcn CLI.\n\nThe resulting project uses:\n- shadcn `4.21.0`;\n- Base UI foundation;\n- `rtl: true` in `components.json`;\n- official generated Button, Card, Badge, Tabs, Dialog, Sheet, Progress, Separator and Input primitives;\n- Motion `13.1.1` for Fares-specific spring/layout/shared-element/ambient behavior.\n\nGeneric controls are composed from maintained primitives; Motion does not replace them with a second custom control library.\n\n## Revised visual/motion implementation\n\nThe revised representative screens add deliberately visible motion rather than tiny tap-only feedback:\n- morphing ambient background forms;\n- morphing public hero shape;\n- spring/perspective product-card response;\n- shared spring payment selection;\n- sync-pill shape/content transition;\n- cart/total layout transitions;\n- shared order-stage spring transition;\n- expanding production-task cards;\n- public catalog-card → maintained accessible Dialog shared-element morph.\n\nHigh-frequency checkout actions remain immediately usable. Browser-native reduced-motion CSS removes non-essential spatial transforms/animation.\n\n## Final exact-head successful run\n\n- Implementation commit: `fa9ef2413177a54e566c5505e1e858696c8a9bfb` on `foundation/phase-0b`.\n- Workflow: `Phase 0B UI review`.\n- Run: `34073833275`.\n- Job: `101596052081`.\n- Runner: Ubuntu 24.04.4 hosted runner.\n- Node: `v24.20.0`.\n- npm: `11.19.0`.\n- Next.js: `16.3.4` with Turbopack.\n- Browser: Chrome for Testing `153.0.8010.12` through Playwright `1.63.0`.\n- Result: typecheck passed, optimized production build passed, **15/15 browser tests passed**.\n- Artifact: `phase0b-ui-fa9ef2413177a54e566c5505e1e858696c8a9bfb`, ID `10001375991`.\n- Artifact digest: `sha256:7872baafe8a9fee34beae63c24f4dfa3d05dbce0177f024a5e23f744ae218dc8`.\n- Artifact retention: seven days from the run.\n\nThe successful workflow checked out the exact branch head `fa9ef2413177a54e566c5505e1e858696c8a9bfb`.\n\n## Final 15-test gate\n\nThe hosted browser suite proved:\n1. POS English desktop render.\n2. POS Arabic RTL mobile render.\n3. Order English desktop render.\n4. Order Arabic RTL mobile render.\n5. Production English desktop render.\n6. Production Arabic RTL mobile render.\n7. Public English desktop render.\n8. Public Arabic RTL mobile render.\n9. POS actually uses maintained Input/Button/Card primitives and keeps add-to-cart, payment and pending-sync interaction working.\n10. Mobile POS uses the maintained Tabs primitive and switches to cart/payment correctly.\n11. Public catalog keeps commercial availability private and opens the maintained Dialog primitive.\n12. Catalog Dialog opens by keyboard and dismisses with Escape.\n13. Keyboard focus remains visibly styled.\n14. Under normal motion preference, the representative morph element computes a non-`none` transform.\n15. Under `prefers-reduced-motion: reduce`, the same spatial physics transform computes exactly to `none`.\n\nEvery screenshot route also checks intended document direction and no document-level horizontal overflow beyond a one-pixel tolerance.\n\n## Defects found during the redesign\n\nThe stronger gate found real integration/test issues before the final pass:\n- redesigned run `34073432534` exposed four failures: responsive duplicate-DOM locator assumptions, public copy containing the literal protected word `stock`, and residual reduced-motion transform;\n- the following correction made public availability language private and added strict browser-native reduced-motion suppression;\n- run `34073734452` then passed 14/15, leaving only a responsive duplicate product locator in the POS interaction test;\n- the final test scopes interaction to the visible responsive surface, after which run `34073833275` passed 15/15.\n\nThese failures were fixed rather than weakening the prebuilt/motion requirements.\n\n## Boundaries and limitations\n\n- The review app contains synthetic data only and is not wired to Odoo, a real database, payments, enquiries or real stock.\n- The React POS-looking surface demonstrates design/state language only; production checkout remains Odoo/Owl.\n- No real InstaPay verification or hardware integration is implemented.\n- Garment artwork remains synthetic placeholder art rather than approved product photography.\n- Final palette, typography, brand assets and the overall rendered direction remain client-reviewable.\n- Automated screenshots/tests cannot substitute for the client's visual-quality judgment.\n\n## Current verdict\n\nThe revised Phase 0B frontend foundation now technically demonstrates the requested implementation strategy: maintained prebuilt components are actually used, normal mode contains conspicuous physics/morphing behavior, RTL/mobile/accessibility checks pass, and reduced motion removes spatial physics.\n\n**Revised technical UI foundation gate: PASS. Client visual direction gate: OPEN.**\n''')

          # Project handoff.
          replace(
              'PROJECT.md',
              'Phase 0B formalized the hybrid architecture and design-system direction. The disposable representative UI at implementation `670dd9999788ee01f6df6e000675054ef0153a6a` passed hosted run `34070644678`, job `101587223017`: typecheck, optimized build and 12/12 browser tests, with eight EN/AR desktop/mobile screenshots plus interaction/focus/reduced-motion checks. See `docs/validation/UI_FOUNDATION.md`.\n',
              'Phase 0B formalized the hybrid architecture and design-system direction. The client rejected the first technically passing UI baseline as too custom-built and too visually restrained. The revised prebuilt-first implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb` uses actual official shadcn/Base UI primitives with RTL plus visibly stronger Motion spring/morph/shared-layout effects. Hosted run `34073833275`, job `101596052081` passed typecheck, optimized build and **15/15 browser tests**, producing a refreshed eight-screen EN/AR desktop/mobile artifact while verifying maintained primitive use, keyboard Dialog behavior, normal visible physics and exact reduced-motion suppression. See `docs/validation/UI_FOUNDATION.md`.\n'
          )
          replace(
              'PROJECT.md',
              '**Client visual review is now the only blocker before Phase 1 execution.**\n\nReview the Phase 0B rendered direction from hosted run `34070644678` / artifact `phase0b-ui-670dd9999788ee01f6df6e000675054ef0153a6a` (artifact ID `10000345256`). The review should answer whether the overall visual direction is accepted, rejected, or accepted with specific changes.\n',
              '**Client visual review of the revised prebuilt-first/fancy-motion direction is now the only blocker before Phase 1 execution.**\n\nReview the refreshed Phase 0B rendered direction from hosted run `34073833275` / artifact `phase0b-ui-fa9ef2413177a54e566c5505e1e858696c8a9bfb` (artifact ID `10001375991`). The previous artifact is superseded for visual review. The client should answer whether this revised direction is accepted, rejected, or accepted with specific changes.\n'
          )

          # Phase 1 inherits the hard UI rule and current evidence.
          replace(
              'docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md',
              '- UI foundation technical gate: implementation `670dd9999788ee01f6df6e000675054ef0153a6a`, hosted run `34070644678`, 12/12 browser tests passed; client visual acceptance remains open.\n',
              '- Revised UI foundation technical gate: implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb`, hosted run `34073833275`, **15/15 browser tests passed** using actual shadcn/Base UI primitives plus conspicuous normal-motion physics and strict reduced-motion suppression; client visual acceptance remains open.\n'
          )
          replace(
              'docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md',
              '''Once Phase 0B visual direction is accepted:\n- apply shared Fares semantic design tokens/patterns to the product/stock views touched by this phase;\n- support EN/AR/RTL;\n- preserve keyboard operation and visible focus;\n- do not add decorative motion to high-frequency inventory operations;\n- do not build React versions of Odoo product/inventory screens merely for styling.\n\nNo UI styling work should start before the visual gate is resolved if doing so would lock an unapproved visual direction.\n''',
              '''Once Phase 0B visual direction is accepted:\n- apply shared Fares semantic design tokens/patterns to the product/stock views touched by this phase;\n- **prebuilt-first is mandatory**: use maintained native Odoo/Owl components and extension points before any custom generic widget; if a generic custom component is necessary, document the missing maintained option;\n- custom code should focus on Fares-specific composition/workflow behavior rather than rebuilding standard controls;\n- support EN/AR/RTL;\n- preserve keyboard operation and visible focus;\n- use deliberate Fares-specific spring/morph behavior only where it improves orientation/state continuity, never to slow high-frequency inventory operations;\n- provide reduced-motion behavior for any non-essential spatial animation;\n- do not build React versions of Odoo product/inventory screens merely for styling.\n\nNo UI styling work should start before the visual gate is resolved if doing so would lock an unapproved visual direction.\n'''
          )

          # Sanity checks.
          checks = {
              'docs/DECISIONS.md': ['D-031 — Prebuilt-first UI', 'client explicitly rejected'],
              'docs/ui/DESIGN_SYSTEM.md': ['HARD PREBUILT-FIRST RULE', 'conspicuous'],
              'docs/phases/PHASE_0B_FOUNDATION.md': ['fa9ef2413177a54e566c5505e1e858696c8a9bfb', '15/15'],
              'docs/validation/UI_FOUNDATION.md': ['34073833275', '10001375991', '15/15'],
              'PROJECT.md': ['34073833275', 'superseded for visual review'],
              'docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md': ['prebuilt-first is mandatory', '15/15'],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'Missing {needle!r} in {path}')
          PY

      - name: Commit synchronized documentation and remove one-shot workflow
        run: |
          rm .github/workflows/phase0b-docs-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: lock prebuilt-first UI and revised Phase 0B evidence"
          git push origin HEAD:foundation/phase-0b
