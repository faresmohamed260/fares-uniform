name: Phase 7 addon init diagnostics

on:
  push:
    branches:
      - phase-7/vercel-deployment-adaptation
    paths:
      - '.github/workflows/phase7-diagnose-init.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-init-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_APP_SHA: cc2656d7529cfd4af396ddd0af6444a0f6600dc8
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  ODOO_DB_NAME: fares
  ODOO_DB_USER: fares_app
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting
  PHASE7_NETWORK: fares-phase7-diagnostics
  PHASE7_DB_CONTAINER: fares-phase7-diagnostics-db
  PHASE7_INIT_CONTAINER: fares-phase7-diagnostics-init
  PHASE7_UPGRADE_CONTAINER: fares-phase7-diagnostics-upgrade

jobs:
  addon-init-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact head and inherited application source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin "$BASE_APP_SHA"
          git diff --quiet "$BASE_APP_SHA" HEAD -- addons apps/public-web
          mkdir -p evidence
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "base_application_sha=$BASE_APP_SHA"
            echo "odoo_sha=$ODOO_SHA"
            echo "application_source_diff=none"
          } | tee evidence/source-authority.txt

      - name: Prepare synthetic credentials
        run: |
          set -euo pipefail
          mkdir -p deploy/.phase7-secrets evidence
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/postgres_superuser_password >/dev/null
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/odoo_db_password >/dev/null
          openssl rand -hex 32 > deploy/.phase7-secrets/odoo_admin_passwd
          sudo chown root:root deploy/.phase7-secrets/postgres_superuser_password
          sudo chmod 0400 deploy/.phase7-secrets/postgres_superuser_password
          sudo chown root:10001 deploy/.phase7-secrets/odoo_db_password
          sudo chmod 0440 deploy/.phase7-secrets/odoo_db_password
          chmod 0600 deploy/.phase7-secrets/odoo_admin_passwd

      - name: Build exact database and Vercel-target Odoo images
        run: |
          set -euo pipefail
          docker build --pull \
            -f deploy/postgres/Dockerfile \
            -t "fares-uniform-postgres:$GITHUB_SHA" .
          docker build --pull \
            -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$GITHUB_SHA" \
            -t "fares-uniform-vercel:$GITHUB_SHA" .

      - name: Start PostgreSQL and bootstrap shared session state
        run: |
          set -euo pipefail
          docker network create "$PHASE7_NETWORK"
          docker run -d \
            --name "$PHASE7_DB_CONTAINER" \
            --network "$PHASE7_NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_superuser_password \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e FARES_DB_PASSWORD_FILE=/run/secrets/odoo_db_password \
            -v "$PWD/deploy/.phase7-secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro" \
            -v "$PWD/deploy/.phase7-secrets/odoo_db_password:/run/secrets/odoo_db_password:ro" \
            -v "$PWD/deploy/postgres/init/10-fares.sh:/docker-entrypoint-initdb.d/10-fares.sh:ro" \
            "fares-uniform-postgres:$GITHUB_SHA"

          for attempt in $(seq 1 60); do
            INIT_READY="$(docker exec "$PHASE7_DB_CONTAINER" \
              psql -U postgres -d "$ODOO_DB_NAME" -Atc \
              "SELECT CASE WHEN
                 EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ODOO_DB_USER')
                 AND (SELECT count(*) FROM pg_extension WHERE extname IN ('pg_trgm', 'unaccent')) = 2
                 AND has_schema_privilege('$ODOO_DB_USER', 'public', 'USAGE')
                 AND has_schema_privilege('$ODOO_DB_USER', 'public', 'CREATE')
               THEN 'ready' ELSE 'waiting' END;" 2>/dev/null || true)"
            if [[ "$INIT_READY" == 'ready' ]]; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              docker logs "$PHASE7_DB_CONTAINER" | tee evidence/postgres.log
              exit 1
            fi
            sleep 2
          done

          cat deploy/vercel/bootstrap-session-store.sh | docker exec -i \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e POSTGRES_USER=postgres \
            "$PHASE7_DB_CONTAINER" bash

          ROLE_FLAGS="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d postgres -Atc "SELECT rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = '$ODOO_DB_USER';")"
          test "$ROLE_FLAGS" = 'f|f|f'
          DB_OWNER="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d postgres -Atc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$ODOO_DB_NAME';")"
          test "$DB_OWNER" = 'postgres'
          SESSION_OWNER="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc "SELECT pg_get_userbyid(c.relowner) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname='public' AND c.relname='fares_http_session';")"
          test "$SESSION_OWNER" = 'postgres'
          APP_SESSION_GRANTS="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc "SELECT string_agg(privilege_type, ',' ORDER BY privilege_type) FROM information_schema.table_privileges WHERE table_schema='public' AND table_name='fares_http_session' AND grantee='$ODOO_DB_USER';")"
          test "$APP_SESSION_GRANTS" = 'DELETE,INSERT,SELECT,UPDATE'
          {
            echo "app_role_flags=$ROLE_FLAGS"
            echo "database_owner=$DB_OWNER"
            echo "session_table_owner=$SESSION_OWNER"
            echo "session_app_grants=$APP_SESSION_GRANTS"
          } | tee evidence/database-boundary.txt

      - name: Run production addon install and upgrade and retain exact failure
        id: addon_cycle
        run: |
          set -euo pipefail
          DB_PASSWORD="$(sudo cat deploy/.phase7-secrets/odoo_db_password)"
          ADMIN_PASSWD="$(cat deploy/.phase7-secrets/odoo_admin_passwd)"

          create_odoo_container() {
            local name="$1"
            shift
            docker create \
              --name "$name" \
              --network "$PHASE7_NETWORK" \
              -e ODOO_DB_HOST="$PHASE7_DB_CONTAINER" \
              -e ODOO_DB_PORT=5432 \
              -e ODOO_DB_NAME="$ODOO_DB_NAME" \
              -e ODOO_DB_USER="$ODOO_DB_USER" \
              -e ODOO_DB_PASSWORD="$DB_PASSWORD" \
              -e ODOO_DB_SSLMODE=prefer \
              -e ODOO_ADMIN_PASSWD="$ADMIN_PASSWD" \
              -e PORT=8069 \
              -e ODOO_WORKERS=0 \
              -e ODOO_MAX_CRON_THREADS=0 \
              "fares-uniform-vercel:$GITHUB_SHA" \
              --stop-after-init "$@"
          }

          create_odoo_container "$PHASE7_INIT_CONTAINER" -i "$PRODUCTION_ADDONS"
          set +e
          docker start -a "$PHASE7_INIT_CONTAINER"
          INIT_RC=$?
          set -e
          docker logs "$PHASE7_INIT_CONTAINER" > evidence/addon-install.log 2>&1 || true
          echo "$INIT_RC" | tee evidence/addon-install-exit-code.txt

          UPGRADE_RC=125
          if [[ "$INIT_RC" == '0' ]]; then
            create_odoo_container "$PHASE7_UPGRADE_CONTAINER" -u "$PRODUCTION_ADDONS"
            set +e
            docker start -a "$PHASE7_UPGRADE_CONTAINER"
            UPGRADE_RC=$?
            set -e
            docker logs "$PHASE7_UPGRADE_CONTAINER" > evidence/addon-upgrade.log 2>&1 || true
            echo "$UPGRADE_RC" | tee evidence/addon-upgrade-exit-code.txt
          else
            echo 'not-run-install-failed' > evidence/addon-upgrade.log
            echo 'not-run' > evidence/addon-upgrade-exit-code.txt
          fi

          docker logs "$PHASE7_DB_CONTAINER" > evidence/postgres.log 2>&1 || true

          if [[ "$INIT_RC" != '0' ]]; then
            FAILED_PHASE=install
            OVERALL_RC="$INIT_RC"
          elif [[ "$UPGRADE_RC" != '0' ]]; then
            FAILED_PHASE=upgrade
            OVERALL_RC="$UPGRADE_RC"
          else
            FAILED_PHASE=none
            OVERALL_RC=0
          fi

          {
            echo "failed_phase=$FAILED_PHASE"
            echo "install_exit_code=$INIT_RC"
            echo "upgrade_exit_code=$UPGRADE_RC"
            echo "overall_exit_code=$OVERALL_RC"
          } | tee evidence/addon-cycle-result.txt
          echo "failed_phase=$FAILED_PHASE" >> "$GITHUB_OUTPUT"
          echo "overall_exit_code=$OVERALL_RC" >> "$GITHUB_OUTPUT"

      - name: Upload exact addon-cycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-addon-cycle-diagnostics-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Reproduce addon-cycle result
        if: always()
        run: |
          set -euo pipefail
          RC="${{ steps.addon_cycle.outputs.overall_exit_code }}"
          PHASE="${{ steps.addon_cycle.outputs.failed_phase }}"
          test -n "$RC"
          if [[ "$RC" != '0' ]]; then
            echo "Production addon $PHASE failed with exit code $RC; exact logs are in the diagnostic artifact." >&2
            exit "$RC"
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$PHASE7_INIT_CONTAINER" "$PHASE7_UPGRADE_CONTAINER" "$PHASE7_DB_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$PHASE7_NETWORK" >/dev/null 2>&1 || true
          sudo rm -rf deploy/.phase7-secrets
