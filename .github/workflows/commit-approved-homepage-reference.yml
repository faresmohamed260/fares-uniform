name: Commit approved homepage reference

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - ".github/workflows/commit-approved-homepage-reference.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconstruct and verify approved homepage reference
        run: |
          set -euo pipefail
          STAGE="docs/ui/homepage/assets/.approved-homepage-reference"
          TARGET="docs/ui/homepage/assets/approved-homepage-reference.webp"
          EXPECTED="db799d7b8fdb148b79481fbcf41d525aef4667d2190360f4c75ef5dfa91eceef"

          test "$(find "$STAGE" -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 11
          joined="$(mktemp)"
          trap 'rm -f "$joined"' EXIT
          cat "$STAGE"/part-*.b64 > "$joined"
          test "$(wc -c < "$joined")" -eq 52800
          base64 --decode "$joined" > "$TARGET"
          actual="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$actual" = "$EXPECTED"
          description="$(file "$TARGET")"
          echo "$description"
          grep -Eq 'Web/P image|WebP' <<<"$description"
          grep -Eq '1024x1536|1024 x 1536' <<<"$description"
          echo "approved_homepage_reference_sha256=$actual"

      - name: Commit binary authority and remove transport chunks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui/homepage/assets/approved-homepage-reference.webp
          git rm -r docs/ui/homepage/assets/.approved-homepage-reference
          git commit -m "asset: commit approved homepage visual authority"
          git push origin HEAD:phase-10/public-site-productionization
