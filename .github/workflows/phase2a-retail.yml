name: Phase 2A retail checkout foundation

on:
  push:
    branches: ["phase-2a/retail-checkout-offline"]
    paths:
      - "addons/**"
      - ".github/workflows/phase2a-retail.yml"
  pull_request:
    paths:
      - "addons/**"
      - ".github/workflows/phase2a-retail.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2a-retail-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2a-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase2a-only
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/runtime.txt
          python --version >> evidence/runtime.txt
          google-chrome --version >> evidence/runtime.txt
          rtlcss --version >> evidence/runtime.txt

      - name: Install addons and run Phase 1 plus Phase 2A tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2a-only \
            -d fares_phase2a \
            -i fu_core,fu_retail \
            --test-enable --test-tags='/fu_core,/fu_retail' \
            --screenshots=evidence/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/install-and-tests.log

      - name: Surface combined test failure
        if: failure()
        run: |
          echo '::group::Combined Odoo failure context'
          grep -nEi 'Traceback|AssertionError|ERROR|CRITICAL|FAIL|Tour|test_|fu_retail|fu_core' evidence/install-and-tests.log 2>/dev/null | tail -n 180 || true
          echo '--- final log tail ---'
          tail -n 260 evidence/install-and-tests.log 2>/dev/null || true
          echo '::endgroup::'
          {
            echo '### Combined Odoo failure context'
            echo '```text'
            grep -nEi 'Traceback|AssertionError|ERROR|CRITICAL|FAIL|Tour|test_|fu_retail|fu_core' evidence/install-and-tests.log 2>/dev/null | tail -n 140 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encode exact combined failure
        id: failure_signature
        if: failure()
        run: |
          python - <<'PY' > evidence/failure-signature.txt
          import re
          from pathlib import Path

          path = Path("evidence/install-and-tests.log")
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          failures = []
          for index, line in enumerate(lines):
              match = re.search(r"\bFAIL:\s+([A-Za-z0-9_.]+)", line)
              if match:
                  failures.append((index, match.group(1)))

          if not failures:
              print("no-literal-fail-line")
          else:
              index, test_name = failures[-1]
              nearby = "\n".join(lines[index : min(len(lines), index + 45)])
              reason = ""
              reason_patterns = (
                  r"AssertionError:\s*([^\n]+)",
                  r"Tour[^\n]*(?:failed|timeout|timed out)[^\n]*",
                  r"RuntimeError:\s*([^\n]+)",
              )
              for pattern in reason_patterns:
                  reason_match = re.search(pattern, nearby, re.IGNORECASE)
                  if reason_match:
                      reason = reason_match.group(1) if reason_match.lastindex else reason_match.group(0)
                      break
              signature = test_name
              if reason:
                  reason = re.sub(r"[^A-Za-z0-9_.-]+", "-", reason).strip("-._")[:80]
                  if reason:
                      signature += "__" + reason
              signature = re.sub(r"[^A-Za-z0-9_.-]+", "-", signature).strip("-._")
              print(signature[:180] or "unclassified")
          PY
          signature="$(cat evidence/failure-signature.txt)"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          echo "Failure signature: $signature"

      - name: Prove repeatable addon upgrade
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2a-only \
            -d fares_phase2a \
            -u fu_core,fu_retail \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/upgrade.log

      - name: Summarize evidence
        if: always()
        run: |
          {
            echo '## Phase 2A retail checkout foundation'
            echo
            cat evidence/runtime.txt 2>/dev/null || true
            echo
            echo '### Test summary lines'
            grep -E 'tests? in|failures|errors|fu_core|fu_retail|Chrome|screenshot' evidence/install-and-tests.log 2>/dev/null | tail -n 100 || true
            echo
            echo '### Hosted screenshots'
            find evidence/screenshots -type f -maxdepth 3 -printf '%P\n' 2>/dev/null | sort || true
          } | tee evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2a-retail-${{ github.sha }}-${{ steps.failure_signature.outputs.signature || 'no-failure-signature' }}
          path: evidence/
          retention-days: 7
