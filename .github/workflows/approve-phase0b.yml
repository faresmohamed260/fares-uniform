name: Approve Phase 0B visual direction

on:
  push:
    branches: [foundation/phase-0b]
    paths: [.github/workflows/approve-phase0b.yml]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: foundation/phase-0b
          fetch-depth: 1
      - name: Record client approval and activate Phase 1
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text missing in {path}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          decisions = Path("docs/DECISIONS.md")
          s = decisions.read_text()
          if "## D-032 — Modern practical operational ERP visual direction" not in s:
              s += '''\n\n## D-032 — Modern practical operational ERP visual direction\nStatus: Accepted by client, 2026-09-07.\n\nThe client approved the modern, practical operational ERP concept after rejecting the earlier futuristic/spatial dashboard directions. Dense operational surfaces—Dashboard, POS, Products, Production, Sales Orders and Customers—should use a clean contemporary SaaS visual language: strong information hierarchy, restrained depth/shadow, legible tables and cards, clear status colors, touch-friendly POS controls and bilingual EN/AR structure. They must not be turned into cinematic 3D scenes or futuristic demo interfaces.\n\nD-021 and D-031 still apply. Rich 3D, physics and morphing remain desired, but use them selectively where they add product value without harming operational clarity: public/marketing experiences, product showcase/detail, lower-frequency transitions and other suitable expressive surfaces. Operational motion may use polished spring/shared-layout feedback, but checkout, scanning, stock work and data-heavy screens stay stable and practical. Maintained prebuilt components remain mandatory before custom generic controls.\n\nThe client-approved concept board is represented in repository text by this decision and `docs/ui/DESIGN_SYSTEM.md`; the generated conversation image itself is not treated as source code or runtime evidence.\n'''
              decisions.write_text(s)

          replace("docs/ui/DESIGN_SYSTEM.md",
                  "Status: PHASE 0B DESIGN FOUNDATION / CLIENT VISUAL APPROVAL PENDING, 2026-09-07.",
                  "Status: CLIENT-APPROVED OPERATIONAL VISUAL BASELINE, 2026-09-07.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "### Premium, not ornamental\nUse strong spacing, typography, material depth and clear state hierarchy first. Motion enhances transitions after the static hierarchy works.",
                  "### Modern, practical operations\nFor Dashboard, POS, Products, Production, Sales Orders and Customers, use the client-approved clean modern SaaS direction: strong spacing, restrained depth, crisp typography, clear tables/cards/statuses and obvious task hierarchy. These operational screens should feel premium and contemporary, not futuristic, cinematic or game-like.\n\n### Premium, not ornamental\nUse strong spacing, typography, material depth and clear state hierarchy first. Motion enhances transitions after the static hierarchy works.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "### Level 3 — ambient/hero\nPublic-site decorative/physics effects only. Must not reduce readability, introduce scroll jank or become the main navigation mechanism.",
                  "### Level 3 — spatial/3D expressive surfaces\nReserve real 3D, richer physics, morphing geometry/camera behavior and cinematic depth primarily for public/marketing, product showcase/detail and other low-frequency expressive surfaces. Dense operational dashboards and checkout do not adopt a 3D-first composition. Must not reduce readability, introduce scroll jank or become the main navigation mechanism.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "## 10. Approval state\n\nNo color palette, typography family, final component preset or screenshot is client-approved yet. Phase 0B must produce rendered options/evidence before these become durable visual decisions.",
                  "## 10. Approval state\n\nThe client approved the **modern and practical operational ERP direction** on 2026-09-07. The approved visual grammar is clean contemporary SaaS rather than futuristic/spatial dashboard design: light primary work surfaces, dark/navy structural navigation where appropriate, restrained shadows/radii, strong status semantics, visual product imagery, efficient tables/kanban and touch-focused POS composition. Exact brand color values and font files can still be refined during implementation, but must remain faithful to this approved direction rather than reopening the visual paradigm.\n\nThe separate 3D/physics/morphing requirement remains active for suitable expressive surfaces, especially the public site and product showcase/detail; it is not a requirement to make every ERP dashboard panel 3D. D-032 is authoritative when choosing between operational clarity and cinematic effects.")

          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "Status: IMPLEMENTATION FOUNDATION READY / CLIENT VISUAL REVIEW OPEN, 2026-09-07.",
                  "Status: COMPLETE / CLIENT VISUAL DIRECTION APPROVED, 2026-09-07.")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "5. The client explicitly accepts or rejects the representative visual direction. **OPEN**",
                  "5. The client explicitly accepts or rejects the representative visual direction. **PASS — modern/practical operational ERP direction accepted 2026-09-07; richer 3D/physics retained for suitable expressive surfaces.**")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "**Only Gate 5 remains open.** Passing screenshots/tests do not infer client taste approval.",
                  "**All Phase 0B gates are now closed.** The earlier technical prototypes remain evidence, while D-032 records the client-approved operational visual paradigm.")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "## Next dependency\nThe first production-grade phase is now contractually prepared. **Do not execute it until the client resolves the Phase 0B visual direction gate.**",
                  "## Next dependency\nPhase 0B is complete. Activate `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md` on a focused implementation branch. Do not reopen the accepted visual paradigm or confirmed product/stock rules unless the client changes them explicitly.")

          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Status: PREPARED / EXECUTION BLOCKED BY PHASE 0B CLIENT VISUAL GATE, 2026-09-07.",
                  "Status: ACTIVE / AUTHORIZED, 2026-09-07.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Authorization state: the client authorized continued Phase 0B foundation work and confirmed the product/stock business rules needed by this phase. The repository workflow requires Phase 0B's explicit client visual decision before this production-grade implementation starts. This contract is therefore execution-ready but not yet active.",
                  "Authorization state: Phase 0B is complete. The client confirmed the product/stock business rules and explicitly approved the modern/practical operational ERP visual direction on 2026-09-07. This contract is active for remote implementation within its existing scope; paid resources, production deployment and real-data migration remain unauthorized.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "- Revised UI foundation technical gate: implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb`, hosted run `34073833275`, **15/15 browser tests passed** using actual shadcn/Base UI primitives plus conspicuous normal-motion physics and strict reduced-motion suppression; client visual acceptance remains open.",
                  "- Revised UI foundation technical gate: implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb`, hosted run `34073833275`, **15/15 browser tests passed**. The client subsequently approved a modern/practical operational ERP visual paradigm (D-032); richer 3D/physics is reserved for suitable expressive surfaces rather than imposed on dense operational views.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Once Phase 0B visual direction is accepted:\n- apply shared Fares semantic design tokens/patterns to the product/stock views touched by this phase;",
                  "Apply the accepted Phase 0B direction:\n- use the modern/practical operational ERP visual grammar and shared Fares semantic design tokens/patterns on product/stock views touched by this phase;")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "No UI styling work should start before the visual gate is resolved if doing so would lock an unapproved visual direction.",
                  "The visual gate is resolved. Do not reopen the dashboard/product/inventory paradigm during implementation; refine details within D-032 and the design-system contract.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "## Execution gate\n**BLOCKED until the client explicitly accepts or rejects/revises the Phase 0B representative visual direction.**\n\nIf accepted, activate this contract on a focused implementation branch without reopening already-confirmed product/stock questions. If rejected, revise the design system/prototype first; the underlying product/stock data rules remain valid unless the client changes them explicitly.",
                  "## Execution state\n**ACTIVE / AUTHORIZED.** Implement on a focused branch without reopening the already-confirmed product/stock questions or approved operational visual paradigm unless the client explicitly changes them.")

          replace("PROJECT.md",
                  "**Phase 0 — Discovery: COMPLETE. Phase 0A — Hosted Odoo proof: TECHNICAL PASS. Phase 0B — Foundation architecture/UX: IMPLEMENTATION FOUNDATION READY / CLIENT VISUAL REVIEW OPEN. Phase 1 — Products/stock/access: CONTRACT PREPARED / NOT ACTIVE.**",
                  "**Phase 0 — Discovery: COMPLETE. Phase 0A — Hosted Odoo proof: TECHNICAL PASS. Phase 0B — Foundation architecture/UX: COMPLETE / VISUAL DIRECTION APPROVED. Phase 1 — Products/stock/access: ACTIVE / AUTHORIZED.**")
          replace("PROJECT.md",
                  "The first production-grade contract is prepared at `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md`. It is deliberately **not active** because Phase 0B still requires the client's explicit visual decision; passing screenshots/tests are not client taste approval.",
                  "The first production-grade contract at `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md` is now **active**. The client approved the modern/practical operational ERP direction on 2026-09-07: dense ERP screens stay clean, contemporary and efficient, while richer 3D/physics/morphing is reserved for suitable expressive surfaces such as public/product-showcase experiences.")
          replace("PROJECT.md",
                  "3. Phase 0B: architecture/data/UI foundation — all technical/data gates ready; client visual gate open.\n4. Phase 1: products, finished-stock movements, access controls and opening inventory — contract prepared; execute after visual gate.",
                  "3. Phase 0B: architecture/data/UI foundation — complete; modern/practical operational visual direction approved.\n4. Phase 1: products, finished-stock movements, access controls and opening inventory — active.")
          replace("PROJECT.md",
                  "## Immediate next action\n\n**Client visual review of the revised prebuilt-first/fancy-motion direction is now the only blocker before Phase 1 execution.**\n\nReview the refreshed Phase 0B rendered direction from hosted run `34073833275` / artifact `phase0b-ui-fa9ef2413177a54e566c5505e1e858696c8a9bfb` (artifact ID `10001375991`). The previous artifact is superseded for visual review. The client should answer whether this revised direction is accepted, rejected, or accepted with specific changes.",
                  "## Immediate next action\n\n**Execute Phase 1 on a focused implementation branch.** Start with the Odoo-native product/variant identity and permanent `FU-000001` item-code foundation, then finished-stock custody/movements and role enforcement. Validate exact-head remotely before claiming each slice complete.")

          spatial = Path("docs/ui/SPATIAL_CONCEPT_BRIEF.md")
          ss = spatial.read_text()
          ss = ss.replace("Status: CLIENT-REQUIRED NEW VISUAL DIRECTION / CONCEPT APPROVAL PENDING, 2026-09-07.",
                          "Status: SUPERSEDED FOR DENSE OPERATIONAL ERP / RETAINED AS EXPRESSIVE-SURFACE EXPLORATION, 2026-09-07.", 1)
          marker = "## Why this replaces the current visual baseline\n"
          note = "## Approval resolution\n\nThe client later clarified that the dashboard and other dense ERP work surfaces should be **modern and practical**, then explicitly approved that direction. Therefore this document no longer governs Dashboard, POS, Products, Production, Sales Orders or Customers as a 3D-first composition. D-032 and `DESIGN_SYSTEM.md` are authoritative for those operational surfaces.\n\nThe ideas below remain useful exploration for suitable expressive surfaces—especially the public website, product showcase/detail and carefully chosen low-frequency transitions—where richer 3D, physics and morphing can add value without hurting business-task clarity.\n\n"
          if note not in ss:
              ss = ss.replace(marker, note + marker, 1)
          ss = ss.replace("The next gate is visual concept approval for the spatial/3D direction. Production-grade Phase 1 UI styling remains blocked until that direction is explicitly accepted.",
                          "The spatial/3D-first direction is **not** the approved dense operational ERP baseline. Phase 1 is no longer blocked by this concept. Any future use of these ideas must stay within D-032: expressive where appropriate, practical and stable for operational work.", 1)
          spatial.write_text(ss)

          readme = Path("docs/README.md")
          rs = readme.read_text()
          if "[Spatial/3D concept exploration]" not in rs:
              line = "| [Representative UI concept brief](ui/CONCEPT_BRIEF.md) | Synthetic visible content, hierarchy and rejection criteria for Phase 0B review surfaces |\n"
              rs = rs.replace(line, line + "| [Spatial/3D concept exploration](ui/SPATIAL_CONCEPT_BRIEF.md) | Superseded for dense operational ERP; retained for suitable public/product-showcase 3D/physics exploration under D-032 |\n")
              readme.write_text(rs)
      - name: Commit approval and remove one-shot workflow
        run: |
          rm .github/workflows/approve-phase0b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: approve operational UI and activate Phase 1"
          git push origin HEAD:foundation/phase-0b
