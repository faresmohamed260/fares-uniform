name: Approve Phase 0B visual direction

on:
  push:
    branches: [foundation/phase-0b]
    paths: [.github/workflows/approve-phase0b.yml]

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: foundation/phase-0b
          fetch-depth: 1
      - name: Record final client approval and activate Phase 1
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text missing in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          decisions = Path("docs/DECISIONS.md")
          s = decisions.read_text()
          if "## D-033 — Modern practical operational ERP visual direction" not in s:
              s += '''\n\n## D-033 — Modern practical operational ERP visual direction\nStatus: Accepted by client, 2026-09-07; supersedes D-032 for dense operational ERP surfaces.\n\nThe client clarified that the earlier 3D-first correction was being judged on a dashboard and approved a **modern, practical operational ERP** direction instead. Dashboard, POS, Products, Production, Sales Orders and Customers should use a clean contemporary SaaS visual language: strong information hierarchy, restrained depth/shadow, legible tables/cards, clear status semantics, touch-friendly POS controls and bilingual EN/AR structure. These dense work surfaces must not be turned into cinematic 3D scenes or futuristic demo interfaces.\n\nD-032 remains useful for **expressive surfaces**, not as the default composition for dense ERP work. Rich 3D, real physics and morphing are still desired for the public/marketing site, product showcase/detail and carefully chosen low-frequency transitions where they improve the experience without harming business-task clarity. Operational motion may use polished springs/shared-layout continuity, but scanning, checkout, stock work and data-heavy screens remain stable and practical.\n\nD-031 remains mandatory: use maintained prebuilt components before custom generic controls. The client-approved concept board is represented durably by this decision and `docs/ui/DESIGN_SYSTEM.md`; the generated conversation image itself is not runtime evidence.\n'''
              decisions.write_text(s)

          replace("docs/ui/DESIGN_SYSTEM.md",
                  "Status: PHASE 0B DESIGN FOUNDATION / CLIENT VISUAL APPROVAL PENDING, 2026-09-07.",
                  "Status: CLIENT-APPROVED OPERATIONAL VISUAL BASELINE, 2026-09-07.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "### Premium, not ornamental\nUse strong spacing, typography, material depth and clear state hierarchy first. Motion enhances transitions after the static hierarchy works.",
                  "### Modern, practical operations\nDashboard, POS, Products, Production, Sales Orders and Customers follow the client-approved clean modern SaaS direction: restrained depth, crisp typography, efficient tables/cards/kanban, obvious task hierarchy and touch-friendly POS composition. They should feel premium and contemporary, not futuristic, cinematic or game-like.\n\n### Premium, not ornamental\nUse strong spacing, typography, material depth and clear state hierarchy first. Motion enhances transitions after the static hierarchy works.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "### Level 3 — ambient/hero\nPublic-site decorative/physics effects only. Must not reduce readability, introduce scroll jank or become the main navigation mechanism.",
                  "### Level 3 — expressive 3D/physics surfaces\nReserve real 3D, richer physics, morphing geometry/camera behavior and cinematic depth primarily for public/marketing, product showcase/detail and other low-frequency expressive surfaces. Dense operational dashboards and checkout do not adopt a 3D-first composition. Must not reduce readability, introduce scroll jank or become the main navigation mechanism.")
          replace("docs/ui/DESIGN_SYSTEM.md",
                  "## 10. Approval state\n\nNo color palette, typography family, final component preset or screenshot is client-approved yet. Phase 0B must produce rendered options/evidence before these become durable visual decisions.",
                  "## 10. Approval state\n\nThe client approved the **modern and practical operational ERP direction** on 2026-09-07. The accepted grammar is clean contemporary SaaS: light primary work surfaces, dark/navy structural navigation where appropriate, restrained shadows/radii, strong status semantics, visual product imagery, efficient tables/kanban and touch-focused POS composition. Exact color values and font families may be refined during implementation but must remain faithful to this paradigm rather than reopening it.\n\nThe separate 3D/physics/morphing requirement remains active for suitable expressive surfaces, especially public/marketing and product showcase/detail. D-033 supersedes D-032 whenever dense operational clarity conflicts with a 3D-first treatment.")

          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "Status: IMPLEMENTATION FOUNDATION READY / CLIENT VISUAL REVIEW OPEN, 2026-09-07.",
                  "Status: COMPLETE / CLIENT VISUAL DIRECTION APPROVED, 2026-09-07.")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "5. The client explicitly accepts or rejects the representative visual direction. **OPEN**",
                  "5. The client explicitly accepts or rejects the representative visual direction. **PASS — modern/practical operational ERP direction accepted 2026-09-07; richer 3D/physics retained for suitable expressive surfaces under D-033.**")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "**Only Gate 5 remains open.** Passing screenshots/tests do not infer client taste approval.",
                  "**All Phase 0B gates are now closed.** Earlier prototypes remain technical evidence; D-033 records the approved operational visual paradigm.")
          replace("docs/phases/PHASE_0B_FOUNDATION.md",
                  "## Next dependency\nThe first production-grade phase is now contractually prepared. **Do not execute it until the client resolves the Phase 0B visual direction gate.**",
                  "## Next dependency\nPhase 0B is complete. Activate `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md` on a focused implementation branch without reopening the approved visual paradigm or confirmed product/stock rules unless the client explicitly changes them.")

          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Status: PREPARED / EXECUTION BLOCKED BY PHASE 0B CLIENT VISUAL GATE, 2026-09-07.",
                  "Status: ACTIVE / AUTHORIZED, 2026-09-07.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Authorization state: the client authorized continued Phase 0B foundation work and confirmed the product/stock business rules needed by this phase. The repository workflow requires Phase 0B's explicit client visual decision before this production-grade implementation starts. This contract is therefore execution-ready but not yet active.",
                  "Authorization state: Phase 0B is complete. The client confirmed the product/stock business rules and explicitly approved the modern/practical operational ERP visual direction on 2026-09-07. This contract is active for remote implementation within its existing scope; paid resources, production deployment and real-data migration remain unauthorized.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "- Revised UI foundation technical gate: implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb`, hosted run `34073833275`, **15/15 browser tests passed** using actual shadcn/Base UI primitives plus conspicuous normal-motion physics and strict reduced-motion suppression; client visual acceptance remains open.",
                  "- Revised UI foundation technical gate: implementation `fa9ef2413177a54e566c5505e1e858696c8a9bfb`, hosted run `34073833275`, **15/15 browser tests passed**. The client subsequently approved a modern/practical operational ERP paradigm (D-033); richer 3D/physics is reserved for suitable expressive surfaces rather than imposed on dense operational views.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "Once Phase 0B visual direction is accepted:\n- apply shared Fares semantic design tokens/patterns to the product/stock views touched by this phase;",
                  "Apply the accepted Phase 0B direction:\n- use the modern/practical operational ERP grammar and shared Fares semantic design tokens/patterns on product/stock views touched by this phase;")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "No UI styling work should start before the visual gate is resolved if doing so would lock an unapproved visual direction.",
                  "The visual gate is resolved. Do not reopen the product/inventory visual paradigm during implementation; refine details within D-033 and the design-system contract.")
          replace("docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md",
                  "## Execution gate\n**BLOCKED until the client explicitly accepts or rejects/revises the Phase 0B representative visual direction.**\n\nIf accepted, activate this contract on a focused implementation branch without reopening already-confirmed product/stock questions. If rejected, revise the design system/prototype first; the underlying product/stock data rules remain valid unless the client changes them explicitly.",
                  "## Execution state\n**ACTIVE / AUTHORIZED.** Implement on a focused branch without reopening the confirmed product/stock questions or approved operational visual paradigm unless the client explicitly changes them.")

          project = Path("PROJECT.md")
          ps = project.read_text()
          ps = ps.replace("**Phase 0 — Discovery: COMPLETE. Phase 0A — Hosted Odoo proof: TECHNICAL PASS. Phase 0B — Foundation architecture/UX: TECHNICAL FOUNDATION READY / SPATIAL 3D VISUAL CONCEPT REQUIRED. Phase 1 — Products/stock/access: CONTRACT PREPARED / NOT ACTIVE.**",
                          "**Phase 0 — Discovery: COMPLETE. Phase 0A — Hosted Odoo proof: TECHNICAL PASS. Phase 0B — Foundation architecture/UX: COMPLETE / VISUAL DIRECTION APPROVED. Phase 1 — Products/stock/access: ACTIVE / AUTHORIZED.**", 1)
          ps = ps.replace("The visual target is now explicitly **spatial and 3D-first** under D-032: meaningful 3D elements, material/lighting/depth, real physics behaviors such as inertia/spring/collision/magnetic snapping where appropriate, and morphing state continuity. A flat dashboard with a decorative 3D background does not satisfy the requirement. See `docs/ui/SPATIAL_CONCEPT_BRIEF.md`.",
                          "The final operational visual target is the client-approved **modern and practical ERP** direction under D-033. Dashboard, POS, Products, Production, Sales Orders and Customers stay clean, contemporary, information-dense and task-focused. D-032's richer 3D/physics/morphing ideas remain available for suitable expressive surfaces such as public/marketing and product showcase/detail rather than governing dense ERP composition.", 1)
          ps = ps.replace("The first production-grade contract is prepared at `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md`. It remains **not active** because Phase 0B still requires an explicitly accepted visual direction. Existing technically passing screenshots are not an accepted design reference.",
                          "The first production-grade contract at `docs/phases/PHASE_1_PRODUCTS_STOCK_ACCESS.md` is now **active**. Product/stock rules and the operational visual paradigm are both accepted.", 1)
          ps = ps.replace("3. Phase 0B: architecture/data/UI foundation — technical/data gates ready; **new spatial 3D concept and client visual acceptance required**.\n4. Phase 1: products, finished-stock movements, access controls and opening inventory — contract prepared; execute after visual gate.",
                          "3. Phase 0B: architecture/data/UI foundation — complete; modern/practical operational visual direction approved.\n4. Phase 1: products, finished-stock movements, access controls and opening inventory — active.", 1)
          start = "## Immediate next action\n\n**Generate and review the new Spatial Atelier OS concept before writing another broad UI implementation.**\n\nThe concept must visibly show a 3D-first workflow rather than flat cards with animation: tangible product/garment objects, depth/material/lighting, physical cart or queue behavior, shared state morphing and a strong 3D public experience. Ordinary controls remain prebuilt-first and transaction-critical actions must retain immediate accessible equivalents.\n\nThe earlier `fa9ef...` artifact is superseded for visual judgment. Use it only as technical evidence of the maintained-component/accessibility foundation."
          repl = "## Immediate next action\n\n**Execute Phase 1 on a focused implementation branch.** Start with the Odoo-native product/variant identity and permanent `FU-000001` item-code foundation, then finished-stock custody/movements and role enforcement. Validate exact-head remotely before claiming each slice complete."
          if start not in ps:
              raise SystemExit("expected current PROJECT immediate-action block missing")
          ps = ps.replace(start, repl, 1)
          project.write_text(ps)

          spatial = Path("docs/ui/SPATIAL_CONCEPT_BRIEF.md")
          ss = spatial.read_text()
          ss = ss.replace("Status: CLIENT-REQUIRED NEW VISUAL DIRECTION / CONCEPT APPROVAL PENDING, 2026-09-07.",
                          "Status: SUPERSEDED FOR DENSE OPERATIONAL ERP / RETAINED AS EXPRESSIVE-SURFACE EXPLORATION, 2026-09-07.", 1)
          marker = "## Why this replaces the current visual baseline\n"
          note = "## Approval resolution\n\nThe client later clarified that the dashboard and other dense ERP work surfaces should be **modern and practical**, then explicitly approved that direction. This document therefore no longer governs Dashboard, POS, Products, Production, Sales Orders or Customers as a 3D-first composition. D-033 and `DESIGN_SYSTEM.md` are authoritative for those operational surfaces.\n\nThe ideas below remain useful for suitable expressive surfaces—especially public/marketing and product showcase/detail—where richer 3D, physics and morphing can add value without hurting operational clarity.\n\n"
          if note not in ss:
              ss = ss.replace(marker, note + marker, 1)
          ss = ss.replace("The next gate is visual concept approval for the spatial/3D direction. Production-grade Phase 1 UI styling remains blocked until that direction is explicitly accepted.",
                          "The spatial/3D-first direction is **not** the approved dense operational ERP baseline. Phase 1 is no longer blocked by this concept. Future use of these ideas must stay within D-033.", 1)
          spatial.write_text(ss)

          readme = Path("docs/README.md")
          rs = readme.read_text()
          if "[Spatial/3D concept exploration]" not in rs:
              line = "| [Representative UI concept brief](ui/CONCEPT_BRIEF.md) | Synthetic visible content, hierarchy and rejection criteria for Phase 0B review surfaces |\n"
              rs = rs.replace(line, line + "| [Spatial/3D concept exploration](ui/SPATIAL_CONCEPT_BRIEF.md) | Superseded for dense operational ERP; retained for suitable expressive 3D/physics use under D-033 |\n")
              readme.write_text(rs)
      - name: Commit approval and remove one-shot workflow
        run: |
          rm .github/workflows/approve-phase0b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: approve operational UI and activate Phase 1"
          git push origin HEAD:foundation/phase-0b
