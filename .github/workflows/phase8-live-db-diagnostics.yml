name: Phase 8 live database diagnostics

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-live-db-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_API_BASE: https://api.supabase.com/v1
      SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek
    steps:
      - name: Inspect runtime role and active database work
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || exit 64
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          read -r -d '' query <<'SQL' || true
          SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolinherit
          FROM pg_roles WHERE rolname='fares_app';
          SELECT
            pid, usename, state, wait_event_type, wait_event,
            backend_xid IS NOT NULL AS has_xid,
            now() - query_start AS query_age,
            left(regexp_replace(query, E'[\n\r\t]+', ' ', 'g'), 240) AS query_excerpt
          FROM pg_stat_activity
          WHERE datname='postgres' AND usename='fares_app'
          ORDER BY query_start;
          SQL
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201
          jq -c '.[]' "$response"

      - name: Inspect committed Odoo module state
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          existence_query="SELECT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='ir_module_module' AND c.relkind IN ('r','p')) AS module_table_exists;"
          payload="$(jq -cn --arg query "$existence_query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201
          exists="$(jq -r '.[0].module_table_exists' "$response")"
          echo "module_table_exists=$exists"
          if [[ "$exists" != true ]]; then exit 0; fi

          read -r -d '' query <<'SQL' || true
          SELECT name, state
          FROM ir_module_module
          WHERE name IN ('base','web','point_of_sale','stock','sale_management','crm','account','fu_core','fu_retail','fu_preorder','fu_production','fu_business','fu_public_api','fu_reporting','fu_uat')
          ORDER BY name;
          SQL
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201
          jq -c '.[] | {name,state}' "$response"
