name: Phase 8 Vercel Supabase contract

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - Dockerfile.vercel
      - deploy/vercel/entrypoint.sh
      - deploy/vercel/validation.sh
      - deploy/vercel/runtime-mode.sh
      - .github/workflows/phase8-vercel-supabase-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-vercel-supabase-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek
  SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
  SUPABASE_API_BASE: https://api.supabase.com/v1

jobs:
  runtime-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate exact source contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n deploy/vercel/validation.sh
          bash -n deploy/vercel/entrypoint.sh
          bash -n deploy/vercel/runtime-mode.sh

          source deploy/vercel/validation.sh

          for value in fares_app postgres _odoo9 Role_123; do
            ODOO_DB_USER="$value"
            fares_require_db_connection_user ODOO_DB_USER
          done

          for value in \
            "fares_app.${SUPABASE_PROJECT_REF}" \
            "postgres.${SUPABASE_PROJECT_REF}" \
            'Role_123.project456'; do
            ODOO_DB_USER="$value"
            fares_require_db_connection_user ODOO_DB_USER
          done

          reject_connection_user() {
            local value="$1"
            if (ODOO_DB_USER="$value"; fares_require_db_connection_user ODOO_DB_USER >/dev/null 2>&1); then
              echo "Unsafe ODOO_DB_USER was accepted: $value" >&2
              exit 1
            fi
          }
          reject_connection_user ''
          reject_connection_user 'fares-app'
          reject_connection_user 'fares_app.project.extra'
          reject_connection_user 'fares_app;SELECT1'
          reject_connection_user 'fares_app/project'
          reject_connection_user $'fares_app\nproject'

          ODOO_DB_NAME=postgres
          fares_require_identifier ODOO_DB_NAME
          if (ODOO_DB_NAME="postgres.${SUPABASE_PROJECT_REF}"; fares_require_identifier ODOO_DB_NAME >/dev/null 2>&1); then
            echo 'Database name validation unexpectedly accepted a pooler-style suffix.' >&2
            exit 1
          fi

          grep -Fq 'source /usr/local/lib/fares-vercel-validation.sh' deploy/vercel/entrypoint.sh
          grep -Fq 'fares_require_db_connection_user ODOO_DB_USER' deploy/vercel/entrypoint.sh
          grep -Fq 'deploy/vercel/validation.sh /usr/local/lib/fares-vercel-validation.sh' Dockerfile.vercel
          echo 'source_validation_contract=PASS'

      - name: Build exact Vercel Odoo runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$GITHUB_SHA" \
            -t "fares-uniform-vercel:$GITHUB_SHA" .

      - name: Verify validation helper inside non-root runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "fares-uniform-vercel:$GITHUB_SHA" -lc '
            test "$(id -u)" = "10001"
            test "$(id -g)" = "10001"
            test -r /usr/local/lib/fares-vercel-validation.sh
            test -x /usr/local/bin/fares-vercel-odoo-entrypoint
            source /usr/local/lib/fares-vercel-validation.sh
            ODOO_DB_NAME=postgres
            ODOO_DB_USER="fares_app.'"${SUPABASE_PROJECT_REF}"'"
            fares_require_identifier ODOO_DB_NAME
            fares_require_db_connection_user ODOO_DB_USER
          '
          echo 'runtime_image_validation_contract=PASS'

      - name: Prove exact runtime image reaches Supabase Session Pooler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo 'SUPABASE_ACCESS_TOKEN is not configured.' >&2
            exit 64
          fi

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --request POST --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"read_only":false}' \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/cli/login-role")"
          if [[ "$status" != '201' ]]; then
            echo "Temporary Supabase login-role request failed with HTTP ${status}." >&2
            exit 1
          fi

          role="$(jq -er '.role' "$response")"
          password="$(jq -er '.password' "$response")"
          echo "::add-mask::$password"

          export ODOO_DB_HOST="$SUPABASE_POOLER_HOST"
          export ODOO_DB_PORT=5432
          export ODOO_DB_NAME=postgres
          export ODOO_DB_USER="${role}.${SUPABASE_PROJECT_REF}"
          export ODOO_DB_PASSWORD="$password"
          export ODOO_DB_SSLMODE=require
          export EXPECTED_BACKEND_ROLE="$role"

          docker run --rm \
            --entrypoint bash \
            -e ODOO_DB_HOST \
            -e ODOO_DB_PORT \
            -e ODOO_DB_NAME \
            -e ODOO_DB_USER \
            -e ODOO_DB_PASSWORD \
            -e ODOO_DB_SSLMODE \
            -e EXPECTED_BACKEND_ROLE \
            "fares-uniform-vercel:$GITHUB_SHA" -lc '
              set -euo pipefail
              source /usr/local/lib/fares-vercel-validation.sh
              fares_require_identifier ODOO_DB_NAME
              fares_require_db_connection_user ODOO_DB_USER
              /opt/odoo-venv/bin/python - <<'"'"'PY'"'"'
import os
import psycopg2

conn = psycopg2.connect(
    host=os.environ["ODOO_DB_HOST"],
    port=int(os.environ["ODOO_DB_PORT"]),
    dbname=os.environ["ODOO_DB_NAME"],
    user=os.environ["ODOO_DB_USER"],
    password=os.environ["ODOO_DB_PASSWORD"],
    sslmode=os.environ["ODOO_DB_SSLMODE"],
    connect_timeout=10,
)
try:
    with conn.cursor() as cur:
        cur.execute("SELECT current_database(), current_user")
        database, backend_role = cur.fetchone()
    assert database == "postgres", database
    assert backend_role == os.environ["EXPECTED_BACKEND_ROLE"], backend_role
finally:
    conn.close()
print("runtime_image_supabase_session_pooler=PASS")
PY
            '
