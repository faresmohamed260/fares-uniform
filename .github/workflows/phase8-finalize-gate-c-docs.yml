name: Phase 8 finalize Gate C documentation

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-finalize-gate-c-docs.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation generation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize verified Gate C evidence
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA" || { echo "Refusing stale documentation write: run=$GITHUB_SHA branch_head=$remote_head" >&2; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import re

          UAT_SHA = "48316711e4939e4a2e99f2708093930d430cf602"
          UAT_RUN = "35081126154"
          UAT_JOB = "104745121818"
          APP_SHA = "2a74e93b1828c16839ba7cede336caa4ca374306"
          EPOCH = "34892811053:1:2fc625f45bcc6c4bbc3ffc47e3efa58bc8089d7a"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # PROJECT.md owns current state and the next task.
          path = "PROJECT.md"
          text = read(path)
          text = replace_once(
              text,
              "**Phase 8A live staging remains in progress. Production remains NO-GO.** The remaining staging acceptance work is not a regression to earlier phase completion.",
              "**Phase 8 Gate C live staging technical acceptance is PASS. Production remains NO-GO.** Release integration and Gate D operational/cutover authorization remain separate from the completed staging proof.",
              "PROJECT delivery state",
          )
          live_uat = f'''Live production-model business UAT is GREEN at workflow source `{UAT_SHA}`, run `{UAT_RUN}`, job `{UAT_JOB}`, against immutable deployed application `{APP_SHA}` and database epoch `{EPOCH}`. The run used production addons only with `fu_uat` absent and exercised Store/Storage custody, attributable opening stock and idempotent transfer, a real cashier POS submission through `pos.order.sync_from_ui`, cash payment/picking/session accounting, reconnect authorization after cashier-role revocation, business enquiry/sample/quotation, positively confirmed InstaPay deposit, unpaid-delivery blocking, exact balance collection, completed customer delivery and owner reporting. Every synthetic business fact was explicitly rolled back; the independent postflight matched all captured business counts and exact ordinary-cron snapshots, retained the provider/session/extension boundary and `CREATE=false`, and GitHub reports zero retained artifacts.\n\nThe decisive RED was not a reason to broaden cashier permissions. Preserved run `35078985169`, job `104738120056`, exposed `AccessError` when the harness tried to create Odoo's backend `pos.make.payment` wizard as a cashier. That wizard path was a harness shortcut, so `{UAT_SHA}` switched the proof to the same `sync_from_ui` server path used by the real POS frontend. No production ACL was widened.\n\n'''
          text = replace_once(text, "Preserved RED evidence:\n", live_uat + "Preserved RED evidence:\n", "PROJECT live UAT insertion")
          text = replace_once(
              text,
              "Preserved RED evidence:\n",
              "Preserved RED evidence:\n- live business-UAT run `35074919114`, job `104724933423`: the transaction step failed while independent exact rollback/postflight succeeded, proving no managed-database contamination;\n- live business-UAT run `35078985169`, job `104738120056`: exact-image production-model execution reached the POS payment path and failed on cashier access to manager-only `pos.make.payment`; independent rollback/postflight again passed, and the harness was corrected without widening permissions;\n",
              "PROJECT RED history",
          )
          next_tasks = f'''## Next tasks, in order

1. Gate C live staging technical acceptance is complete. Current business-UAT authority is `{UAT_SHA}`, run `{UAT_RUN}`, job `{UAT_JOB}`; public, continuity, cron, WebSocket, recovery and observability proofs remain the supporting Gate C evidence. Procurement planning/Purchase/MRP and `stock_valuation_layer` are outside the accepted first-release staging boundary and are not prerequisites for this gate.
2. Reconcile the branch/PR release stack as a separate reviewable integration task. Only four early-phase draft PRs currently exist. `main` is historical, not the current application. Do not merge or delete phase branches without explicit authorization. Default-branch integration is also the point at which the GitHub observability schedule can become active.
3. Gate D remains NO-GO and requires named staff/roles/training, device acceptance, real-data cutover/reconciliation, production access/domains/secrets, backup retention/RPO/RTO, named monitoring owners/recipients/escalation and explicit production GO.

## Constraints for every continuation'''
          text, count = re.subn(r"## Next tasks, in order\n\n.*?\n## Constraints for every continuation", next_tasks, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"PROJECT next tasks: expected one block, found {count}")
          if "reorder/supplier/FIFO/credit-customer" in text:
              raise SystemExit("PROJECT still contains outdated procurement/FIFO Gate C wording")
          write(path, text)

          # Phase 8 parent contract.
          path = "docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md"
          text = read(path)
          text = replace_once(
              text,
              "Status: **LIVE STAGING AUTHORIZED; FIXTURE/PUBLIC CONTINUITY/RECOVERY/OBSERVABILITY GREEN; GATE C IN PROGRESS; PRODUCTION NO-GO.**",
              "Status: **LIVE STAGING AUTHORIZED; FIXTURE/PUBLIC CONTINUITY/RECOVERY/OBSERVABILITY/BUSINESS UAT GREEN; GATE C PASS; PRODUCTION NO-GO.**",
              "Phase 8 status",
          )
          text = replace_once(
              text,
              "Gate A and Gate B are PASS. Gate C remains in progress. Current repair results and next actions are owned by `PROJECT.md` and `docs/validation/PHASE_8_HANDOFF_REPAIR.md`; the checkpoints below preserve their original evidence.",
              "Gate A, Gate B and Gate C are PASS. Production remains a separate Gate D NO-GO. Current evidence and next actions are owned by `PROJECT.md` and `docs/validation/PHASE_8_HANDOFF_REPAIR.md`; the checkpoints below preserve their original evidence.",
              "Phase 8 gate intro",
          )
          gate_c = f'''### Gate C — live staging technical GO

**PASS — LIVE STAGING TECHNICAL ACCEPTANCE COMPLETE.**

The final live business-UAT authority is workflow source `{UAT_SHA}`, run `{UAT_RUN}`, job `{UAT_JOB}`, against immutable application `{APP_SHA}` and epoch `{EPOCH}`. All hosted steps passed: fresh deployment authority, managed baseline, restricted secret resolution, exact-image build, rollback-safe production-model transaction, independent exact rollback/postflight, evidence publication and cleanup. GitHub reports zero retained artifacts.

The live transaction proved company/warehouse → Retail Store/Storage custody, opening stock plus idempotent internal movement, native POS configuration/session and cashier checkout through the real `pos.order.sync_from_ui` server path, cash payment/picking/accounting, current-server authorization after cashier-role revocation, business enquiry/sample/quotation, confirmed InstaPay deposit, unpaid-delivery blocking, exact balance collection, completed whole delivery and owner reporting. All synthetic records rolled back; ordinary cron rows/triggers were neither run nor rescheduled and their exact snapshots remained unchanged. The epoch, 988-relation application boundary, provider-owned session state/DML, required extensions, absent `fu_uat` and revoked schema `CREATE` remained intact.

Preserved RED run `35074919114` proved the rollback/postflight boundary before the transaction harness was healthy. Preserved RED run `35078985169`, job `104738120056`, isolated a harness-only misuse of the manager-only `pos.make.payment` backend wizard. The accepted fix did not widen cashier ACLs; it changed the synthetic cashier proof to the same POS UI sync path used by production checkout.

Procurement planning, Purchase, MRP, `sale_management` and `stock_valuation_layer` are not requirements of the accepted first-release staging topology. Do not install or add them to resurrect older procurement-like checklist language. Default-branch activation of recurring GitHub observability remains a release-integration concern; named people, production recipients/escalation and production retention remain Gate D.

### Gate D — production'''
          text, count = re.subn(r"### Gate C — live staging technical GO\n\n.*?\n### Gate D — production", gate_c, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Phase 8 Gate C: expected one block, found {count}")
          if "reorder/supplier/FIFO/credit-customer" in text:
              raise SystemExit("Phase 8 still contains outdated procurement/FIFO Gate C wording")
          write(path, text)

          # Phase 8A live execution contract.
          path = "docs/phases/PHASE_8A_FREE_TIER_STAGING_EXECUTION.md"
          text = read(path)
          text = replace_once(
              text,
              "Status: **LIVE STAGING AUTHORIZED; FIXTURE/PUBLIC CONTINUITY/RECOVERY/OBSERVABILITY GREEN; GATE C IN PROGRESS; PRODUCTION NO-GO.**",
              "Status: **LIVE STAGING AUTHORIZED; FIXTURE/PUBLIC CONTINUITY/RECOVERY/OBSERVABILITY/BUSINESS UAT GREEN; GATE C PASS; PRODUCTION NO-GO.**",
              "Phase 8A status",
          )
          old_gate = '''## Gate state

- **Gate A — repository planning: PASS.**
- **Gate B — authorization/provider ownership: PASS.**
- **Gate C — live staging technical GO: IN PROGRESS / NOT YET GO.** Guarded reset/deploy, provider restore, private DB routing, runtime privilege seal, fixture/public rendering, bounded live enquiry/no-leak proof, attachment/authenticated-session continuity, cron locking, WebSocket replay, managed backup/isolated destructive recovery and hosted observability/alert transport are GREEN. Business-flow acceptance remains.
- **Gate D — production: NO-GO.** Separate operational, device/staff/data-cutover, named monitoring ownership/retention and explicit production authorization are still required.

## Next authorized execution sequence

Follow [PROJECT.md](../../PROJECT.md) for the ordered current tasks and [repair evidence](../validation/PHASE_8_HANDOFF_REPAIR.md) for exact runs. Reverify branch HEAD before every write. Complete live synthetic business-flow acceptance before staging sign-off; do not install `fu_uat` in staging. Default-branch observability schedule activation belongs to separately reviewed release integration. Gate D remains separately authorized.'''
          new_gate = f'''## Gate state

- **Gate A — repository planning: PASS.**
- **Gate B — authorization/provider ownership: PASS.**
- **Gate C — live staging technical GO: PASS.** Guarded reset/deploy, provider restore, private DB routing, runtime privilege seal, fixture/public rendering, bounded public enquiry/no-leak proof, attachment/authenticated-session continuity, cron locking, WebSocket replay, managed backup/isolated destructive recovery, hosted observability/alert transport and live production-model business UAT are GREEN. Final business-UAT authority: `{UAT_SHA}`, run `{UAT_RUN}`, job `{UAT_JOB}`.
- **Gate D — production: NO-GO.** Separate operational, device/staff/data-cutover, named monitoring ownership/retention and explicit production authorization are still required.

## Next authorized execution sequence

Follow [PROJECT.md](../../PROJECT.md) for the ordered current tasks and [repair evidence](../validation/PHASE_8_HANDOFF_REPAIR.md) for exact runs. Reverify branch HEAD before every write. Gate C requires no further business-flow proof under the accepted first-release boundary; Purchase/MRP/procurement planning is out of scope for this staging gate. The next engineering task is separately reviewed release integration, without implicit merge authorization. Default-branch observability schedule activation belongs to that integration. Gate D remains separately authorized.'''
          text = replace_once(text, old_gate, new_gate, "Phase 8A gate state")
          write(path, text)

          # Detailed validation history.
          path = "docs/validation/PHASE_8_HANDOFF_REPAIR.md"
          text = read(path)
          section = f'''## Live production-model business UAT — RED→GREEN

Workflow source `401960c3ead20f511065b22cd3bb0484365015bb` introduced a live rollback-safe UAT harness that uses only the seven production addons, verifies the exact READY deployment and database epoch first, creates only run-scoped synthetic records inside one managed transaction, explicitly rolls that transaction back and independently compares postflight state to the captured baseline.

Preserved RED [run 35074919114](https://github.com/faresmohamed260/fares-uniform/actions/runs/35074919114), job `104724933423`, passed deployment authority, managed baseline, restricted secret resolution and exact-image build, then failed in the transaction step. The independent rollback/postflight step passed, proving no synthetic business state, cron mutation, deployment-epoch change or privilege drift persisted.

After repairing the Odoo-shell invocation, preserved RED [run 35078985169](https://github.com/faresmohamed260/fares-uniform/actions/runs/35078985169), job `104738120056`, reached the production POS model path and again retained an exact independent rollback/postflight. Recovered hosted evidence identified the precise failure: `odoo.exceptions.AccessError` creating the backend `pos.make.payment` wizard as the synthetic cashier. Pinned Odoo keeps that wizard outside the cashier checkout path; it was a harness shortcut, not evidence that cashier permissions should be broadened.

Commit `{UAT_SHA}` corrected the harness to exercise the same server path used by the real POS frontend: the cashier submits the order, line and cash payment through `pos.order.sync_from_ui`, then the proof resolves the authoritative order by UUID. No cashier ACL, native POS-manager grant, database privilege, exposure boundary or business rule was weakened.

GREEN [run {UAT_RUN}](https://github.com/faresmohamed260/fares-uniform/actions/runs/{UAT_RUN}), job `{UAT_JOB}`, exact workflow source `{UAT_SHA}`, completed every step successfully. Against immutable deployed application `{APP_SHA}` and epoch `{EPOCH}`, it proved:

- company/warehouse → Retail Store/Storage topology, attributable opening stock and idempotent Store/Storage transfer;
- native POS config/session, real cashier UI-sync cash sale, exactly one payment/picking/stock decrement, manager close and posted session accounting;
- offline/reconnect authorization revalidation after Fares cashier-role revocation, with the rejected replay creating no authoritative order;
- business enquiry → sample approval → quotation → positively confirmed InstaPay deposit → order confirmation;
- customer delivery blocked while a balance remained, exact remaining balance paid, whole delivery completed and stock consequence verified;
- owner reporting cleared the fully paid business balance while retaining the offline-sync disclosure;
- explicit transaction rollback plus independent exact-count postflight for users, partners, products, POS, sale/payment, stock, CRM and Fares operational models;
- exact ordinary `ir_cron` and `ir_cron_trigger` snapshots unchanged, with no backlog execution or reschedule;
- unchanged epoch, 988 app-owned relations, provider-owned session table/effective DML, both required extensions, `CREATE=false` and `fu_uat=0`.

GitHub reports zero retained artifacts for the GREEN run. This closes Gate C live staging technical acceptance. It does not authorize production: Gate D remains NO-GO. Procurement planning/Purchase/MRP and `stock_valuation_layer` are outside the accepted first-release staging boundary and were not added merely to satisfy superseded checklist language.

'''
          text = replace_once(text, "## Cleanup\n", section + "## Cleanup\n", "handoff business UAT section")
          write(path, text)

          # Operations workflow guide.
          path = "docs/operations/WORKFLOW_GUIDE.md"
          text = read(path)
          anchor = "| `phase8-live-websocket-replay.yml` | Exact-image authenticated WebSocket delivery, complete evented-runtime replacement, cursor replay/no-duplicate proof and full run-scoped cleanup |\n"
          row = "| `phase8-live-business-uat.yml` | Rollback-safe live production-model UAT: Store/Storage stock custody, cashier POS through `sync_from_ui`, offline role revalidation, business sample/quotation/deposit/balance/delivery/reporting, exact rollback/postflight and cron/epoch/privilege seals |\n"
          text = replace_once(text, anchor, anchor + row, "workflow guide UAT row")
          boundary = f'''## Live business UAT boundary

`phase8-live-business-uat.yml` is the Gate C production-model proof. Current authority: workflow source `{UAT_SHA}`, run `{UAT_RUN}`, job `{UAT_JOB}`, result GREEN, immutable application `{APP_SHA}`. It uses the seven production addons only; `fu_uat` remains absent from staging.

All run-scoped business facts exist only inside one transaction and are explicitly rolled back. The independent postflight must still match every captured business count and the exact ordinary-cron snapshots, and must retain the database epoch/provider/least-privilege seal. Do not run, drain, postpone or reschedule ordinary cron backlog for this proof.

Cashier checkout must follow the real POS frontend server path through `pos.order.sync_from_ui`. Do not substitute the manager-oriented backend `pos.make.payment` wizard and do not widen cashier ACLs to make a harness shortcut pass. The preserved RED `35078985169` is the evidence for this distinction.

Do not expand this workflow to Purchase, MRP, procurement planning, `sale_management` or `stock_valuation_layer`; those are outside the accepted first-release staging topology. Production remains a separate Gate D NO-GO.

'''
          text = replace_once(text, "## Managed recovery invariant\n", boundary + "## Managed recovery invariant\n", "workflow guide UAT boundary")
          write(path, text)

          # Final consistency assertions before the commit.
          checks = {
              "PROJECT.md": ["Gate C live staging technical acceptance is PASS", UAT_SHA, UAT_RUN, UAT_JOB, "Production remains NO-GO"],
              "docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md": ["GATE C PASS", "PASS — LIVE STAGING TECHNICAL ACCEPTANCE COMPLETE", UAT_RUN, "PRODUCTION NO-GO"],
              "docs/phases/PHASE_8A_FREE_TIER_STAGING_EXECUTION.md": ["Gate C — live staging technical GO: PASS", UAT_RUN, "Gate D — production: NO-GO"],
              "docs/validation/PHASE_8_HANDOFF_REPAIR.md": ["Live production-model business UAT — RED→GREEN", "35074919114", "35078985169", UAT_RUN, UAT_JOB],
              "docs/operations/WORKFLOW_GUIDE.md": ["phase8-live-business-uat.yml", "sync_from_ui", UAT_RUN, "Production remains a separate Gate D NO-GO"],
          }
          for filename, needles in checks.items():
              data = read(filename)
              for needle in needles:
                  if needle not in data:
                      raise SystemExit(f"{filename}: missing required evidence {needle!r}")
          PY

          git diff --check -- PROJECT.md docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md docs/phases/PHASE_8A_FREE_TIER_STAGING_EXECUTION.md docs/validation/PHASE_8_HANDOFF_REPAIR.md docs/operations/WORKFLOW_GUIDE.md
          grep -F 'Gate C live staging technical acceptance is PASS' PROJECT.md
          grep -F 'PASS — LIVE STAGING TECHNICAL ACCEPTANCE COMPLETE' docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md
          grep -F 'Gate C — live staging technical GO: PASS' docs/phases/PHASE_8A_FREE_TIER_STAGING_EXECUTION.md
          grep -F '35081126154' docs/validation/PHASE_8_HANDOFF_REPAIR.md
          grep -F 'phase8-live-business-uat.yml' docs/operations/WORKFLOW_GUIDE.md
          if grep -F 'reorder/supplier/FIFO/credit-customer' PROJECT.md docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md; then
            echo 'Outdated Gate C procurement/FIFO wording remains' >&2
            exit 1
          fi

          git rm .github/workflows/phase8-recover-live-uat-log.yml
          git rm .github/workflows/phase8-finalize-gate-c-docs.yml
          git config user.name 'Fares Uniform CI'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add PROJECT.md docs/phases/PHASE_8_COMMERCIAL_STAGING_READINESS.md docs/phases/PHASE_8A_FREE_TIER_STAGING_EXECUTION.md docs/validation/PHASE_8_HANDOFF_REPAIR.md docs/operations/WORKFLOW_GUIDE.md
          git commit -m 'docs: close Phase 8 staging Gate C'
          git push origin "HEAD:${GITHUB_REF_NAME}"
