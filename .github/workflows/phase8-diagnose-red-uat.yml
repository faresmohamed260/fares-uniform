name: Phase 8 diagnose preserved UAT RED

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-diagnose-red-uat.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  diagnose-red-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RED_RUN_ID: '35074919114'
    steps:
      - name: Recover exact preserved RED exception
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="$work/logs.zip"
          status="$(curl -sS -L -o "$archive" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RED_RUN_ID/logs")"
          test "$status" = 200 || { echo "Unable to fetch preserved RED logs: HTTP $status" >&2; exit 1; }
          unzip -q "$archive" -d "$work/logs"

          python3 - "$work/logs" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          lines = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              lines.extend(text.splitlines())

          ansi = re.compile(r"\x1b\[[0-9;]*m")

          def clean(value):
              value = re.sub(r"^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z\s+", "", value).strip()
              value = ansi.sub("", value)
              value = re.sub(r"\s+", " ", value)
              return value

          def short(value, limit=135):
              value = clean(value)
              return value[:limit] if value else "not-found"

          # GitHub Actions echoes every shell-script source line in cyan before
          # execution. Exclude those lines so source code cannot masquerade as
          # runtime PASS markers or exceptions.
          runtime = [line for line in lines if "\x1b[36;1m" not in line]

          markers = []
          for line in runtime:
              match = re.search(r"(phase8_uat_[a-z_]+)=PASS", clean(line))
              if match and match.group(1) not in markers:
                  markers.append(match.group(1))

          traceback_starts = [i for i, line in enumerate(runtime) if "Traceback (most recent call last):" in clean(line)]
          frame = ""
          error = ""
          if traceback_starts:
              start = traceback_starts[-1]
              for raw in runtime[start + 1:start + 160]:
                  value = clean(raw)
                  if re.search(r'File ".+", line \d+', value):
                      frame = value
                  if re.search(
                      r"(?:AssertionError|ValidationError|AccessError|UserError|TypeError|AttributeError|KeyError|ValueError|RuntimeError|OperationalError|ProgrammingError|IntegrityError|Exception):",
                      value,
                  ):
                      error = value

          if not error:
              for raw in reversed(runtime):
                  value = clean(raw)
                  if re.search(r"(?:AssertionError|ValidationError|AccessError|UserError|TypeError|AttributeError|KeyError|ValueError|RuntimeError|OperationalError|ProgrammingError|IntegrityError|Exception):", value):
                      error = value
                      break

          interesting = []
          tokens = (
              "phase8_", "Traceback", "AssertionError", "ValidationError", "AccessError",
              "UserError", "TypeError", "AttributeError", "KeyError", "ValueError",
              "RuntimeError", "OperationalError", "ProgrammingError", "IntegrityError",
              "CRITICAL", "ERROR", "Process completed with exit code", "grep:",
          )
          for raw in runtime:
              value = clean(raw)
              if value and any(token in value for token in tokens):
                  interesting.append(value)
          tail = interesting[-6:]
          tail = ["not-found"] * (6 - len(tail)) + tail

          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"markers={short(','.join(markers) or 'none')}\n")
              handle.write(f"frame={short(frame)}\n")
              handle.write(f"error={short(error)}\n")
              for index, value in enumerate(tail, start=1):
                  handle.write(f"tail{index}={short(value)}\n")
          PY

      - name: Publish recovered diagnostic as commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local context="$1"
            local description="$2"
            payload="$(jq -cn \
              --arg state failure \
              --arg context "$context" \
              --arg description "$description" \
              --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data "$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
          }
          publish 'phase8/uat-red/markers' "${{ steps.recover.outputs.markers }}"
          publish 'phase8/uat-red/frame' "${{ steps.recover.outputs.frame }}"
          publish 'phase8/uat-red/error' "${{ steps.recover.outputs.error }}"
          publish 'phase8/uat-red/tail-1' "${{ steps.recover.outputs.tail1 }}"
          publish 'phase8/uat-red/tail-2' "${{ steps.recover.outputs.tail2 }}"
          publish 'phase8/uat-red/tail-3' "${{ steps.recover.outputs.tail3 }}"
          publish 'phase8/uat-red/tail-4' "${{ steps.recover.outputs.tail4 }}"
          publish 'phase8/uat-red/tail-5' "${{ steps.recover.outputs.tail5 }}"
          publish 'phase8/uat-red/tail-6' "${{ steps.recover.outputs.tail6 }}"
          echo 'phase8_red_diagnostic=PASS source_run=35074919114'
