name: Phase 8 diagnose preserved UAT RED

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-diagnose-red-uat.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  diagnose-red-uat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RED_RUN_ID: '35074919114'
    steps:
      - name: Recover exact preserved RED exception
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          archive="$work/logs.zip"
          status="$(curl -sS -L -o "$archive" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RED_RUN_ID/logs")"
          test "$status" = 200 || { echo "Unable to fetch preserved RED logs: HTTP $status" >&2; exit 1; }
          unzip -q "$archive" -d "$work/logs"

          python3 - "$work/logs" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          ansi = re.compile(r"\x1b\[[0-9;]*m")

          def clean(value):
              value = re.sub(r"^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z\s+", "", value).strip()
              value = ansi.sub("", value)
              return re.sub(r"\s+", " ", value).strip()

          def short(value, limit=135):
              value = clean(value)
              return value[:limit] if value else "not-found"

          files = [path for path in sorted(root.rglob("*")) if path.is_file()]
          candidates = [path for path in files if "execute rollback-safe production-model business journeys" in path.name.lower()]
          if not candidates:
              candidates = [path for path in files if "business" in path.name.lower() and "journey" in path.name.lower()]
          if not candidates:
              candidates = files

          selected = []
          for path in candidates:
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError:
                  continue
              selected.extend(text.splitlines())

          # GitHub Actions prints shell-source lines in cyan. Keep only actual
          # runtime output and runner annotations from the failed step.
          runtime = [line for line in selected if "\x1b[36;1m" not in line]
          runtime = [clean(line) for line in runtime if clean(line)]

          markers = []
          for line in runtime:
              match = re.search(r"(phase8_uat_[a-z_]+)=PASS", line)
              if match and match.group(1) not in markers:
                  markers.append(match.group(1))

          traceback_starts = [i for i, line in enumerate(runtime) if "Traceback (most recent call last):" in line]
          frame = ""
          error = ""
          if traceback_starts:
              start = traceback_starts[-1]
              for value in runtime[start + 1:start + 160]:
                  if re.search(r'File ".+", line \d+', value):
                      frame = value
                  if re.search(r"(?:AssertionError|ValidationError|AccessError|UserError|TypeError|AttributeError|KeyError|ValueError|RuntimeError|OperationalError|ProgrammingError|IntegrityError|Exception):", value):
                      error = value

          if not error:
              for value in reversed(runtime):
                  if re.search(r"(?:AssertionError|ValidationError|AccessError|UserError|TypeError|AttributeError|KeyError|ValueError|RuntimeError|OperationalError|ProgrammingError|IntegrityError|Exception):", value):
                      error = value
                      break

          tail = runtime[-12:]
          tail = ["not-found"] * (12 - len(tail)) + tail
          selected_name = ",".join(path.name for path in candidates[:2])

          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"source={short(selected_name)}\n")
              handle.write(f"markers={short(','.join(markers) or 'none')}\n")
              handle.write(f"frame={short(frame)}\n")
              handle.write(f"error={short(error)}\n")
              for index, value in enumerate(tail, start=1):
                  handle.write(f"tail{index}={short(value)}\n")
          PY

      - name: Publish recovered diagnostic as commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local context="$1"
            local description="$2"
            payload="$(jq -cn --arg state failure --arg context "$context" --arg description "$description" --arg target_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data "$payload" "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
          }
          publish 'phase8/uat-red/source' "${{ steps.recover.outputs.source }}"
          publish 'phase8/uat-red/markers' "${{ steps.recover.outputs.markers }}"
          publish 'phase8/uat-red/frame' "${{ steps.recover.outputs.frame }}"
          publish 'phase8/uat-red/error' "${{ steps.recover.outputs.error }}"
          publish 'phase8/uat-red/tail-01' "${{ steps.recover.outputs.tail1 }}"
          publish 'phase8/uat-red/tail-02' "${{ steps.recover.outputs.tail2 }}"
          publish 'phase8/uat-red/tail-03' "${{ steps.recover.outputs.tail3 }}"
          publish 'phase8/uat-red/tail-04' "${{ steps.recover.outputs.tail4 }}"
          publish 'phase8/uat-red/tail-05' "${{ steps.recover.outputs.tail5 }}"
          publish 'phase8/uat-red/tail-06' "${{ steps.recover.outputs.tail6 }}"
          publish 'phase8/uat-red/tail-07' "${{ steps.recover.outputs.tail7 }}"
          publish 'phase8/uat-red/tail-08' "${{ steps.recover.outputs.tail8 }}"
          publish 'phase8/uat-red/tail-09' "${{ steps.recover.outputs.tail9 }}"
          publish 'phase8/uat-red/tail-10' "${{ steps.recover.outputs.tail10 }}"
          publish 'phase8/uat-red/tail-11' "${{ steps.recover.outputs.tail11 }}"
          publish 'phase8/uat-red/tail-12' "${{ steps.recover.outputs.tail12 }}"
          echo 'phase8_red_diagnostic=PASS source_run=35074919114'
