name: Phase 8 public smoke contract

on:
  push:
    branches:
      - phase-8/public-staging-smoke
    paths:
      - .github/workflows/phase8-public-smoke-contract.yml
      - .github/workflows/phase8-public-staging-smoke.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Parse and assert smoke contract
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/phase8-public-staging-smoke.yml"); puts "yaml=PASS"'
          grep -Fq 'EXPECTED_DEPLOYMENT_SHA: 2a74e93b1828c16839ba7cede336caa4ca374306' .github/workflows/phase8-public-staging-smoke.yml
          grep -Fq 'cron_status' .github/workflows/phase8-public-staging-smoke.yml
          grep -Fq 'direct_status' .github/workflows/phase8-public-staging-smoke.yml
          grep -Fq '?lang=en' .github/workflows/phase8-public-staging-smoke.yml
          grep -Fq '?lang=ar' .github/workflows/phase8-public-staging-smoke.yml
          echo 'public_smoke_contract=PASS'
