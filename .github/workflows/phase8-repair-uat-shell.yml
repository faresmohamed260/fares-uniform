name: Phase 8 repair UAT shell invocation

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-repair-uat-shell.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair generation
        uses: actions/checkout@v4
        with:
          ref: phase-8/commercial-staging-readiness
          fetch-depth: 1

      - name: Verify exact branch generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/phase-8/commercial-staging-readiness | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || { echo "Refusing stale repair: run=$GITHUB_SHA branch=$remote_head" >&2; exit 1; }

      - name: Apply audited UAT shell patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/phase8-live-business-uat-shell.patch
          git apply .github/phase8-live-business-uat-shell.patch
          git diff --check
          test "$(git diff --name-only | paste -sd, -)" = '.github/workflows/phase8-live-business-uat.yml'
          grep -F -- '--entrypoint /bin/bash' .github/workflows/phase8-live-business-uat.yml
          grep -F -- 'odoo-bin shell -c /tmp/fares-phase8-uat.conf' .github/workflows/phase8-live-business-uat.yml
          grep -F -- '2>&1 | tee /tmp/phase8-business-uat.log' .github/workflows/phase8-live-business-uat.yml

      - name: Materialize patched workflow as unreferenced Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/phase-8/commercial-staging-readiness | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || { echo "Refusing stale blob generation: run=$GITHUB_SHA branch=$remote_head" >&2; exit 1; }
          target='.github/workflows/phase8-live-business-uat.yml'
          expected="$(git hash-object "$target")"
          payload="$(jq -Rs '{content:@base64,encoding:"base64"}' < "$target")"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl -sS -o "$response" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs")"
          test "$status" = 201 || { cat "$response" >&2; exit 1; }
          blob_sha="$(jq -er '.sha' "$response")"
          test "$blob_sha" = "$expected"
          echo "phase8_repaired_workflow_blob=$blob_sha"
