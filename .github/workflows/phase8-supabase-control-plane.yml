name: Phase 8 Supabase control-plane smoke

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-supabase-control-plane.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-supabase-control-plane
  cancel-in-progress: false

jobs:
  control-plane-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek
      SUPABASE_API_BASE: https://api.supabase.com/v1
    steps:
      - name: Verify GitHub secret is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured for this repository." >&2
            exit 64
          fi
          echo "SUPABASE_ACCESS_TOKEN is configured."

      - name: Verify target project access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}")"

          if [[ "$status" != "200" ]]; then
            echo "Supabase project lookup failed with HTTP ${status}." >&2
            exit 1
          fi

          jq -e --arg ref "$SUPABASE_PROJECT_REF" '
            select((.ref // .id) == $ref or .id == $ref) |
            {id, name, region, status}
          ' "$response"

      - name: Verify Management API database query access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          payload='{"query":"select true as ok","read_only":true}'
          status="$(curl --silent --show-error \
            --request POST \
            --output "$response" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"

          if [[ "$status" != "201" ]]; then
            echo "Supabase database query failed with HTTP ${status}." >&2
            exit 1
          fi

          jq -e 'type == "array" and length == 1 and .[0].ok == true' "$response" >/dev/null
          echo "Supabase Management API database query access verified."
