name: Phase 8 restore boundary preflight

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-restore-boundary-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: a75131b7c8ad3060ba2ab4e805916dc1d0ad4ff2
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting
  NETWORK: fares-phase8-restore-preflight
  SOURCE_DB: fares-phase8-restore-source
  TARGET_DB: fares-phase8-restore-target

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact deployment candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Build exact candidate images
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          docker build --pull -f deploy/postgres/Dockerfile -t "fares-preflight-postgres:$CANDIDATE_SHA" .
          docker build --pull -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$CANDIDATE_SHA" \
            -t "fares-preflight-odoo:$CANDIDATE_SHA" .

      - name: Build initialized source and clean provider-like target
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          postgres_password="$(openssl rand -hex 32)"
          for secret in "$db_password" "$admin_password" "$postgres_password"; do echo "::add-mask::$secret"; done
          {
            echo "ODOO_DB_PASSWORD=$db_password"
            echo "ODOO_ADMIN_PASSWD=$admin_password"
            echo "LOCAL_POSTGRES_PASSWORD=$postgres_password"
          } >> "$GITHUB_ENV"

          mkdir -p deploy/.phase8-restore-preflight
          printf '%s' "$postgres_password" > deploy/.phase8-restore-preflight/postgres_password
          printf '%s' "$db_password" > deploy/.phase8-restore-preflight/odoo_db_password
          chmod 0444 deploy/.phase8-restore-preflight/*
          docker network create "$NETWORK"

          for container in "$SOURCE_DB" "$TARGET_DB"; do
            docker run -d --name "$container" --network "$NETWORK" \
              -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
              -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
              -e FARES_DB_NAME=postgres -e FARES_DB_USER=fares_app \
              -e FARES_DB_PASSWORD_FILE=/run/secrets/odoo_db_password \
              -v "$PWD/deploy/.phase8-restore-preflight/postgres_password:/run/secrets/postgres_password:ro" \
              -v "$PWD/deploy/.phase8-restore-preflight/odoo_db_password:/run/secrets/odoo_db_password:ro" \
              -v "$PWD/deploy/postgres/init/10-fares.sh:/docker-entrypoint-initdb.d/10-fares.sh:ro" \
              "fares-preflight-postgres:$CANDIDATE_SHA"
          done

          for container in "$SOURCE_DB" "$TARGET_DB"; do
            for attempt in $(seq 1 90); do
              if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then break; fi
              if [[ "$attempt" == 90 ]]; then docker logs "$container"; exit 1; fi
              sleep 2
            done
            cat deploy/vercel/bootstrap-session-store.sh | docker exec -i \
              -e FARES_DB_NAME=postgres -e FARES_DB_USER=fares_app -e POSTGRES_USER=postgres \
              "$container" bash
          done

          docker run --rm --network "$NETWORK" \
            -e ODOO_DB_HOST="$SOURCE_DB" -e ODOO_DB_PORT=5432 -e ODOO_DB_NAME=postgres \
            -e ODOO_DB_USER=fares_app -e ODOO_DB_PASSWORD="$db_password" -e ODOO_DB_SSLMODE=prefer \
            -e ODOO_ADMIN_PASSWD="$admin_password" -e ODOO_WORKERS=0 -e ODOO_MAX_CRON_THREADS=0 \
            -e FARES_SESSION_STORE=postgres -e PORT=8069 \
            "fares-preflight-odoo:$CANDIDATE_SHA" --stop-after-init -i "$PRODUCTION_ADDONS"

          test "$(docker exec "$SOURCE_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM ir_module_module WHERE name='fu_uat' AND state='installed';")" = 0
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S') AND pg_get_userbyid(c.relowner)='fares_app';")" = 0
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='fares_http_session' AND pg_get_userbyid(c.relowner)='postgres';")" = 1
          echo 'preflight_source=PASS seven_addons=installed fu_uat=absent target=provider_like_clean'

      - name: Verify corrected restore-list boundary
        shell: bash
        run: |
          set -euo pipefail
          dump=/tmp/fares-preflight.dump
          full=/tmp/fares-preflight-full.list
          restore=/tmp/fares-preflight-restore.list

          docker exec "$SOURCE_DB" pg_dump -U postgres -d postgres \
            --format=custom --schema=public --exclude-table=public.fares_http_session \
            --no-owner --no-privileges > "$dump"
          docker exec -i "$SOURCE_DB" pg_restore -l < "$dump" > "$full"

          # pg_restore TOC entries carry a trailing archive owner, for example:
          #   SCHEMA - public postgres
          # Match the object descriptor rather than anchoring the object name at EOL.
          grep -v -E '^[0-9]+; [0-9]+ [0-9]+ (SCHEMA - public|COMMENT - SCHEMA public|ACL - SCHEMA public|EXTENSION - (unaccent|pg_trgm)|COMMENT - EXTENSION (unaccent|pg_trgm))( |$)|fares_http_session' \
            "$full" > "$restore"

          test -s "$dump"
          test -s "$restore"
          ! grep -Eq '^[0-9]+; [0-9]+ [0-9]+ (SCHEMA - public|COMMENT - SCHEMA public|ACL - SCHEMA public|EXTENSION - (unaccent|pg_trgm)|COMMENT - EXTENSION (unaccent|pg_trgm))( |$)|fares_http_session' "$restore"

          # Prove that the source archive actually contained provider-boundary entries;
          # otherwise a green filter assertion would not exercise the regression.
          grep -Eq '^[0-9]+; [0-9]+ [0-9]+ (SCHEMA - public|EXTENSION - (unaccent|pg_trgm))( |$)' "$full"

          docker cp "$dump" "$SOURCE_DB":/tmp/fares-preflight.dump
          docker cp "$restore" "$SOURCE_DB":/tmp/fares-preflight-restore.list
          docker exec -e PGPASSWORD="$ODOO_DB_PASSWORD" "$SOURCE_DB" \
            pg_restore --host="$TARGET_DB" --port=5432 --username=fares_app --dbname=postgres \
            --no-owner --no-privileges --exit-on-error --jobs=1 \
            --use-list=/tmp/fares-preflight-restore.list /tmp/fares-preflight.dump

          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace WHERE e.extname IN ('unaccent','pg_trgm') AND n.nspname='public';")" = 2
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='fares_http_session' AND pg_get_userbyid(c.relowner)='postgres';")" = 1
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S') AND pg_get_userbyid(c.relowner)='fares_app';")" -gt 0

          states="$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT string_agg(name || '=' || state, ',' ORDER BY name) FROM ir_module_module WHERE name = ANY (ARRAY['fu_core','fu_retail','fu_preorder','fu_production','fu_business','fu_public_api','fu_reporting']);")"
          for addon in fu_core fu_retail fu_preorder fu_production fu_business fu_public_api fu_reporting; do
            [[ ",$states," == *",${addon}=installed,"* ]] || { echo "Restored addon not installed: $addon" >&2; exit 1; }
          done
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM ir_module_module WHERE name='fu_uat' AND state='installed';")" = 0
          echo "restore_boundary=PASS entries=$(grep -vc '^;' "$restore") provider_objects=preserved application_objects=restored"

      - name: Verify repeat seven-addon upgrade on restored target
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network "$NETWORK" \
            -e ODOO_DB_HOST="$TARGET_DB" -e ODOO_DB_PORT=5432 -e ODOO_DB_NAME=postgres \
            -e ODOO_DB_USER=fares_app -e ODOO_DB_PASSWORD="$ODOO_DB_PASSWORD" -e ODOO_DB_SSLMODE=prefer \
            -e ODOO_ADMIN_PASSWD="$ODOO_ADMIN_PASSWD" -e ODOO_WORKERS=0 -e ODOO_MAX_CRON_THREADS=0 \
            -e FARES_SESSION_STORE=postgres -e PORT=8069 \
            "fares-preflight-odoo:$CANDIDATE_SHA" --stop-after-init -u "$PRODUCTION_ADDONS"

          states="$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT string_agg(name || '=' || state, ',' ORDER BY name) FROM ir_module_module WHERE name = ANY (ARRAY['fu_core','fu_retail','fu_preorder','fu_production','fu_business','fu_public_api','fu_reporting']);")"
          for addon in fu_core fu_retail fu_preorder fu_production fu_business fu_public_api fu_reporting; do
            [[ ",$states," == *",${addon}=installed,"* ]] || { echo "Target upgrade state invalid: $addon" >&2; exit 1; }
          done
          test "$(docker exec "$TARGET_DB" psql -U postgres -d postgres -Atc "SELECT count(*) FROM ir_module_module WHERE name='fu_uat' AND state='installed';")" = 0
          echo 'restored_target_upgrade=PASS seven_addons=installed fu_uat=absent'

      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          docker rm -f "$SOURCE_DB" "$TARGET_DB" >/dev/null 2>&1 || true
          docker network rm "$NETWORK" >/dev/null 2>&1 || true
          rm -rf deploy/.phase8-restore-preflight /tmp/fares-preflight.dump /tmp/fares-preflight-full.list /tmp/fares-preflight-restore.list || true
