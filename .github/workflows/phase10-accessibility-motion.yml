name: Phase 10 accessibility and motion

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-accessibility-motion.yml"
      - "docs/validation/PHASE_10_PUBLIC_SITE_PRODUCTIONIZATION.md"
  pull_request:
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-accessibility-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-accessibility-motion-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  accessibility-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FU_PUBLIC_PROVIDER: fixture
      PUBLIC_SITE_ORIGIN: https://faresuniform.uk
    defaults:
      run:
        working-directory: apps/public-web

    steps:
      - name: Checkout exact Phase 10 candidate
        uses: actions/checkout@v5

      - name: Verify exact source
        run: test "$(git -C ../.. rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck production public web
        run: npm run typecheck

      - name: Build production public web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility and motion contract
        run: npx playwright test tests/accessibility-motion.spec.ts

      - name: Record exact evidence identity
        if: always()
        run: |
          mkdir -p evidence/phase10-accessibility
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "phase9_visual_authority=4120c33fff9ac7ee6a400a7e51e2e8cbf17ce256"
            node --version
            npm --version
            npx next --version
            npx playwright --version
          } > evidence/phase10-accessibility/runtime.txt

      - name: Upload accessibility and motion evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase10-accessibility-motion-${{ github.sha }}
          path: |
            apps/public-web/evidence/phase10-accessibility
            apps/public-web/playwright-report
            apps/public-web/test-results
          if-no-files-found: warn
          retention-days: 14
