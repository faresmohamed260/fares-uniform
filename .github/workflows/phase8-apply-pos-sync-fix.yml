name: Phase 8 materialize cashier POS sync patch

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-apply-pos-sync-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact workflow generation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize patched live UAT workflow as ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA" || { echo "Refusing stale materialization: run=$GITHUB_SHA branch_head=$remote_head" >&2; exit 1; }

          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase8-live-business-uat.yml')
          target = Path('proof/phase8-live-business-uat.patched.yml')
          text = source.read_text(encoding='utf-8')
          start_marker = '              order = env["pos.order"].with_user(cashier).create({\n'
          end_marker = '              payment_wizard.with_context(**payment_context).check()\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('expected exactly one legacy POS wizard block')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          lines = [
              '# Exercise the same server path used by the real POS frontend. The',
              '# backend pos.make.payment wizard is intentionally POS-manager-only in',
              '# pinned Odoo; cashiers persist orders and payments through sync_from_ui.',
              'order_uuid = f"{prefix}-cash-sale"',
              'order_payload = {',
              '    "amount_paid": product.lst_price,',
              '    "amount_return": 0,',
              '    "amount_tax": 0,',
              '    "amount_total": product.lst_price,',
              '    "date_order": fields.Datetime.to_string(fields.Datetime.now()),',
              '    "fiscal_position_id": config.default_fiscal_position_id.id,',
              '    "pricelist_id": config.pricelist_id.id,',
              '    "name": f"Order {order_uuid}",',
              '    "last_order_preparation_change": "{}",',
              '    "lines": [(0, 0, {',
              '        "id": 1,',
              '        "pack_lot_ids": [],',
              '        "price_unit": product.lst_price,',
              '        "product_id": product.id,',
              '        "price_subtotal": product.lst_price,',
              '        "price_subtotal_incl": product.lst_price,',
              '        "qty": 1,',
              '        "tax_ids": [(6, 0, [])],',
              '        "discount": 0.0,',
              '    })],',
              '    "partner_id": False,',
              '    "session_id": session.id,',
              '    "payment_ids": [(0, 0, {',
              '        "amount": product.lst_price,',
              '        "name": fields.Datetime.now(),',
              '        "payment_method_id": cash_pm.id,',
              '    })],',
              '    "uuid": order_uuid,',
              '    "user_id": cashier.id,',
              '    "to_invoice": False,',
              '}',
              'env["pos.order"].with_user(cashier).sync_from_ui([order_payload])',
              'order = env["pos.order"].with_user(cashier).search([("uuid", "=", order_uuid)], limit=1)',
              'require(order, "cashier POS sync did not create an authoritative order")',
          ]
          replacement = ''.join(f'              {line}\n' for line in lines)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          git diff --check -- proof/phase8-live-business-uat.patched.yml
          grep -F '              env["pos.order"].with_user(cashier).sync_from_ui([order_payload])' proof/phase8-live-business-uat.patched.yml
          if grep -F 'env["pos.make.payment"].with_user(cashier)' proof/phase8-live-business-uat.patched.yml; then
            echo 'Legacy manager-only POS payment wizard path remains in materialized workflow' >&2
            exit 1
          fi

          git config user.name 'Fares Uniform CI'
          git config user.email '121525183+faresmohamed260@users.noreply.github.com'
          git add proof/phase8-live-business-uat.patched.yml
          git commit -m 'ci: rematerialize cashier POS sync workflow blob'
          git push origin "HEAD:${GITHUB_REF_NAME}"
