name: Phase 2B UI diagnostic

on:
  push:
    branches: ["phase-2b/preorder-balance-collection"]
    paths:
      - ".github/workflows/phase2b-ui-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2b-ui-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-ui-isolation:
    name: Current UI ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: contracts
            tags: /fu_preorder:TestFaresPreorderUIContracts
          - case: create-en
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_creation_english_online_guard
          - case: create-ar
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_creation_arabic_rtl_online_guard
          - case: payment-en
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_payment_english_online_guard
          - case: payment-ar
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_payment_arabic_rtl_online_guard
          - case: allocation-en
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_readiness_allocation_english
          - case: collection-ar
            tags: /fu_preorder:TestFaresPreorderBilingualUI.test_preorder_partial_collection_arabic_rtl
          - case: browser-class
            tags: /fu_preorder:TestFaresPreorderBilingualUI
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2b-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/runtime.txt
          printf 'case=%s\n' '${{ matrix.case }}' >> evidence/runtime.txt
          printf 'tags=%s\n' '${{ matrix.tags }}' >> evidence/runtime.txt

      - name: Run current Phase 2B UI case
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag_ui \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='${{ matrix.tags }}' \
            --screenshots=evidence/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/ui.log

      - name: Summarize diagnostic evidence
        if: always()
        run: |
          {
            echo '## Phase 2B current UI isolation: ${{ matrix.case }}'
            echo
            cat evidence/runtime.txt 2>/dev/null || true
            echo
            echo '### Failure/browser lines'
            grep -E 'ERROR|FAIL|Traceback|AssertionError|test successful|browser|Chrome|screenshot|fu_preorder' evidence/ui.log 2>/dev/null | tail -n 200 || true
            echo
            echo '### Hosted screenshots'
            find evidence/screenshots -type f -maxdepth 3 -printf '%P\n' 2>/dev/null | sort || true
          } | tee evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2b-ui-current-${{ matrix.case }}-${{ github.sha }}
          path: evidence/
          retention-days: 2
