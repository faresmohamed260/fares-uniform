name: Phase 2B UI diagnostic

on:
  push:
    branches: ["phase-2b/preorder-balance-collection"]
    paths:
      - ".github/workflows/phase2b-ui-diagnostic.yml"
      - "addons/fu_preorder/tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2b-ui-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collection-ar-sequence:
    name: Collection AR sequence ${{ matrix.checkpoint }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        checkpoint:
          - action-found
          - dialog-opened
          - ready-context
          - submit-found
          - focus
          - full-capture
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2b-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
      CHECKPOINT: ${{ matrix.checkpoint }}
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/runtime.txt
          printf 'checkpoint=%s\n' "$CHECKPOINT" >> evidence/runtime.txt

      - name: Instrument collection checkpoint
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("addons/fu_preorder/tests/test_ui.py")
          text = path.read_text()
          checkpoint = os.environ["CHECKPOINT"]

          anchors = {
              "action-found": "const actionButton = await waitForButtonText('تسجيل الاستلام');",
              "dialog-opened": "const dialog = await waitFor('.o_dialog');",
              "ready-context": "if (!dialog.innerText.includes('الأصناف الجاهزة')) throw new Error('Arabic ready-items context missing');",
              "submit-found": "const submit = await waitFor('.o_dialog button[name=\"action_collect\"]');",
              "focus": "if (document.activeElement !== submit) throw new Error('Collection action cannot receive keyboard focus');",
          }
          capture_anchor = 'with capture_views("preorder_collection_ar", rtl=True):'

          if capture_anchor not in text:
              raise AssertionError("collection capture anchor missing")

          if checkpoint == "full-capture":
              pass
          elif checkpoint in anchors:
              anchor = anchors[checkpoint]
              if anchor not in text:
                  raise AssertionError(f"collection checkpoint anchor missing: {checkpoint}")
              text = text.replace(
                  anchor,
                  anchor + "\n                console.log('test successful'); return;",
                  1,
              )
              text = "from contextlib import nullcontext\n" + text
              text = text.replace(capture_anchor, "with nullcontext():", 1)
          else:
              raise AssertionError(f"Unknown checkpoint: {checkpoint}")

          path.write_text(text)
          PY

      - name: Run collection Arabic ${{ matrix.checkpoint }}
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag_collection \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestFaresPreorderBilingualUI.test_preorder_partial_collection_arabic_rtl' \
            --screenshots=evidence/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/browser.log

      - name: Summarize diagnostic evidence
        if: always()
        run: |
          {
            echo '## Phase 2B collection Arabic sequence: ${{ matrix.checkpoint }}'
            echo
            cat evidence/runtime.txt 2>/dev/null || true
            echo
            echo '### Failure/browser lines'
            grep -E 'ERROR|FAIL|Traceback|AssertionError|test successful|browser|Chrome|screenshot|test_preorder_partial_collection_arabic_rtl' evidence/browser.log 2>/dev/null | tail -n 200 || true
            echo
            echo '### Hosted screenshots'
            find evidence/screenshots -type f -maxdepth 3 -printf '%P\n' 2>/dev/null | sort || true
          } | tee evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2b-ui-collection-sequence-${{ matrix.checkpoint }}-${{ github.sha }}
          path: evidence/
          retention-days: 2
