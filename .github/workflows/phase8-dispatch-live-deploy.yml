name: Phase 8 dispatch existing live deploy

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-dispatch-live-deploy.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: phase8-live-deploy-dispatch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-existing-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch existing Phase 8 live deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'phase-8/commercial-staging-readiness'
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase8-vercel-live-deploy-v2.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME"
          echo "existing_live_deploy_dispatched=PASS ref=$GITHUB_REF_NAME"
