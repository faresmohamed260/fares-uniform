name: Phase 8 live business UAT preflight

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-live-business-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-business-uat-preflight-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_DB_EPOCH: 34892811053:1:2fc625f45bcc6c4bbc3ffc47e3efa58bc8089d7a
  SUPABASE_API_BASE: https://api.supabase.com/v1
  SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify fresh workflow generation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'Start a fresh preflight run; reruns are not evidence.' >&2; exit 1; }
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA" || { echo "Refusing stale preflight: run=$GITHUB_SHA branch_head=$remote_head" >&2; exit 1; }
          echo "fresh_business_preflight=PASS sha=$GITHUB_SHA"

      - name: Inspect managed business-UAT topology read-only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo 'SUPABASE_ACCESS_TOKEN missing' >&2; exit 64; }
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          assert_eq() {
            local label="$1" actual="$2" expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "$label=FAIL expected=$expected actual=$actual" >&2
              exit 1
            fi
            echo "$label=PASS value=$actual"
          }

          read -r -d '' query <<'SQL' || true
          SELECT
            (SELECT epoch_id FROM fares_control.deployment_epoch WHERE singleton=TRUE) AS epoch_id,
            (SELECT rolcanlogin FROM pg_roles WHERE rolname='fares_app') AS rolcanlogin,
            has_schema_privilege('fares_app','public','CREATE') AS can_create_public,
            (SELECT count(*)::int FROM ir_module_module WHERE name='fu_uat' AND state='installed') AS fu_uat_installed,
            (SELECT count(*)::int FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p','v','m','S') AND pg_get_userbyid(c.relowner)='fares_app') AS app_owned_relations,

            (SELECT state FROM ir_module_module WHERE name='point_of_sale') AS module_point_of_sale,
            (SELECT state FROM ir_module_module WHERE name='stock') AS module_stock,
            (SELECT state FROM ir_module_module WHERE name='stock_account') AS module_stock_account,
            (SELECT state FROM ir_module_module WHERE name='account') AS module_account,
            (SELECT state FROM ir_module_module WHERE name='sale_management') AS module_sale_management,
            (SELECT state FROM ir_module_module WHERE name='sale_stock') AS module_sale_stock,
            (SELECT state FROM ir_module_module WHERE name='crm') AS module_crm,
            (SELECT state FROM ir_module_module WHERE name='purchase') AS module_purchase,
            (SELECT state FROM ir_module_module WHERE name='purchase_stock') AS module_purchase_stock,
            (SELECT state FROM ir_module_module WHERE name='mrp') AS module_mrp,
            (SELECT state FROM ir_module_module WHERE name='fu_core') AS module_fu_core,
            (SELECT state FROM ir_module_module WHERE name='fu_retail') AS module_fu_retail,
            (SELECT state FROM ir_module_module WHERE name='fu_preorder') AS module_fu_preorder,
            (SELECT state FROM ir_module_module WHERE name='fu_production') AS module_fu_production,
            (SELECT state FROM ir_module_module WHERE name='fu_business') AS module_fu_business,
            (SELECT state FROM ir_module_module WHERE name='fu_public_api') AS module_fu_public_api,
            (SELECT state FROM ir_module_module WHERE name='fu_reporting') AS module_fu_reporting,

            to_regclass('public.pos_config') IS NOT NULL AS table_pos_config,
            to_regclass('public.pos_session') IS NOT NULL AS table_pos_session,
            to_regclass('public.pos_order') IS NOT NULL AS table_pos_order,
            to_regclass('public.pos_payment') IS NOT NULL AS table_pos_payment,
            to_regclass('public.stock_warehouse') IS NOT NULL AS table_stock_warehouse,
            to_regclass('public.stock_warehouse_orderpoint') IS NOT NULL AS table_reorder_rule,
            to_regclass('public.product_supplierinfo') IS NOT NULL AS table_supplier_info,
            to_regclass('public.stock_valuation_layer') IS NOT NULL AS table_valuation_layer,
            to_regclass('public.purchase_order') IS NOT NULL AS table_purchase_order,

            (SELECT count(*)::int FROM res_company) AS companies,
            (SELECT count(*)::int FROM stock_warehouse) AS warehouses,
            (SELECT count(*)::int FROM stock_location WHERE fu_location_role='store') AS fares_store_locations,
            (SELECT count(*)::int FROM stock_location WHERE fu_location_role='storage') AS fares_storage_locations,
            (SELECT count(*)::int FROM pos_config) AS pos_configs,
            (SELECT count(*)::int FROM pos_session WHERE state IN ('opening_control','opened','closing_control')) AS open_pos_sessions,
            (SELECT count(*)::int FROM ir_cron WHERE active AND nextcall IS NOT NULL AND nextcall <= now()) AS due_crons,
            (SELECT count(*)::int FROM ir_cron WHERE active AND coalesce(failure_count,0) > 0) AS failing_crons,

            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='stock.location' AND name='fu_location_role') AS field_location_role,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='pos.payment' AND name='fu_manual_confirmed') AS field_pos_manual_confirmed,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='pos.payment.method' AND name='fu_confirmation_mode') AS field_pos_confirmation_mode,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.category' AND name='property_cost_method') AS field_cost_method,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.category' AND name='property_valuation') AS field_valuation,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='stock.warehouse.orderpoint' AND name='location_id') AS field_orderpoint_location,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='stock.warehouse.orderpoint' AND name='product_id') AS field_orderpoint_product,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='stock.warehouse.orderpoint' AND name='product_min_qty') AS field_orderpoint_min,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='stock.warehouse.orderpoint' AND name='product_max_qty') AS field_orderpoint_max,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.supplierinfo' AND name='partner_id') AS field_supplier_partner,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.supplierinfo' AND name='product_tmpl_id') AS field_supplier_template,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.supplierinfo' AND name='price') AS field_supplier_price,
            EXISTS (SELECT 1 FROM ir_model_fields WHERE model='product.supplierinfo' AND name='min_qty') AS field_supplier_min_qty;
          SQL
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          assert_eq business_preflight_http "$status" 201
          assert_eq result_rows "$(jq 'length' "$response")" 1

          # Emit one aggregate metadata record only; no business rows or SQL text.
          jq -c '.[0]' "$response"

          assert_eq epoch "$(jq -r '.[0].epoch_id' "$response")" "$EXPECTED_DB_EPOCH"
          assert_eq runtime_login "$(jq -r '.[0].rolcanlogin' "$response")" true
          assert_eq schema_create "$(jq -r '.[0].can_create_public' "$response")" false
          assert_eq fu_uat_installed "$(jq -r '.[0].fu_uat_installed' "$response")" 0
          assert_eq app_owned_relations "$(jq -r '.[0].app_owned_relations' "$response")" 988

          for module in point_of_sale stock stock_account account sale_management sale_stock crm fu_core fu_retail fu_preorder fu_production fu_business fu_public_api fu_reporting; do
            assert_eq "module_${module}" "$(jq -r --arg key "module_${module}" '.[0][$key] // "missing"' "$response")" installed
          done

          purchase_state="$(jq -r '.[0].module_purchase // "missing"' "$response")"
          purchase_stock_state="$(jq -r '.[0].module_purchase_stock // "missing"' "$response")"
          mrp_state="$(jq -r '.[0].module_mrp // "missing"' "$response")"
          echo "PURCHASE_STATE=$purchase_state" >> "$GITHUB_ENV"
          echo "PURCHASE_STOCK_STATE=$purchase_stock_state" >> "$GITHUB_ENV"
          echo "MRP_STATE=$mrp_state" >> "$GITHUB_ENV"
          echo "purchase_module_state=INFO purchase=$purchase_state purchase_stock=$purchase_stock_state mrp=$mrp_state"

          for key in pos_config pos_session pos_order pos_payment stock_warehouse reorder_rule supplier_info valuation_layer; do
            assert_eq "table_${key}" "$(jq -r --arg key "table_${key}" '.[0][$key]' "$response")" true
          done
          echo "PURCHASE_ORDER_TABLE=$(jq -r '.[0].table_purchase_order' "$response")" >> "$GITHUB_ENV"

          assert_eq fares_store_locations "$(jq -r '.[0].fares_store_locations' "$response")" 1
          assert_eq fares_storage_locations "$(jq -r '.[0].fares_storage_locations' "$response")" 1
          assert_eq ordinary_due_crons "$(jq -r '.[0].due_crons' "$response")" 19
          assert_eq failing_crons "$(jq -r '.[0].failing_crons' "$response")" 0
          echo "COMPANIES=$(jq -r '.[0].companies' "$response")" >> "$GITHUB_ENV"
          echo "WAREHOUSES=$(jq -r '.[0].warehouses' "$response")" >> "$GITHUB_ENV"
          echo "POS_CONFIGS=$(jq -r '.[0].pos_configs' "$response")" >> "$GITHUB_ENV"
          echo "OPEN_POS_SESSIONS=$(jq -r '.[0].open_pos_sessions' "$response")" >> "$GITHUB_ENV"

          for key in location_role pos_manual_confirmed pos_confirmation_mode cost_method valuation orderpoint_location orderpoint_product orderpoint_min orderpoint_max supplier_partner supplier_template supplier_price supplier_min_qty; do
            assert_eq "field_${key}" "$(jq -r --arg key "field_${key}" '.[0][$key]' "$response")" true
          done
          echo 'business_uat_topology=PASS'

      - name: Publish preflight summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Phase 8 live business UAT preflight'
            echo
            echo "- Workflow source: \`$GITHUB_SHA\`"
            echo '- Managed epoch/seal: PASS'
            echo '- Seven production addons: installed; `fu_uat`: absent'
            echo "- Company records: \`$COMPANIES\`"
            echo "- Warehouse records: \`$WAREHOUSES\`"
            echo '- Fares physical custody: exactly one Retail Store + one Storage location'
            echo "- Existing POS configs: \`$POS_CONFIGS\`; open POS sessions: \`$OPEN_POS_SESSIONS\`"
            echo '- Reorder rule / supplier-info / valuation-layer primitives: present'
            echo "- Purchase: \`$PURCHASE_STATE\`; purchase_stock: \`$PURCHASE_STOCK_STATE\`; MRP: \`$MRP_STATE\`; purchase_order table: \`$PURCHASE_ORDER_TABLE\`"
            echo '- Known ordinary due-cron backlog: `19`, failure_count>0: `0` (read-only; not executed/rescheduled)'
            echo '- Accepted business-credit policy remains full payment before shipment; pay-after-delivery customer credit terms are not an MVP policy.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'phase8_live_business_preflight=PASS'
