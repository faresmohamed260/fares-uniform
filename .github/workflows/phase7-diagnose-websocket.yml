name: Phase 7 websocket startup diagnostics

on:
  push:
    branches:
      - phase-7/vercel-deployment-adaptation
    paths:
      - '.github/workflows/phase7-diagnose-websocket.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-websocket-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  ODOO_DB_NAME: fares
  ODOO_DB_USER: fares_app
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting
  REALTIME_ADDON: bus
  PHASE7_NETWORK: fares-phase7-ws-diag
  PHASE7_DB_CONTAINER: fares-phase7-ws-diag-db
  PHASE7_WS_CONTAINER: fares-phase7-ws-diag-evented

jobs:
  diagnose-evented-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prepare evidence and synthetic credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p evidence deploy/.phase7-secrets
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/postgres_superuser_password >/dev/null
          openssl rand -hex 32 | sudo tee deploy/.phase7-secrets/odoo_db_password >/dev/null
          openssl rand -hex 32 > deploy/.phase7-secrets/odoo_admin_passwd
          sudo chown root:root deploy/.phase7-secrets/postgres_superuser_password
          sudo chmod 0400 deploy/.phase7-secrets/postgres_superuser_password
          sudo chown root:10001 deploy/.phase7-secrets/odoo_db_password
          sudo chmod 0440 deploy/.phase7-secrets/odoo_db_password
          chmod 0600 deploy/.phase7-secrets/odoo_admin_passwd
          printf 'fares_sha=%s\nodoo_sha=%s\nrealtime_addon=%s\n' "$GITHUB_SHA" "$ODOO_SHA" "$REALTIME_ADDON" > evidence/source-authority.txt

      - name: Build exact runtime images
        run: |
          set -euo pipefail
          docker build --pull -f deploy/postgres/Dockerfile -t "fares-uniform-postgres:$GITHUB_SHA" .
          docker build --pull \
            -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$GITHUB_SHA" \
            -t "fares-uniform-vercel:$GITHUB_SHA" .
          test "$(docker image inspect -f '{{json .Config.Volumes}}' "fares-uniform-vercel:$GITHUB_SHA")" = 'null'
          docker run --rm --entrypoint bash "fares-uniform-vercel:$GITHUB_SHA" -lc '
            /opt/odoo-venv/bin/python -c "import gevent, websocket"
            grep -q "_VERSION = \"19.0-2\"" /opt/odoo/addons/bus/websocket.py
          '

      - name: Start PostgreSQL and bootstrap session schema
        run: |
          set -euo pipefail
          docker network create "$PHASE7_NETWORK"
          docker run -d \
            --name "$PHASE7_DB_CONTAINER" \
            --network "$PHASE7_NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/postgres_superuser_password \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e FARES_DB_PASSWORD_FILE=/run/secrets/odoo_db_password \
            -v "$PWD/deploy/.phase7-secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro" \
            -v "$PWD/deploy/.phase7-secrets/odoo_db_password:/run/secrets/odoo_db_password:ro" \
            -v "$PWD/deploy/postgres/init/10-fares.sh:/docker-entrypoint-initdb.d/10-fares.sh:ro" \
            "fares-uniform-postgres:$GITHUB_SHA"

          for attempt in $(seq 1 60); do
            READY="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc \
              "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$ODOO_DB_USER') THEN 'ready' ELSE 'waiting' END;" 2>/dev/null || true)"
            [[ "$READY" == ready ]] && break
            if [[ "$attempt" == 60 ]]; then docker logs "$PHASE7_DB_CONTAINER"; exit 1; fi
            sleep 2
          done

          cat deploy/vercel/bootstrap-session-store.sh | docker exec -i \
            -e FARES_DB_NAME="$ODOO_DB_NAME" \
            -e FARES_DB_USER="$ODOO_DB_USER" \
            -e POSTGRES_USER=postgres \
            "$PHASE7_DB_CONTAINER" bash

      - name: Initialize production addons plus realtime bus
        run: |
          set -euo pipefail
          DB_PASSWORD="$(sudo cat deploy/.phase7-secrets/odoo_db_password)"
          ADMIN_PASSWD="$(cat deploy/.phase7-secrets/odoo_admin_passwd)"
          for MODE in install upgrade; do
            if [[ "$MODE" == install ]]; then ACTION=-i; else ACTION=-u; fi
            docker run --rm \
              --network "$PHASE7_NETWORK" \
              -e ODOO_DB_HOST="$PHASE7_DB_CONTAINER" \
              -e ODOO_DB_PORT=5432 \
              -e ODOO_DB_NAME="$ODOO_DB_NAME" \
              -e ODOO_DB_USER="$ODOO_DB_USER" \
              -e ODOO_DB_PASSWORD="$DB_PASSWORD" \
              -e ODOO_DB_SSLMODE=prefer \
              -e ODOO_ADMIN_PASSWD="$ADMIN_PASSWD" \
              -e PORT=8069 \
              -e ODOO_RUNTIME_MODE=http \
              -e ODOO_WORKERS=0 \
              -e ODOO_MAX_CRON_THREADS=0 \
              "fares-uniform-vercel:$GITHUB_SHA" \
              --stop-after-init "$ACTION" "$PRODUCTION_ADDONS,$REALTIME_ADDON"
          done
          BUS_STATE="$(docker exec "$PHASE7_DB_CONTAINER" psql -U postgres -d "$ODOO_DB_NAME" -Atc "SELECT state FROM ir_module_module WHERE name = '$REALTIME_ADDON';")"
          test "$BUS_STATE" = installed
          printf 'realtime_addon_state=%s:%s\n' "$REALTIME_ADDON" "$BUS_STATE" > evidence/addon-state.txt

      - name: Reproduce post-bus evented startup and preserve exact boundary
        id: reproduce
        continue-on-error: true
        run: |
          set -euo pipefail
          DB_PASSWORD="$(sudo cat deploy/.phase7-secrets/odoo_db_password)"
          ADMIN_PASSWD="$(cat deploy/.phase7-secrets/odoo_admin_passwd)"

          docker run -d \
            --name "$PHASE7_WS_CONTAINER" \
            --network "$PHASE7_NETWORK" \
            -p 18072:8069 \
            -e ODOO_DB_HOST="$PHASE7_DB_CONTAINER" \
            -e ODOO_DB_PORT=5432 \
            -e ODOO_DB_NAME="$ODOO_DB_NAME" \
            -e ODOO_DB_USER="$ODOO_DB_USER" \
            -e ODOO_DB_PASSWORD="$DB_PASSWORD" \
            -e ODOO_DB_SSLMODE=prefer \
            -e ODOO_ADMIN_PASSWD="$ADMIN_PASSWD" \
            -e PORT=8069 \
            -e ODOO_RUNTIME_MODE=websocket \
            -e ODOO_WORKERS=0 \
            -e ODOO_MAX_CRON_THREADS=0 \
            "fares-uniform-vercel:$GITHUB_SHA"

          HTTP_CODE=000
          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect -f '{{.State.Status}}' "$PHASE7_WS_CONTAINER" 2>/dev/null || true)"
            if [[ "$STATUS" == exited || "$STATUS" == dead ]]; then break; fi
            HTTP_CODE="$(curl -sS --max-time 2 -D evidence/evented-health.headers -o evidence/evented-health.body -w '%{http_code}' \
              "http://127.0.0.1:18072/websocket/health" || true)"
            if [[ "$HTTP_CODE" == 200 ]]; then break; fi
            sleep 1
          done

          docker logs "$PHASE7_WS_CONTAINER" > evidence/evented.log 2>&1 || true
          docker inspect -f 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{json .State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
            "$PHASE7_WS_CONTAINER" > evidence/evented-inspect.txt || true
          docker inspect -f 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} user={{json .Config.User}} mounts={{json .Mounts}}' \
            "$PHASE7_WS_CONTAINER" > evidence/evented-runtime.txt || true
          docker exec "$PHASE7_WS_CONTAINER" cat /tmp/fares-odoo.conf > evidence/evented-config.txt 2>/dev/null || true
          printf 'http_health_code=%s\n' "$HTTP_CODE" >> evidence/evented-runtime.txt

          if [[ "$HTTP_CODE" == 200 ]]; then
            echo 'evented_startup=PASS health=200 bus=installed' | tee evidence/evented-result.txt
            exit 0
          fi

          cat evidence/evented.log
          cat evidence/evented-inspect.txt
          cat evidence/evented-health.headers 2>/dev/null || true
          cat evidence/evented-health.body 2>/dev/null || true
          exit 1

      - name: Persist diagnostics
        if: always()
        run: |
          docker logs "$PHASE7_WS_CONTAINER" > evidence/evented.log 2>&1 || true
          docker ps -a --filter "name=$PHASE7_WS_CONTAINER" --format 'name={{.Names}} status={{.Status}} ports={{.Ports}}' > evidence/container-state.txt || true
          docker inspect -f 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} error={{json .State.Error}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
            "$PHASE7_WS_CONTAINER" > evidence/evented-inspect.txt 2>/dev/null || true

      - name: Upload evented startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-websocket-startup-diagnostics-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Fail after preserving RED evidence
        if: steps.reproduce.outcome == 'failure'
        run: exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "$PHASE7_WS_CONTAINER" "$PHASE7_DB_CONTAINER" 2>/dev/null || true
          docker network rm "$PHASE7_NETWORK" 2>/dev/null || true
          sudo rm -rf deploy/.phase7-secrets
