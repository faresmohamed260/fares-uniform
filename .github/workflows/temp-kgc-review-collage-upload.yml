name: Temporary KGC review collage upload

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - .github/workflows/temp-kgc-review-collage-upload.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_ACCOUNT_ID: "9b0bf4a19a68badb653f984151b62fd2"
  BUCKET: "fares-uniform-media-private"
  OBJECT_KEY: "kgc/review/kgc-national-four-grade-collage-v1.png"
  EXPECTED_SHA256: "a83d1e7a992cdd1144491355ea33601918e9848ed789f6acb1466d133cccda87"

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact generated review derivative
        env:
          SOURCE_URL: ${{ secrets.KGC_REVIEW_COLLAGE_SOURCE_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_URL"
          curl --fail-with-body --silent --show-error --retry 3 "$SOURCE_URL" -o /tmp/kgc-collage.png
          echo "$EXPECTED_SHA256  /tmp/kgc-collage.png" | sha256sum -c -
      - name: Upload to private review storage and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.135.0 r2 object put "$BUCKET/$OBJECT_KEY" --file /tmp/kgc-collage.png --content-type image/png --remote
          npx --yes wrangler@4.135.0 r2 object get "$BUCKET/$OBJECT_KEY" --file /tmp/kgc-collage-verify.png --remote
          echo "$EXPECTED_SHA256  /tmp/kgc-collage-verify.png" | sha256sum -c -
          printf '{"bucket":"%s","key":"%s","sha256":"%s","publication":"NO","scope":"protected review"}\n' "$BUCKET" "$OBJECT_KEY" "$EXPECTED_SHA256" > /tmp/kgc-collage-evidence.json
      - name: Upload evidence
        uses: actions/upload-artifact@v5
        with:
          name: kgc-review-collage-upload-${{ github.sha }}
          path: /tmp/kgc-collage-evidence.json
          retention-days: 14