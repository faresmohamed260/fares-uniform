name: Phase 10 full hosted candidate

on:
  push:
    branches:
      - phase-10/public-site-productionization
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-full-candidate.yml"
      - "docs/ui/assets/approved-pattern-in-motion/**"
      - "docs/validation/PHASE_10_PUBLIC_SITE_PRODUCTIONIZATION.md"
  pull_request:
    paths:
      - "apps/public-web/**"
      - ".github/workflows/phase10-full-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-full-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUBLIC_SITE_ORIGIN: https://faresuniform.uk

jobs:
  full-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/public-web
    steps:
      - name: Checkout exact Phase 10 candidate
        uses: actions/checkout@v5

      - name: Verify exact source
        run: test "$(git -C ../.. rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/public-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Create candidate evidence directory
        run: mkdir -p evidence/phase10-full-candidate

      - name: Run source static-quality gate
        run: npm run lint | tee evidence/phase10-full-candidate/static-quality.txt

      - name: Typecheck production public web
        run: npm run typecheck

      - name: Build production public web
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run foundation matrix
        env:
          FU_PUBLIC_PROVIDER: fixture
        run: npx playwright test tests/foundation.spec.ts

      - name: Run Pattern migration matrix
        env:
          FU_PUBLIC_PROVIDER: fixture
        run: npx playwright test tests/pattern-migration.spec.ts

      - name: Run accessibility and motion matrix
        env:
          FU_PUBLIC_PROVIDER: fixture
        run: npx playwright test tests/accessibility-motion.spec.ts

      - name: Run enquiry hardening matrix
        env:
          FU_PUBLIC_PROVIDER: fixture
        run: npx playwright test tests/enquiry-hardening.spec.ts

      - name: Run full-candidate rendered captures
        env:
          FU_PUBLIC_PROVIDER: fixture
        run: npx playwright test tests/full-candidate.spec.ts

      - name: Run cache SEO resilience matrix
        env:
          FU_PUBLIC_PROVIDER: cache-fixture
          ODOO_BASE_URL: http://127.0.0.1:4173/api/fixture-odoo
          ODOO_DB_NAME: fixture
          PUBLIC_CACHE_REVALIDATE_SECONDS: "1"
          FU_ENQUIRY_FORM_SECRET: phase10-full-candidate-cache-proof-only
        run: npx playwright test tests/cache-seo-performance.spec.ts

      - name: Stage Phase 9 visual authority beside production captures
        if: always()
        run: |
          mkdir -p evidence/phase10-full-candidate/reference
          cp ../../docs/ui/assets/approved-pattern-in-motion/approved-desktop-landing.png evidence/phase10-full-candidate/reference/
          cp ../../docs/ui/assets/approved-pattern-in-motion/approved-mobile-landing-en.png evidence/phase10-full-candidate/reference/
          cp ../../docs/ui/assets/approved-pattern-in-motion/approved-mobile-landing-ar.png evidence/phase10-full-candidate/reference/
          cp ../../docs/ui/assets/approved-pattern-in-motion/approved-desktop-inspector.png evidence/phase10-full-candidate/reference/
          sha256sum evidence/phase10-full-candidate/reference/approved-*.png > evidence/phase10-full-candidate/reference/SHA256SUMS.txt
          {
            echo "fares_sha=$GITHUB_SHA"
            echo "phase9_visual_authority=4120c33fff9ac7ee6a400a7e51e2e8cbf17ce256"
            echo "phase9_run=35529953588"
            echo "phase9_job=106128675433"
            node --version
            npm --version
            npx next --version
            npx playwright --version
          } > evidence/phase10-full-candidate/runtime.txt

      - name: Upload full-candidate evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase10-full-candidate-${{ github.sha }}
          path: |
            apps/public-web/evidence/phase10-full-candidate
            apps/public-web/evidence/phase10-foundation
            apps/public-web/evidence/phase10-pattern
            apps/public-web/evidence/phase10-accessibility
            apps/public-web/evidence/phase10-enquiry
            apps/public-web/evidence/phase10-cache-seo
            apps/public-web/playwright-report
            apps/public-web/test-results
          if-no-files-found: warn
          retention-days: 14
