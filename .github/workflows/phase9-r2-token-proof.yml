name: Phase 9 R2 delegated-token proof

on:
  push:
    branches:
      - phase-9/public-site-kinetic-prototype
    paths:
      - ".github/workflows/phase9-r2-token-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delegated-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prove ephemeral private-bucket credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

          api_get() {
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$1"
          }

          zone_json="$(api_get 'https://api.cloudflare.com/client/v4/zones?name=faresuniform.uk')"
          account_id="$(jq -r '.result[0].account.id' <<<"$zone_json")"
          test -n "$account_id"

          groups_json="$(api_get "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/permission_groups")"
          group_id="$(jq -r '.result[] | select(.name == "Workers R2 Storage Bucket Item Write") | .id' <<<"$groups_json" | head -n1)"
          test -n "$group_id"

          resource="com.cloudflare.edge.r2.bucket.${account_id}_default_fares-uniform-media-private"
          expires_on="$(date -u -d '+15 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
          payload="$(jq -nc \
            --arg name "phase9-private-proof-${GITHUB_RUN_ID}" \
            --arg group_id "$group_id" \
            --arg resource "$resource" \
            --arg expires_on "$expires_on" \
            '{name:$name,expires_on:$expires_on,policies:[{effect:"allow",resources:{($resource):"*"},permission_groups:[{id:$group_id}]}]}')"

          token_json="$(
            curl --fail-with-body --silent --show-error --retry 3 \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens" \
              --data "$payload"
          )"
          jq -e '.success == true and (.result.id | length) > 0 and (.result.value | length) > 0' <<<"$token_json" >/dev/null

          token_id="$(jq -r '.result.id' <<<"$token_json")"
          token_value="$(jq -r '.result.value' <<<"$token_json")"
          secret_access_key="$(printf '%s' "$token_value" | sha256sum | awk '{print $1}')"

          cleanup() {
            curl --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/$token_id" >/dev/null || true
          }
          trap cleanup EXIT

          curl --fail-with-body --silent --show-error \
            --aws-sigv4 "aws:amz:auto:s3" \
            --user "$token_id:$secret_access_key" \
            "https://$account_id.r2.cloudflarestorage.com/fares-uniform-media-private?list-type=2" \
            -o /tmp/r2-list.xml

          grep -q '<ListBucketResult' /tmp/r2-list.xml
          echo "Ephemeral bucket-scoped R2 credential created, used, and scheduled for revocation"
