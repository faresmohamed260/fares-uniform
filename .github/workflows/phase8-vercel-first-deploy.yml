name: Phase 8 Vercel first live deployment

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-vercel-first-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-vercel-first-live-deploy
  cancel-in-progress: false

env:
  ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
  PRODUCTION_ADDONS: fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api,fu_reporting
  SUPABASE_API_BASE: https://api.supabase.com/v1
  SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek
  SUPABASE_POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
  VERCEL_API_BASE: https://api.vercel.com
  VERCEL_TEAM_ID: team_r09C6RLmb2acHapENECQIn9T
  VERCEL_TEAM_SLUG: faresmohamed260-6733s-projects
  VERCEL_PROJECT_ID: prj_DlKEwDdJZBgfTyaej5hP65Z9NSvS
  VERCEL_PROJECT_NAME: fares-uniform

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact source and credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo 'SUPABASE_ACCESS_TOKEN missing' >&2; exit 64; }
          [[ -n "${VERCEL_TOKEN:-}" ]] || { echo 'VERCEL_TOKEN missing' >&2; exit 64; }
          jq -e '.services.public_web.root == "apps/public-web/" and .services.odoo_http.runtime == "container" and .services.odoo_websocket.runtime == "container"' vercel.json >/dev/null
          test -f Dockerfile.vercel
          test -f deploy/vercel/entrypoint.sh
          test -f deploy/vercel/validation.sh
          echo 'source_and_secret_presence=PASS'

      - name: Verify isolated provider targets and first-deployment boundary
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          vercel_project="$(mktemp)"
          vercel_deployments="$(mktemp)"
          supabase_project="$(mktemp)"
          trap 'rm -f "$vercel_project" "$vercel_deployments" "$supabase_project"' EXIT

          status="$(curl -sS -o "$vercel_project" -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}")"
          test "$status" = 200
          jq -e --arg id "$VERCEL_PROJECT_ID" --arg name "$VERCEL_PROJECT_NAME" --arg team "$VERCEL_TEAM_ID" \
            'select(.id==$id and .name==$name and .accountId==$team)' "$vercel_project" >/dev/null

          status="$(curl -sS -o "$vercel_deployments" -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=20")"
          test "$status" = 200
          test "$(jq -r '.deployments | length' "$vercel_deployments")" = 0

          status="$(curl -sS -o "$supabase_project" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}")"
          test "$status" = 200
          jq -e --arg ref "$SUPABASE_PROJECT_REF" \
            'select((.ref // .id)==$ref or .id==$ref) | select(.name=="Fares Uniform") | select(.region=="eu-central-1") | select(.status=="ACTIVE_HEALTHY")' \
            "$supabase_project" >/dev/null
          echo 'isolated_provider_targets=PASS first_deployment_count=0'

      - name: Build exact Vercel Odoo runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            -f Dockerfile.vercel \
            --build-arg ODOO_SHA="$ODOO_SHA" \
            --build-arg FARES_SHA="$GITHUB_SHA" \
            -t "fares-uniform-vercel:$GITHUB_SHA" .
          test "$(docker image inspect -f '{{json .Config.Volumes}}' "fares-uniform-vercel:$GITHUB_SHA")" = 'null'
          docker run --rm --entrypoint bash "fares-uniform-vercel:$GITHUB_SHA" -lc '
            set -euo pipefail
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            test "$ODOO_SHA" = "1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf"
            test "$FARES_SHA" = "'"$GITHUB_SHA"'"
            test ! -e /mnt/extra-addons/fu_uat
          '
          echo 'exact_runtime_image=PASS'

      - name: Generate masked runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          admin_password="$(openssl rand -hex 32)"
          cron_secret="$(openssl rand -hex 32)"
          for secret in "$db_password" "$admin_password" "$cron_secret"; do
            echo "::add-mask::$secret"
          done
          {
            echo "ODOO_DB_PASSWORD=$db_password"
            echo "ODOO_ADMIN_PASSWD=$admin_password"
            echo "CRON_SECRET=$cron_secret"
          } >> "$GITHUB_ENV"
          echo 'masked_runtime_secrets_generated=PASS'

      - name: Activate least-privileged fares_app role
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          query="ALTER ROLE fares_app LOGIN PASSWORD '${ODOO_DB_PASSWORD}';"
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:false}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          if [[ "$status" != 201 ]]; then
            echo "fares_app activation failed with HTTP ${status}" >&2
            exit 1
          fi
          touch /tmp/fares-role-activated-this-run
          echo 'fares_app_activation=PASS'

      - name: Verify live Session Pooler login and role boundary
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD="$ODOO_DB_PASSWORD"
          pooler_user="fares_app.${SUPABASE_PROJECT_REF}"
          result="$(psql \
            "host=${SUPABASE_POOLER_HOST} port=5432 dbname=postgres user=${pooler_user} sslmode=require connect_timeout=10" \
            -v ON_ERROR_STOP=1 -Atc \
            "SELECT current_database(), current_user, (SELECT rolsuper FROM pg_roles WHERE rolname=current_user), (SELECT rolcreatedb FROM pg_roles WHERE rolname=current_user), (SELECT rolcreaterole FROM pg_roles WHERE rolname=current_user);")"
          test "$result" = 'postgres|fares_app|f|f|f'
          echo 'runtime_pooler_login=PASS least_privilege=PASS tls_mode=require'

      - name: Initialize and repeat-upgrade seven production addons
        shell: bash
        run: |
          set -euo pipefail
          export ODOO_DB_HOST="$SUPABASE_POOLER_HOST"
          export ODOO_DB_PORT=5432
          export ODOO_DB_NAME=postgres
          export ODOO_DB_USER="fares_app.${SUPABASE_PROJECT_REF}"
          export ODOO_DB_SSLMODE=require
          export ODOO_WORKERS=0
          export ODOO_MAX_CRON_THREADS=0
          export FARES_SESSION_STORE=postgres
          export PORT=8069

          for mode in install upgrade; do
            if [[ "$mode" == install ]]; then action=-i; else action=-u; fi
            echo "Running managed-database addon ${mode} pass"
            docker run --rm \
              -e ODOO_DB_HOST -e ODOO_DB_PORT -e ODOO_DB_NAME -e ODOO_DB_USER \
              -e ODOO_DB_PASSWORD -e ODOO_DB_SSLMODE -e ODOO_ADMIN_PASSWD \
              -e ODOO_WORKERS -e ODOO_MAX_CRON_THREADS -e FARES_SESSION_STORE -e PORT \
              "fares-uniform-vercel:$GITHUB_SHA" \
              --stop-after-init "$action" "$PRODUCTION_ADDONS"
          done

          export PGPASSWORD="$ODOO_DB_PASSWORD"
          states="$(psql \
            "host=${SUPABASE_POOLER_HOST} port=5432 dbname=postgres user=fares_app.${SUPABASE_PROJECT_REF} sslmode=require connect_timeout=10" \
            -v ON_ERROR_STOP=1 -Atc \
            "SELECT string_agg(name || '=' || state, ',' ORDER BY name) FROM ir_module_module WHERE name = ANY (ARRAY['fu_core','fu_retail','fu_preorder','fu_production','fu_business','fu_public_api','fu_reporting']);")"
          for addon in fu_core fu_retail fu_preorder fu_production fu_business fu_public_api fu_reporting; do
            [[ ",$states," == *",${addon}=installed,"* ]] || { echo "Addon not installed: $addon" >&2; exit 1; }
          done
          if [[ ",$states," == *',fu_uat=installed,'* ]]; then
            echo 'fu_uat must not be installed in staging runtime' >&2
            exit 1
          fi
          echo 'managed_database_seven_addons_install_upgrade=PASS'

      - name: Inject only required Fares Uniform Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          payload="$(jq -cn \
            --arg host "$SUPABASE_POOLER_HOST" \
            --arg user "fares_app.${SUPABASE_PROJECT_REF}" \
            --arg dbpass "$ODOO_DB_PASSWORD" \
            --arg admin "$ODOO_ADMIN_PASSWD" \
            --arg cron "$CRON_SECRET" \
            '[
              {key:"ODOO_DB_HOST",value:$host,type:"plain",target:["production"]},
              {key:"ODOO_DB_PORT",value:"5432",type:"plain",target:["production"]},
              {key:"ODOO_DB_NAME",value:"postgres",type:"plain",target:["production"]},
              {key:"ODOO_DB_USER",value:$user,type:"plain",target:["production"]},
              {key:"ODOO_DB_SSLMODE",value:"require",type:"plain",target:["production"]},
              {key:"ODOO_DB_PASSWORD",value:$dbpass,type:"encrypted",target:["production"]},
              {key:"ODOO_ADMIN_PASSWD",value:$admin,type:"encrypted",target:["production"]},
              {key:"CRON_SECRET",value:$cron,type:"encrypted",target:["production"]},
              {key:"FARES_SESSION_STORE",value:"postgres",type:"plain",target:["production"]},
              {key:"ODOO_WORKERS",value:"0",type:"plain",target:["production"]},
              {key:"ODOO_MAX_CRON_THREADS",value:"0",type:"plain",target:["production"]}
            ]')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${VERCEL_API_BASE}/v10/projects/${VERCEL_PROJECT_ID}/env?upsert=true&teamId=${VERCEL_TEAM_ID}")"
          if [[ "$status" != 200 && "$status" != 201 ]]; then
            echo "Vercel environment injection failed with HTTP ${status}" >&2
            jq -c '{error:(.error // .)}' "$response" >&2 || true
            exit 1
          fi
          if jq -e '.failed? | type=="array" and length>0' "$response" >/dev/null 2>&1; then
            echo 'Vercel environment injection reported failed entries' >&2
            jq -c '.failed | map({key:(.key // .envVarKey // "unknown"),error:(.error.code // .error.message // "unknown")})' "$response" >&2 || true
            exit 1
          fi
          echo 'vercel_runtime_environment_injected=PASS'

      - name: Verify Vercel environment inventory without reading values
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${VERCEL_API_BASE}/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}")"
          test "$status" = 200
          for key in ODOO_DB_HOST ODOO_DB_PORT ODOO_DB_NAME ODOO_DB_USER ODOO_DB_SSLMODE ODOO_DB_PASSWORD ODOO_ADMIN_PASSWD CRON_SECRET FARES_SESSION_STORE ODOO_WORKERS ODOO_MAX_CRON_THREADS; do
            count="$(jq -r --arg key "$key" '[.envs[] | select(.key==$key and (.target|index("production")))] | length' "$response")"
            test "$count" = 1 || { echo "Expected one production env entry for $key; found $count" >&2; exit 1; }
          done
          for forbidden in SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_URL DATABASE_URL POSTGRES_URL ODOO_BASE_URL FARES_ODOO_HTTP_INTERNAL_URL ODOO_RUNTIME_MODE; do
            count="$(jq -r --arg key "$forbidden" '[.envs[] | select(.key==$key)] | length' "$response")"
            test "$count" = 0 || { echo "Forbidden project-wide env present: $forbidden" >&2; exit 1; }
          done
          echo 'vercel_environment_inventory=PASS'

      - name: Deploy exact Phase 8 candidate to isolated Vercel staging project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_r09C6RLmb2acHapENECQIn9T
          VERCEL_PROJECT_ID: prj_DlKEwDdJZBgfTyaej5hP65Z9NSvS
        shell: bash
        run: |
          set -euo pipefail
          cli_version="$(npm view vercel version)"
          echo "vercel_cli_version=${cli_version}"
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          npx --yes "vercel@${cli_version}" deploy --prod --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --project "$VERCEL_PROJECT_ID" \
            2>&1 | tee "$log"
          deployment_url="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' "$log" | tail -1)"
          [[ -n "$deployment_url" ]] || { echo 'Could not identify Vercel deployment URL' >&2; exit 1; }
          echo "DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"
          echo "deployment_url=$deployment_url"

      - name: Verify deployment is READY and smoke minimal public exposure
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployments="$(mktemp)"
          trap 'rm -f "$deployments"' EXIT
          for attempt in $(seq 1 60); do
            status="$(curl -sS -o "$deployments" -w '%{http_code}' \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${VERCEL_API_BASE}/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=5")"
            test "$status" = 200
            state="$(jq -r '.deployments[0].state // .deployments[0].readyState // ""' "$deployments")"
            if [[ "$state" == READY ]]; then break; fi
            if [[ "$state" == ERROR || "$state" == CANCELED ]]; then
              jq -c '.deployments[0] | {uid,url,state,readyState,created}' "$deployments" >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "Vercel deployment did not become READY; latest state=$state" >&2
              exit 1
            fi
            sleep 5
          done

          curl -fsS --retry 6 --retry-delay 5 "$DEPLOYMENT_URL/" >/dev/null
          noauth_status="$(curl -sS -o /tmp/cron-noauth.json -w '%{http_code}' "$DEPLOYMENT_URL/fares/internal/cron/run")"
          test "$noauth_status" = 401
          echo 'vercel_live_deployment_ready=PASS public_root=PASS cron_noauth_401=PASS'

      - name: Keep activated runtime role after successful deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fares-role-activated-this-run
          echo 'first_live_deployment_activation=COMMITTED'

      - name: Fail closed newly activated database role if this run aborts
        if: ${{ failure() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/fares-role-activated-this-run ]]; then
            echo 'No role activation occurred in this run; cleanup not required.'
            exit 0
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          query="ALTER ROLE fares_app NOLOGIN PASSWORD NULL;"
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:false}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          if [[ "$status" != 201 ]]; then
            echo "WARNING: failed to disable newly activated fares_app role; HTTP ${status}" >&2
            exit 1
          fi
          echo 'failed_run_runtime_role_cleanup=PASS fares_app=NOLOGIN password=NULL'
