name: Phase 2B preorder balance collection

on:
  push:
    branches: ["phase-2b/preorder-balance-collection"]
    paths:
      - "addons/**"
      - ".github/workflows/phase2b-preorder.yml"
  pull_request:
    paths:
      - "addons/**"
      - ".github/workflows/phase2b-preorder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2b-preorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preorder-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2b-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase2b-only
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/runtime.txt
          python --version >> evidence/runtime.txt
          google-chrome --version >> evidence/runtime.txt
          rtlcss --version >> evidence/runtime.txt

      - name: Install diagnostic database without tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag \
            -i fu_core,fu_retail,fu_preorder \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-install.log

      - name: Diagnostic sale.order direct mutation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderDirectMutationBoundary.test_direct_sale_order_mutation_is_denied' \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-sale-order.log

      - name: Diagnostic sale.order.line direct mutation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderDirectMutationBoundary.test_direct_sale_order_line_mutation_is_denied' \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-sale-order-line.log

      - name: Diagnostic account.payment direct mutation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderDirectMutationBoundary.test_direct_account_payment_mutation_is_denied' \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-account-payment.log

      - name: Diagnostic stock.picking direct mutation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderDirectMutationBoundary.test_direct_stock_picking_mutation_is_denied' \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-stock-picking.log

      - name: Diagnostic stock.move direct mutation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderDirectMutationBoundary.test_direct_stock_move_mutation_is_denied' \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-stock-move.log

      - name: Diagnostic POS preorder reservation boundary
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_diag -u fu_preorder \
            --test-enable --test-tags='/fu_preorder:TestPreorderPOSReservationBoundary.test_pos_can_sell_only_free_stock_and_replay_cannot_consume_reservation' \
            --screenshots=evidence/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/diagnostic-pos-reservation.log

      - name: Install addons and run Phase 1 plus Phase 2A plus Phase 2B tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='/fu_core,/fu_retail,/fu_preorder' \
            --screenshots=evidence/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/install-and-tests.log

      - name: Prove repeatable addon upgrade
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b \
            -u fu_core,fu_retail,fu_preorder \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/upgrade.log

      - name: Summarize evidence
        if: always()
        run: |
          {
            echo '## Phase 2B preorder/balance/collection foundation'
            echo
            cat evidence/runtime.txt 2>/dev/null || true
            echo
            echo '### Test summary lines'
            grep -E 'tests? in|failures|errors|fu_core|fu_retail|fu_preorder|Chrome|screenshot' evidence/install-and-tests.log 2>/dev/null | tail -n 140 || true
            echo
            echo '### Hosted screenshots'
            find evidence/screenshots -type f -maxdepth 3 -printf '%P\n' 2>/dev/null | sort || true
          } | tee evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2b-preorder-${{ github.sha }}
          path: evidence/
          retention-days: 7
