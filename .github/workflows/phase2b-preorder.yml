name: Phase 2B preorder balance collection

on:
  push:
    branches: ["phase-2b/preorder-balance-collection"]
    paths:
      - "addons/**"
      - ".github/workflows/phase2b-preorder.yml"
  pull_request:
    paths:
      - "addons/**"
      - ".github/workflows/phase2b-preorder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2b-preorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preorder-fresh-install-bisect:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase2b-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase2b-only
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/runtime.txt
          python --version >> evidence/runtime.txt
          google-chrome --version >> evidence/runtime.txt
          rtlcss --version >> evidence/runtime.txt

      - name: Fresh install with fu_core tests only
        id: corefresh
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_corefresh \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='/fu_core' \
            --screenshots=evidence/screenshots/core \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/fresh-fu-core.log

      - name: Fresh install with fu_retail tests only
        id: retailfresh
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_retailfresh \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='/fu_retail' \
            --screenshots=evidence/screenshots/retail \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/fresh-fu-retail.log

      - name: Fresh install with fu_preorder tests only
        id: preorderfresh
        continue-on-error: true
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase2b-only \
            -d fares_phase2b_preorderfresh \
            -i fu_core,fu_retail,fu_preorder \
            --test-enable --test-tags='/fu_preorder' \
            --screenshots=evidence/screenshots/preorder \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/fresh-fu-preorder.log

      - name: Assert fresh-install diagnostic result is visible
        if: always()
        run: |
          {
            echo '## Phase 2B fresh-install addon bisection'
            echo
            cat evidence/runtime.txt 2>/dev/null || true
            echo
            echo "fu_core=${{ steps.corefresh.outcome }}"
            echo "fu_retail=${{ steps.retailfresh.outcome }}"
            echo "fu_preorder=${{ steps.preorderfresh.outcome }}"
            echo
            echo '### Summary lines'
            grep -hE 'tests? in|failures|errors|ERROR|FAIL' evidence/fresh-*.log 2>/dev/null | tail -n 180 || true
          } | tee evidence/summary.md >> "$GITHUB_STEP_SUMMARY"

          test "${{ steps.corefresh.outcome }}" = success
          test "${{ steps.retailfresh.outcome }}" = success
          test "${{ steps.preorderfresh.outcome }}" = success

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase2b-fresh-bisect-${{ github.sha }}
          path: evidence/
          retention-days: 7
