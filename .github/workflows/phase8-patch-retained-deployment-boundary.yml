name: Phase 8 patch retained deployment boundary

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-patch-retained-deployment-boundary.yml

permissions:
  actions: write
  contents: write

jobs:
  patch-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: phase-8/commercial-staging-readiness
          fetch-depth: 1

      - name: Replace stale zero-deployment precondition only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phase8-vercel-live-deploy-v2.yml')
          text = path.read_text()
          old = '''          test "$status" = 200\n          test "$(jq -r '.deployments | length' "$deployments")" = 0\n          echo 'clean_deployment_boundary=PASS db_clean=true role=NOLOGIN vercel_deployments=0 region=fra1'\n'''
          new = '''          test "$status" = 200\n          deployment_count="$(jq -r '.deployments | length' "$deployments")"\n          retained_boundary=none\n          if [[ "$deployment_count" = 1 ]]; then\n            retained_id="$(jq -r '.deployments[0].uid // .deployments[0].id // ""' "$deployments")"\n            retained_state="$(jq -r '.deployments[0].state // .deployments[0].readyState // ""' "$deployments")"\n            retained_sha="$(jq -r '.deployments[0].meta.githubCommitSha // ""' "$deployments")"\n            test "$retained_id" = 'dpl_9dq5Fnmetypvih4QeeCEMPZQhgdu'\n            test "$retained_state" = READY\n            test "$retained_sha" = '6d273e4eac9cc8b89b6baf7529564b401c875047'\n            retained_boundary=authorized-ready-evidence\n          elif [[ "$deployment_count" != 0 ]]; then\n            echo "Unexpected Vercel deployment inventory: count=$deployment_count" >&2\n            jq -c '.deployments[] | {uid,id,state,readyState,meta:{githubCommitSha:.meta.githubCommitSha}}' "$deployments" >&2\n            exit 1\n          fi\n          echo "clean_deployment_boundary=PASS db_clean=true role=NOLOGIN vercel_deployments=$deployment_count retained_boundary=$retained_boundary region=fra1"\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected stale zero-deployment precondition exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- .github/workflows/phase8-vercel-live-deploy-v2.yml

      - name: Commit bounded workflow correction
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase8-vercel-live-deploy-v2.yml
          git commit -m 'fix(phase8): preserve retained Vercel evidence on redeploy'
          git push origin HEAD:phase-8/commercial-staging-readiness
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected existing live workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/phase8-vercel-live-deploy-v2.yml/dispatches" \
            -f ref='phase-8/commercial-staging-readiness'
          echo "corrected_live_deploy_dispatched=PASS sha=${{ steps.commit.outputs.sha }}"
