name: Phase 8 live database recovery

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-live-db-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase8-live-db-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_API_BASE: https://api.supabase.com/v1
      SUPABASE_PROJECT_REF: urqlxisivowkmsfisjek
    steps:
      - name: Verify control-plane credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo 'SUPABASE_ACCESS_TOKEN missing' >&2; exit 64; }

      - name: Terminate stale runtime sessions and disable login
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          read -r -d '' query <<'SQL' || true
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = 'postgres'
            AND usename = 'fares_app'
            AND pid <> pg_backend_pid();
          ALTER ROLE fares_app NOLOGIN;
          SELECT rolname, rolcanlogin, rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolinherit
          FROM pg_roles
          WHERE rolname = 'fares_app';
          SQL
          payload="$(jq -cn --arg query "$query" '{query:$query}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201 || { echo "recovery SQL failed: HTTP $status" >&2; jq -c '{error:(.error // .)}' "$response" >&2 || true; exit 1; }
          jq -e '.[0] | select(.rolname == "fares_app" and .rolcanlogin == false and .rolsuper == false and .rolcreatedb == false and .rolcreaterole == false and .rolreplication == false and .rolinherit == false)' "$response" >/dev/null
          echo 'fares_app_fail_closed=PASS'

      - name: Verify no runtime sessions remain
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          query="SELECT count(*)::int AS active_fares_app_sessions FROM pg_stat_activity WHERE datname='postgres' AND usename='fares_app';"
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201
          test "$(jq -r '.[0].active_fares_app_sessions' "$response")" = '0'
          echo 'stale_runtime_sessions=0'

      - name: Inspect committed schema after cancellation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          read -r -d '' query <<'SQL' || true
          SELECT
            count(*) FILTER (WHERE c.relname = 'ir_module_module')::int AS ir_module_module_relations,
            count(*) FILTER (WHERE c.relname = 'ir_model_data')::int AS ir_model_data_relations,
            count(*) FILTER (WHERE c.relname = 'res_users')::int AS res_users_relations,
            count(*) FILTER (WHERE c.relname = 'fares_http_session')::int AS session_relations,
            count(*) FILTER (WHERE c.relname LIKE 'fu_%')::int AS fu_prefixed_relations,
            count(*)::int AS public_relation_count
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r','p','v','m','S');
          SQL
          payload="$(jq -cn --arg query "$query" '{query:$query,read_only:true}')"
          status="$(curl -sS -X POST -o "$response" -w '%{http_code}' \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "${SUPABASE_API_BASE}/projects/${SUPABASE_PROJECT_REF}/database/query")"
          test "$status" = 201
          jq -c '.[0]' "$response"
