name: Phase 8 recover live UAT log

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-recover-live-uat-log.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN_ID: 35078985169
  SOURCE_JOB_ID: 104738120056
  SOURCE_HEAD_SHA: 840b623340234518a1f58a6145ce7bc4f8eb0c19

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify source RED job identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/source-job.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}" \
            -o "$meta"
          test "$(jq -r '.run_id' "$meta")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.head_sha' "$meta")" = "$SOURCE_HEAD_SHA"
          test "$(jq -r '.conclusion' "$meta")" = failure
          echo "phase8_red_job_identity=PASS run=$SOURCE_RUN_ID job=$SOURCE_JOB_ID sha=$SOURCE_HEAD_SHA"

      - name: Recover focused masked diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_log="$RUNNER_TEMP/source-job.log"
          diagnostic="$RUNNER_TEMP/phase8-live-uat-red-diagnostic.log"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" \
            -o "$source_log"
          python - "$source_log" "$diagnostic" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          markers = [line for line in lines if "phase8_uat_" in line or "phase8_live_business_uat=" in line]
          needles = (
              "Traceback (most recent call last):",
              "AssertionError",
              "ValidationError",
              "AccessError",
              "odoo.exceptions",
              "psycopg2",
              " CRITICAL ",
              " ERROR ",
              "##[error]",
          )
          hits = [i for i, line in enumerate(lines) if any(needle in line for needle in needles)]
          if hits:
              anchor = hits[-1]
              start = max(0, anchor - 140)
              end = min(len(lines), anchor + 220)
              focused = lines[start:end]
          else:
              focused = lines[-1600:]
          output = [
              f"source_run={35078985169}",
              f"source_job={104738120056}",
              f"source_head={840b623340234518a1f58a6145ce7bc4f8eb0c19}",
              "",
              "=== UAT PASS MARKERS ===",
              *markers,
              "",
              "=== FOCUSED FAILURE CONTEXT ===",
              *focused,
              "",
          ]
          target.write_text("\n".join(output), encoding="utf-8")
          PY
          test -s "$diagnostic"
          echo "phase8_red_diagnostic=PASS lines=$(wc -l < "$diagnostic")"

      - name: Upload focused RED diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase8-live-uat-red-diagnostic
          path: ${{ runner.temp }}/phase8-live-uat-red-diagnostic.log
          if-no-files-found: error
          retention-days: 7
