name: Phase 8 recover live UAT log

on:
  push:
    branches:
      - phase-8/commercial-staging-readiness
    paths:
      - .github/workflows/phase8-recover-live-uat-log.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  statuses: write

env:
  SOURCE_RUN_ID: 35078985169
  SOURCE_JOB_ID: 104738120056
  SOURCE_HEAD_SHA: 840b623340234518a1f58a6145ce7bc4f8eb0c19

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify source RED job identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          meta="$RUNNER_TEMP/source-job.json"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}" \
            -o "$meta"
          test "$(jq -r '.run_id' "$meta")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.head_sha' "$meta")" = "$SOURCE_HEAD_SHA"
          test "$(jq -r '.conclusion' "$meta")" = failure
          echo "phase8_red_job_identity=PASS run=$SOURCE_RUN_ID job=$SOURCE_JOB_ID sha=$SOURCE_HEAD_SHA"

      - name: Recover masked transaction-step diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-run-logs.zip"
          logs_dir="$RUNNER_TEMP/source-run-logs"
          diagnostic="$RUNNER_TEMP/phase8-live-uat-red-diagnostic.log"
          status_text="$RUNNER_TEMP/phase8-live-uat-red-status.txt"
          mkdir -p "$logs_dir"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" \
            -o "$archive"
          unzip -q "$archive" -d "$logs_dir"
          source_log=""
          while IFS= read -r candidate; do
            if grep -q 'PHASE8_UAT_RUN_ID' "$candidate"; then
              source_log="$candidate"
              break
            fi
          done < <(find "$logs_dir" -type f -name '*.txt' -print)
          test -n "$source_log"
          cp "$source_log" "$diagnostic"
          python - "$source_log" "$status_text" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1])
          status_target = Path(sys.argv[2])
          lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
          specific = (
              "AssertionError",
              "ValidationError",
              "AccessError",
              "UserError",
              "MissingError",
              "KeyError",
              "TypeError",
              "AttributeError",
              "ValueError",
              "RuntimeError",
              "odoo.exceptions",
              "psycopg2.errors",
              "Exception:",
          )
          specific_hits = [line for line in lines if any(needle in line for needle in specific)]
          if specific_hits:
              description = specific_hits[-1]
          else:
              fallback = [line for line in lines if "##[error]" in line or " ERROR " in line or " CRITICAL " in line]
              description = fallback[-1] if fallback else "Phase 8 UAT transaction step failed without a recognized exception line"
          description = re.sub(r"^\d{4}-\d{2}-\d{2}T[^ ]+\s+", "", description).strip()
          if len(description) > 140:
              description = description[:137] + "..."
          status_target.write_text(description, encoding="utf-8")
          PY
          test -s "$diagnostic"
          test -s "$status_text"
          echo "phase8_red_transaction_log=PASS file=$(basename "$source_log") lines=$(wc -l < "$diagnostic")"

      - name: Publish final exception as commit status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          description="$(cat "$RUNNER_TEMP/phase8-live-uat-red-status.txt")"
          payload="$(jq -cn --arg state error --arg context 'phase8/uat-red-diagnostic' --arg description "$description" '{state:$state,context:$context,description:$description}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD_SHA}" \
            > /dev/null
          echo "phase8_red_status=PASS description=$description"

      - name: Upload masked transaction-step RED diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase8-live-uat-red-diagnostic
          path: ${{ runner.temp }}/phase8-live-uat-red-diagnostic.log
          if-no-files-found: error
          retention-days: 7
