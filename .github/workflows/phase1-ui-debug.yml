name: Phase 1 UI diagnostic

on:
  push:
    branches: ["phase-1/products-stock-access"]
    paths:
      - ".github/workflows/phase1-ui-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase1-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase1-only
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p diagnostic/screenshots
          printf 'fares_head=%s\nodoo_head=%s\n' "$GITHUB_SHA" "$(git -C upstream rev-parse HEAD)" > diagnostic/runtime.txt
          google-chrome --version >> diagnostic/runtime.txt
          rtlcss --version >> diagnostic/runtime.txt

      - name: Install fu_core without tests
        run: |
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase1-only \
            -d fares_phase1_ui_debug -i fu_core \
            --stop-after-init --http-interface=127.0.0.1 \
            --log-level=warn

      - name: Run only bilingual browser tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase1-only \
            -d fares_phase1_ui_debug -u fu_core \
            --test-enable --test-tags='/fu_core:TestFaresBilingualUI' \
            --screenshots=diagnostic/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            --log-level=warn \
            2>&1 | tee diagnostic/browser-tests.log

      - name: Print decisive diagnostic tail
        if: always()
        run: |
          echo '===== runtime ====='
          cat diagnostic/runtime.txt 2>/dev/null || true
          echo '===== browser test tail ====='
          tail -n 220 diagnostic/browser-tests.log 2>/dev/null || true
          echo '===== screenshots ====='
          find diagnostic/screenshots -type f -printf '%P\n' 2>/dev/null | sort || true

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase1-ui-diagnostic-${{ github.sha }}
          path: diagnostic/
          retention-days: 3
