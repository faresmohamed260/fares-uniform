name: Phase 4A public catalog

on:
  push:
    branches: ["phase-4a/public-catalog-enquiry"]
    paths:
      - "addons/**"
      - ".github/workflows/phase4a-public.yml"
      - "apps/public-web/**"
  pull_request:
    paths:
      - "addons/**"
      - ".github/workflows/phase4a-public.yml"
      - "apps/public-web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4a-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  odoo-public-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: phase4a-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: phase4a-only
      ODOO_SHA: 1a13ceeaee12fe5cc50f287c31f217d4be2a2eaf
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout Fares exact head
        uses: actions/checkout@v5

      - name: Checkout pinned Odoo Community 19
        uses: actions/checkout@v5
        with:
          repository: odoo/odoo
          ref: ${{ env.ODOO_SHA }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Odoo dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev
          python -m pip install -r upstream/requirements.txt
          python -m pip install websocket-client
          sudo npm install --global rtlcss@4.3.0
          mkdir -p evidence/odoo/screenshots
          printf 'fares_head=%s\n' "$GITHUB_SHA" > evidence/odoo/runtime.txt
          printf 'odoo_head=%s\n' "$(git -C upstream rev-parse HEAD)" >> evidence/odoo/runtime.txt
          python --version >> evidence/odoo/runtime.txt
          google-chrome --version >> evidence/odoo/runtime.txt
          rtlcss --version >> evidence/odoo/runtime.txt

      - name: Install addons and run Phase 1 through Phase 4A tests
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase4a-only \
            -d fares_phase4a \
            -i fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api \
            --test-enable --test-tags='/fu_core,/fu_retail,/fu_preorder,/fu_production,/fu_business,/fu_public_api' \
            --screenshots=evidence/odoo/screenshots \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/odoo/install-and-tests.log

      - name: Prove repeatable six-addon upgrade
        run: |
          set -o pipefail
          python upstream/odoo-bin \
            --addons-path=upstream/addons,addons \
            --db_host=127.0.0.1 --db_user=odoo --db_password=phase4a-only \
            -d fares_phase4a \
            -u fu_core,fu_retail,fu_preorder,fu_production,fu_business,fu_public_api \
            --stop-after-init --http-interface=127.0.0.1 \
            2>&1 | tee evidence/odoo/upgrade.log

      - name: Summarize Odoo evidence
        if: always()
        run: |
          {
            echo '## Phase 4A public catalog — Odoo boundary'
            echo
            cat evidence/odoo/runtime.txt 2>/dev/null || true
            echo
            echo '### Test summary lines'
            grep -E 'tests? in|failures|errors|fu_core|fu_retail|fu_preorder|fu_production|fu_business|fu_public_api|TestFaresPublic' evidence/odoo/install-and-tests.log 2>/dev/null | tail -n 320 || true
          } | tee evidence/odoo/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-head Odoo evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase4a-odoo-${{ github.sha }}
          path: evidence/odoo/
          retention-days: 7
